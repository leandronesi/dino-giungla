<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Dino Giungla — un piccolo mondo di giochi per bambini: conta i frutti, intreccia i fili, cresci il nido.">
<meta name="theme-color" content="#123d29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Giungla">
<title>Dino Giungla</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  overflow: hidden; background: #0b2418;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none; touch-action: none;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#c { position: fixed; inset: 0; display: block; touch-action: none; }

/* ---- text entry overlay (only place we use DOM: we want the native keyboard) ---- */
#ovl {
  position: fixed; inset: 0; display: none; z-index: 10;
  align-items: center; justify-content: center;
  background: rgba(8, 26, 18, .72); backdrop-filter: blur(3px);
  padding: 16px;
}
#ovl.on { display: flex; }
#ovl .card {
  background: #fff6e0; border: 6px solid #7a4a26; border-radius: 26px;
  padding: 22px 24px; width: min(460px, 92vw);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
#ovl h2 { margin: 0 0 14px; font-size: 24px; color: #2b1d12; font-weight: 800; }
#ovl input {
  width: 100%; font-size: 26px; padding: 12px 14px; border-radius: 14px;
  border: 4px solid #cdb389; background: #fffdf6; color: #2b1d12;
  font-family: inherit; font-weight: 700; outline: none;
}
#ovl input:focus { border-color: #2f8f4e; }
#ovl .row { display: flex; gap: 12px; margin-top: 18px; }
#ovl button {
  flex: 1; font-size: 22px; font-weight: 800; padding: 14px 10px;
  border-radius: 16px; border: none; color: #fff; font-family: inherit;
  cursor: pointer; min-height: 60px;
}
#ovl .ok { background: #2f8f4e; }
#ovl .no { background: #a8998a; }

/* ---- portrait nudge ---- */
#rot {
  position: fixed; inset: 0; display: none; z-index: 20;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #123d29; color: #fff6e0; text-align: center; padding: 30px;
}
#rot.on { display: flex; }
#rot .ico { font-size: 84px; animation: tilt 1.8s ease-in-out infinite; }
#rot p { font-size: 26px; font-weight: 800; margin: 0; line-height: 1.35; }
@keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }

@media (prefers-reduced-motion: reduce) { #rot .ico { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ovl" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="ovl-t">Come ti chiami?</h2>
    <input id="ovl-i" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="14">
    <div class="row">
      <button class="no" id="ovl-n">Annulla</button>
      <button class="ok" id="ovl-y">Va bene</button>
    </div>
  </div>
</div>

<div id="rot"><div class="ico">📱</div><p>Gira il tablet<br>di lato!</p></div>

<script>
/* ==================== 00-core.js ==================== */
/* Dino Giungla — core engine.
   Fixed 1280x720 logical world, letterboxed. Canvas only, no assets, no deps.
   Everything a scene needs hangs off the global `G`. */
(function () {
  'use strict';

  var W = 1280, H = 720;
  var G = (window.G = { W: W, H: H, t: 0, dt: 0, frame: 0 });

  /* ---------------------------------------------------------------- palette */
  G.C = {
    leaf: '#2f8f4e', leafDark: '#1c5c33', leafLight: '#63c777', leafDeep: '#123d29',
    bark: '#7a4a26', barkDark: '#4e2f18',
    sky: '#8fd8e8', skyDeep: '#4bb6d6', sun: '#ffd75e',
    sand: '#f2d9a8', water: '#3fb6c9',
    cream: '#fff6e0', ink: '#2b1d12', shadow: 'rgba(20,10,0,.22)',
    berry: '#e8536b', plum: '#8f5bd6', tangerine: '#ff9f43', mint: '#38d9a9',
    pinkPop: '#ff6fae', blueberry: '#4d80e4',
    dino: '#57c98a', dinoDark: '#379a67', dinoBelly: '#f6e7c1'
  };

  /* ------------------------------------------------------------------ maths */
  G.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  G.lerp = function (a, b, t) { return a + (b - a) * t; };
  G.ease = function (t) { t = G.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  G.easeIn = function (t) { t = G.clamp(t, 0, 1); return t * t * t; };
  G.easeInOut = function (t) { t = G.clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  G.easeBack = function (t) { t = G.clamp(t, 0, 1); var c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  G.rnd = function (a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); };
  G.rndi = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
  G.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  G.shuffle = function (arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  G.dist = function (ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); };

  /* ------------------------------------------------------------- canvas fit */
  var cv = document.getElementById('c');
  var ctx = (G.ctx = cv.getContext('2d', { alpha: false }));
  var view = { s: 1, ox: 0, oy: 0, dpr: 1 };
  G.view = view;
  var rotEl = document.getElementById('rot');

  function resize() {
    var cw = window.innerWidth, ch = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    view.dpr = dpr;
    view.s = Math.min(cw / W, ch / H);
    view.ox = (cw - W * view.s) / 2;
    view.oy = (ch - H * view.s) / 2;
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    ctx.imageSmoothingEnabled = true;
    if (rotEl) rotEl.classList.toggle('on', ch > cw * 1.08);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* -------------------------------------------------------------- draw help */
  var FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif';
  G.font = function (size, weight) { return (weight || 900) + ' ' + size + 'px ' + FONT; };

  G.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    c.save();
    c.font = G.font(o.size || 32, o.weight);
    c.textAlign = o.align || 'center';
    c.textBaseline = o.baseline || 'middle';
    if (o.stroke) {
      c.lineWidth = o.strokeWidth || Math.max(4, (o.size || 32) * .16);
      c.strokeStyle = o.stroke; c.lineJoin = 'round';
      c.strokeText(str, x, y, o.maxWidth);
    }
    c.fillStyle = o.color || G.C.ink;
    c.fillText(str, x, y, o.maxWidth);
    c.restore();
  };

  G.roundRect = function (c, x, y, w, h, r) {
    r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  G.shadow = function (c, blur, color, dy) {
    c.shadowBlur = blur; c.shadowColor = color || G.C.shadow;
    c.shadowOffsetX = 0; c.shadowOffsetY = dy === undefined ? blur * .35 : dy;
  };
  G.noShadow = function (c) { c.shadowBlur = 0; c.shadowColor = 'transparent'; c.shadowOffsetX = 0; c.shadowOffsetY = 0; };

  /* ------------------------------------------------------------------ audio */
  var AC = null, master = null, noiseBuf = null;
  function audio() {
    if (AC) return AC;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = .5;
    master.connect(AC.destination);
    var n = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate), d = n.getChannelData(0), i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = n;
    return AC;
  }
  G.resumeAudio = function () { var a = audio(); if (a && a.state === 'suspended') a.resume(); };

  function tone(freq, at, dur, type, gain, slideTo) {
    var a = audio(); if (!a) return;
    var t0 = a.currentTime + at;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || .22, t0 + Math.min(.02, dur * .3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(at, dur, gain, freq) {
    var a = audio(); if (!a || !noiseBuf) return;
    var t0 = a.currentTime + at;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1400; f.Q.value = .8;
    g.gain.setValueAtTime(gain || .18, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur);
  }

  var SFX = {
    tap: function () { tone(680, 0, .07, 'sine', .16, 880); },
    pop: function () { tone(900, 0, .12, 'sine', .2, 420); },
    good: function () { tone(523, 0, .12, 'triangle', .2); tone(659, .09, .12, 'triangle', .2); tone(784, .18, .2, 'triangle', .22); },
    bad: function () { tone(320, 0, .16, 'sine', .16, 240); },
    coin: function () { tone(1180, 0, .07, 'square', .1); tone(1560, .06, .12, 'square', .1); },
    chime: function () { tone(1046, 0, .5, 'sine', .16); tone(1568, .02, .45, 'sine', .07); },
    whoosh: function () { noise(0, .22, .1, 900); },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * .1, .3, 'triangle', .2); });
      tone(1318, .42, .5, 'sine', .14);
    },
    hatch: function () { noise(0, .1, .12, 2400); tone(600, .08, .2, 'triangle', .18, 1000); }
  };
  G.sfx = function (name) {
    if (G.save && G.save.mute) return;
    var f = SFX[name]; if (f) { audio(); if (AC) f(); }
  };

  /* ----------------------------------------------------------------- speech */
  var voice = null, voiceTried = false;
  function findVoice() {
    if (!window.speechSynthesis) return null;
    var vs = speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    return vs.filter(function (v) { return /^it/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis) {
    speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', function () { voice = findVoice(); });
  }
  G.say = function (str, o) {
    if (!window.speechSynthesis || !str) return;
    if (G.save && G.save.mute) return;
    o = o || {};
    if (!voiceTried) { voice = findVoice(); voiceTried = true; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(str));
      u.lang = 'it-IT';
      if (voice) u.voice = voice;
      u.rate = o.rate || .95;
      u.pitch = o.pitch || 1.15;
      u.volume = o.volume === undefined ? 1 : o.volume;
      speechSynthesis.speak(u);
    } catch (e) { /* speech is a bonus, never a blocker */ }
  };
  G.hush = function () { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} };

  /* ---------------------------------------------------------------- storage */
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  G.LS = LS;

  var K_ACCTS = 'dg.accounts', K_LAST = 'dg.last', K_SAVE = 'dg.save.';

  function blankSave() {
    return {
      fruits: 0, stars: 0, mute: false, hat: null, hats: [],
      conta: {}, fili: {}, nido: {}, seen: {}, playSec: 0, updated: 0
    };
  }
  function fillSave(s) {
    var b = blankSave(), k;
    for (k in b) if (s[k] === undefined || s[k] === null) s[k] = b[k];
    return s;
  }

  G.account = null;
  G.profile = null;
  G.level = 1;
  G.save = blankSave();

  var saveTimer = 0, saveDirty = false;
  function writeSave() {
    if (!G.account) return;
    G.save.updated = Date.now();
    LS.set(K_SAVE + G.account.id, G.save);
    saveDirty = false;
    if (G.cloud && G.cloud.push) G.cloud.push();
  }
  G.saveNow = function () { saveDirty = true; };
  G.saveFlush = writeSave;

  G.accounts = {
    list: function () { return LS.get(K_ACCTS, []); },
    byId: function (id) { return G.accounts.list().filter(function (a) { return a.id === id; })[0] || null; },
    create: function (o) {
      var list = G.accounts.list();
      var acct = {
        id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
        name: (o.name || 'Dino').slice(0, 14),
        color: o.color || G.C.dino,
        level: o.level === 2 ? 2 : 1,
        secret: o.secret && o.secret.length ? o.secret : null,
        created: Date.now()
      };
      list.push(acct);
      LS.set(K_ACCTS, list);
      LS.set(K_SAVE + acct.id, blankSave());
      return acct;
    },
    update: function (id, patch) {
      var list = G.accounts.list(), i;
      for (i = 0; i < list.length; i++) if (list[i].id === id) {
        for (var k in patch) list[i][k] = patch[k];
        LS.set(K_ACCTS, list);
        if (G.account && G.account.id === id) G.account = list[i];
        return list[i];
      }
      return null;
    },
    remove: function (id) {
      LS.set(K_ACCTS, G.accounts.list().filter(function (a) { return a.id !== id; }));
      LS.del(K_SAVE + id);
      if (LS.get(K_LAST, null) === id) LS.del(K_LAST);
    },
    login: function (id) {
      var a = G.accounts.byId(id);
      if (!a) return false;
      G.account = a;
      G.profile = a.id;
      G.level = a.level;
      G.save = fillSave(LS.get(K_SAVE + id, blankSave()));
      LS.set(K_LAST, id);
      if (G.cloud && G.cloud.pull) G.cloud.pull();
      return true;
    },
    logout: function () {
      writeSave();
      G.hush();
      G.account = null; G.profile = null; G.save = blankSave();
      LS.del(K_LAST);
    },
    last: function () { return LS.get(K_LAST, null); }
  };

  /* ------------------------------------------------------------------ input */
  var pointer = { x: 0, y: 0, down: false, id: null };
  G.pointer = pointer;

  function toLogical(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.ox) / view.s,
      y: (clientY - r.top - view.oy) / view.s
    };
  }

  /* --------------------------------------------------- immediate-mode UI */
  var uiRects = [];       // registered this frame
  var uiHot = [];         // registered last frame (what the pointer tests against)
  var pressedKey = null;
  var ui = (G.ui = {});

  function rectKey(o) { return o.id || (o.label || '') + '|' + Math.round(o.x) + ',' + Math.round(o.y) + ',' + Math.round(o.w) + ',' + Math.round(o.h); }

  function shade(hex, amt) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return hex;
    var f = function (h) { return G.clamp(Math.round(parseInt(h, 16) + amt), 0, 255); };
    var to = function (v) { return ('0' + v.toString(16)).slice(-2); };
    return '#' + to(f(m[1])) + to(f(m[2])) + to(f(m[3]));
  }
  G.shade = shade;

  ui.button = function (o) {
    var c = o.ctx || ctx;
    var key = rectKey(o);
    var down = pressedKey === key && !o.disabled;
    var r = o.r === undefined ? Math.min(26, o.h * .32) : o.r;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.leaf);
    var dy = down ? 5 : 0;

    c.save();
    c.globalAlpha = o.disabled ? .72 : 1;
    if (o.ghost) {
      // Invisible hit area over artwork drawn by the scene (e.g. a player card).
      if (down) {
        c.fillStyle = 'rgba(20,10,0,.14)';
        G.roundRect(c, o.x, o.y, o.w, o.h, r); c.fill();
      }
    } else {
      // base (the "3d" underside)
      c.fillStyle = shade(col, -48);
      G.roundRect(c, o.x, o.y + 7, o.w, o.h, r); c.fill();
      // face
      var g = c.createLinearGradient(0, o.y + dy, 0, o.y + o.h + dy);
      g.addColorStop(0, shade(col, 26)); g.addColorStop(1, col);
      c.fillStyle = g;
      G.roundRect(c, o.x, o.y + dy, o.w, o.h, r); c.fill();
      // gloss
      c.fillStyle = 'rgba(255,255,255,.20)';
      G.roundRect(c, o.x + o.w * .06, o.y + dy + o.h * .10, o.w * .88, o.h * .30, r * .7); c.fill();
    }

    var cx = o.x + o.w / 2, cy = o.y + dy + o.h / 2;
    if (o.icon) {
      var isz = o.iconSize || Math.min(o.w, o.h) * .52;
      o.icon(c, o.label ? o.x + o.h * .58 : cx, cy, isz);
    }
    if (o.label) {
      var tx = o.icon ? cx + o.h * .26 : cx;
      G.text(o.label, tx, o.sub ? cy - o.h * .12 : cy, {
        ctx: c, size: o.fontSize || Math.min(o.h * .40, 46),
        color: o.textColor || '#fff', stroke: o.outline || 'rgba(0,0,0,.22)',
        maxWidth: o.w - (o.icon ? o.h * .9 : o.w * .12)
      });
      if (o.sub) G.text(o.sub, tx, cy + o.h * .24, { ctx: c, size: o.h * .21, color: 'rgba(255,255,255,.9)', weight: 700 });
    }
    c.restore();

    if (!o.disabled) uiRects.push({ key: key, x: o.x, y: o.y, w: o.w, h: o.h, onTap: o.onTap, silent: o.silent, round: false });
    return down;
  };

  ui.round = function (o) {
    var c = o.ctx || ctx;
    var key = o.id || 'r' + Math.round(o.x) + ',' + Math.round(o.y);
    var down = pressedKey === key && !o.disabled;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.cream);
    var dy = down ? 4 : 0;
    c.save();
    c.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
    c.fillStyle = shade(col, -50);
    c.beginPath(); c.arc(o.x, o.y + 6, o.r, 0, 7); c.fill();
    c.fillStyle = col;
    c.beginPath(); c.arc(o.x, o.y + dy, o.r, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.25)';
    c.beginPath(); c.arc(o.x, o.y + dy - o.r * .22, o.r * .74, Math.PI, 0); c.fill();
    if (o.icon) o.icon(c, o.x, o.y + dy, o.r * 1.05);
    c.restore();
    if (!o.disabled) uiRects.push({ key: key, x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2, onTap: o.onTap, silent: o.silent, round: true, cx: o.x, cy: o.y, cr: o.r });
    return down;
  };

  function hitTest(p) {
    var i, r;
    for (i = uiHot.length - 1; i >= 0; i--) {
      r = uiHot[i];
      if (r.round) { if (G.dist(p.x, p.y, r.cx, r.cy) <= r.cr + 12) return r; }
      else if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) return r;
    }
    return null;
  }

  /* ----------------------------------------------------------------- scenes */
  var scenes = {};
  var cur = null, curName = '';
  var fade = { a: 0, dir: 0, next: null, params: null };
  G.current = '';

  G.scene = function (name, obj) { scenes[name] = obj; obj._name = name; return obj; };
  G.go = function (name, params) {
    if (!scenes[name]) { console.warn('scena assente:', name); return; }
    if (fade.dir === 1) return;                 // a transition is already under way
    fade.dir = 1; fade.next = name; fade.params = params || null;
    G.hush();
  };
  G.home = function () { G.go('giungla'); };

    cur = scenes[name]; curName = name; G.current = name;
    if (cur && cur.enter) cur.enter(params || null);

  };
})();

/* Dino Giungla — wearable gear (namespace `A`, extends 01-art.js).
   Four slots: `testa` (the eight hats of 01b-art-world.js), `occhi`, `collo`,
   `coda`. The catalogue below is the single list the wardrobe reads.

   Every entry carries a REACTION — {pose, say} — and that is the whole point of
   the wardrobe: put the nightcap on and the dino really falls asleep, put the
   wizard hat on and he really starts thinking. The five poses already exist in
   A.dino, so the strongest reward in the game costs no drawing at all.

   HARD RULE for painters: never draw a letter, a digit or a logo. Everything
   here is rendered inside A.dino's ctx.scale(face, 1), so it mirrors when the
   dino walks left. Symmetric shapes survive that; glyphs would come out
   backwards. See the sleeping z's in 01-art.js, drawn outside the transform.

      _shape(c, i % 2 ? _shade(col, 20) : col, lw * 0.75);

  function pLampada(c, x, y, s, o) {
    var col = pick(COL.lampada, o), r = s * 0.42, h = s * 1.15, lw = _lw(s);
    _ell(c, x, y - r * 0.16 * A.TILT, r * 0.56, r * 0.56 * A.TILT, 0);

    c.strokeStyle = C.bark || '#7a4a26'; c.lineWidth = lw * 0.9;
    c.beginPath(); c.moveTo(x, y - r * 0.2); c.lineTo(x, y - h + r * 0.5); c.stroke();
    c.save();                                       // pool of light
    c.globalAlpha = 0.26; c.fillStyle = col;

    c.lineTo(x + r * 0.86, y - h + r * 0.62);
    c.lineTo(x + r * 2.0, y);
    c.lineTo(x - r * 2.0, y);
    c.closePath(); c.fill();
    c.restore();

    c.moveTo(x - r * 0.86, y - h + r * 0.62);
    c.lineTo(x - r * 0.52, y - h);
    c.lineTo(x + r * 0.52, y - h);
    c.lineTo(x + r * 0.86, y - h + r * 0.62);
    c.closePath();

  function pFinestra(c, x, y, s, o) {
    var col = pick(COL.finestra, o), w = s, h = s * 0.78, lw = _lw(s);
    var top = y - h;

    c.strokeStyle = INK; c.lineWidth = lw * 0.8;
    G.roundRect(c, x - w / 2, top, w, h, 10); c.stroke();
    c.strokeStyle = col; c.lineWidth = lw * 1.4;    // mullions
    c.beginPath();
    c.moveTo(x, top + 6); c.lineTo(x, top + h - 6);
    c.moveTo(x - w / 2 + 6, top + h / 2); c.lineTo(x + w / 2 - 6, top + h / 2);

  /* The dino DOES NOT LIE DOWN — verified in 01-art.js: the `sleep` pose closes
     the eyes and lifts the arms but the geometry stays anchored at the feet. So
     he dozes standing on the mattress and the blanket is drawn IN FRONT of him,
     hiding the legs. That is what `front` painters are for. */
  function pLettino(c, x, y, s, o) {
    var col = pick(COL.lettino, o), w = s, h = s * 0.30, lw = _lw(s);

    c.lineTo(x - w * 0.5, y - h - s * 0.34);

  function pLettinoFront(c, x, y, s, o) {

    c.moveTo(x - w * 0.16, y - h + w * 0.5 * A.TILT * 0.2);
    c.quadraticCurveTo(x + w * 0.16, y - h - s * 0.12, x + w * 0.5, y - h);
    c.lineTo(x + w * 0.5, y - h + w * 0.5 * A.TILT);
    c.quadraticCurveTo(x + w * 0.1, y - h + w * 0.5 * A.TILT * 1.5, x - w * 0.16, y - h + w * 0.5 * A.TILT * 0.6);
    c.closePath();

    c.beginPath();
    c.moveTo(x + w * 0.06, y - h - s * 0.02); c.lineTo(x + w * 0.12, y - h + w * 0.5 * A.TILT * 0.9);
    c.moveTo(x + w * 0.30, y - h - s * 0.04); c.lineTo(x + w * 0.34, y - h + w * 0.5 * A.TILT * 0.7);

    for (i = 0; i < 3; i++) {                       // deterministic fish
      fx = x - w * 0.32 + _rnd(i * 4 + 1) * w * 0.64 + Math.sin((G.t || 0) * 0.7 + i * 2) * w * 0.12;

  /* The door between the two rooms. Pure elevation, no vanishing point, so it
     obeys the same ban on perspective as everything else in this file.
     `o.side` is -1 for a door on the left wall, 1 for the right. */
  A.porta = function (c, cx, groundY, s, o) {

    c.fillStyle = '#3a2414';                                  // the dark beyond
    G.roundRect(c, cx - w / 2, top, w, h, 6); c.fill();

    G.roundRect(c, cx - w / 2, top, w, h, 6); c.clip();

    c.fill();
    c.restore();

  A.HOUSE = {
    tappeto: pTappeto, ciotola: pCiotola, pouf: pPouf, pianta: pPianta,

    casetta: pCasettaPulcini, amaca: pAmaca, acquario: pAcquario, albero: pAlbero

  A.house = function (c, id, x, y, s, o) {

/* ==================== 02-cloud.js ==================== */
/* Optional cloud save. Off by default: the game is fully playable offline.
   Set SYNC_URL to a tiny key/value endpoint (see server/worker.js in the repo)
   and the same account will follow a child from the tablet to the browser. */
(function () {
  'use strict';

  var SYNC_URL = '';        // e.g. 'https://dino-giungla.<tuo-nome>.workers.dev'

  var cloud = (G.cloud = { on: !!SYNC_URL, state: 'off', last: 0 });
  if (!SYNC_URL) { cloud.push = function () {}; cloud.pull = function () {}; return; }

  var pending = null, timer = 0;

  function url(path) { return SYNC_URL.replace(/\/+$/, '') + path; }

  cloud.pull = function () {
    if (!G.account) return;
    cloud.state = 'sync';
    fetch(url('/save/' + encodeURIComponent(G.account.id)), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.save) { cloud.state = 'ok'; return; }
        // Last write wins, and only if the remote copy is genuinely newer.
        if ((d.save.updated || 0) > (G.save.updated || 0) + 1500) {
          G.save = d.save;
          G.LS.set('dg.save.' + G.account.id, G.save);
        }
        cloud.state = 'ok';
      })
      .catch(function () { cloud.state = 'err'; });
  };

  cloud.push = function () {
    if (!G.account) return;
    pending = { id: G.account.id, name: G.account.name, save: G.save };
    if (timer) return;
    timer = setTimeout(function () {
      timer = 0;
      var body = pending; pending = null;
      if (!body) return;
      cloud.state = 'sync';
      fetch(url('/save/' + encodeURIComponent(body.id)), {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      })
        .then(function () { cloud.state = 'ok'; cloud.last = Date.now(); })
        .catch(function () { cloud.state = 'err'; });
    }, 4000);
  };
})();


/* ==================== 10-overworld.js ==================== */
/* Dino Giungla — "giungla": the overworld hub.
   A place, not a menu: the child taps the trail and the dino walks there;
   tapping a station sign makes him walk to it and only then the minigame opens.
   Owns no save branch of its own — it only writes G.save.seen.giungla. */
(function () {
  'use strict';

  var W = G.W;

  /* The jungle is TWICE as wide as the screen and the camera follows the dino.
     Four signs already crowded one screenful — the name plaques were running off
     the left edge and colliding with each other — and a fifth place would have
     been impossible. Two arrows jump between the halves for anyone who does not
     want to walk. */
  var WORLD_W = 2560;
  var MAXCAM = WORLD_W - 1280;
  var cam = 0;              // current camera x, world coordinates
  var camHold = null;       // an arrow pinned the view here; walking releases it

  /* ------------------------------------------------------------- the trail */
  /* Hand-placed control points, smoothed into a polyline once at load time.
     The trail lives low on the screen, well clear of the HUD band (y < 96). */
  var CP = [
    [96, 664], [214, 628], [318, 568], [432, 552], [548, 598],
    [666, 640], [788, 622], [880, 560], [978, 514], [1096, 496], [1198, 528],
    [1320, 588], [1444, 632], [1566, 614], [1680, 554], [1794, 510],
    [1912, 526], [2030, 586], [2150, 634], [2272, 602], [2384, 546], [2470, 592]
  ];

  function crv(p0, p1, p2, p3, t) {           // Catmull-Rom, one axis
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t +
      (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
      (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  }

  var PATH = [];                               // [{x, y, s}] with cumulative arc length
  (function buildPath() {
    var SUB = 10, i, j, a, b, c, d, t, x, y, px = 0, py = 0, s = 0, first = true;
    for (i = 0; i < CP.length - 1; i++) {
      a = CP[i > 0 ? i - 1 : 0];
      b = CP[i];
      c = CP[i + 1];
      d = CP[i + 2 < CP.length ? i + 2 : CP.length - 1];
      for (j = 0; j < SUB; j++) {
        t = j / SUB;
        x = crv(a[0], b[0], c[0], d[0], t);
        y = crv(a[1], b[1], c[1], d[1], t);
        if (!first) s += Math.hypot(x - px, y - py);
        PATH.push({ x: x, y: y, s: s });
        px = x; py = y; first = false;
      }
    }
    var L = CP[CP.length - 1];
    s += Math.hypot(L[0] - px, L[1] - py);
    PATH.push({ x: L[0], y: L[1], s: s });
  })();
  var PLEN = PATH[PATH.length - 1].s;

  function posAt(s, out) {                     // point at arc length s
    s = G.clamp(s, 0, PLEN);
    var lo = 0, hi = PATH.length - 1, mid;
    while (lo < hi - 1) {
      mid = (lo + hi) >> 1;
      if (PATH[mid].s <= s) lo = mid; else hi = mid;
    }
    var a = PATH[lo], b = PATH[hi];
    var k = b.s > a.s ? (s - a.s) / (b.s - a.s) : 0;
    out.x = a.x + (b.x - a.x) * k;
    out.y = a.y + (b.y - a.y) * k;
    return out;
  }

  var nearHit = { s: 0, d: 0 };
  function nearestOnTrail(x, y) {              // project a tap onto the trail
    var i, p, d, best = 1e9, bs = 0;
    for (i = 0; i < PATH.length; i++) {
      p = PATH[i];
      d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < best) { best = d; bs = p.s; }
    }
    nearHit.s = bs; nearHit.d = Math.sqrt(best);
    return nearHit;
  }

  function trailWidth(y) { return G.lerp(23, 45, G.clamp((y - 480) / 190, 0, 1)); }

  /* trail ribbon + pebbles: static geometry, computed once.
     Two ready-made polygons (edge + inner earth), decimated to every other
     sample — the curve is smooth enough and the tablet redraws them every frame.
     Pebbles are bucketed by opacity so the whole gravel is three fills a frame
     instead of fifty-four beginPath/fill pairs. */
  var PEB_A = [0.12, 0.19, 0.26];
  var ribbonOut = [], ribbonIn = [], pebbles = [[], [], []];
  (function buildLook() {
    var i, p, a, b, ux, uy, len, w;
    var lo = [], ro = [], li = [], ri = [];
    for (i = 0; i < PATH.length; i += 2) {
      p = PATH[i];
      a = PATH[i > 0 ? i - 1 : 0];
      b = PATH[i < PATH.length - 1 ? i + 1 : PATH.length - 1];
      ux = -(b.y - a.y); uy = (b.x - a.x);
      len = Math.hypot(ux, uy) || 1;
      ux /= len; uy /= len;
      w = trailWidth(p.y);
      lo.push([p.x + ux * w, p.y + uy * w]);
      ro.push([p.x - ux * w, p.y - uy * w]);
      li.push([p.x + ux * (w - 7), p.y + uy * (w - 7) + 5]);
      ri.push([p.x - ux * (w - 7), p.y - uy * (w - 7) + 5]);
    }
    ribbonOut = lo.concat(ro.reverse());
    ribbonIn = li.concat(ri.reverse());

    var seed = 20260801;
    var rn = function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    var k, q, off, g;
    for (i = 0; i < 54; i++) {
      k = Math.floor(rn() * (PATH.length - 2)) + 1;
      p = PATH[k]; q = PATH[k + 1];
      ux = -(q.y - p.y); uy = (q.x - p.x);
      len = Math.hypot(ux, uy) || 1;
      ux /= len; uy /= len;
      off = (rn() * 2 - 1) * trailWidth(p.y) * 0.68;
      g = Math.min(PEB_A.length - 1, Math.floor(rn() * PEB_A.length));

  function camArrow(c, x, y, r, dir) {

    c.moveTo(x + dir * r * 0.22, y - r * 0.42);

    c.lineTo(x + dir * r * 0.22, y + r * 0.42);
    c.stroke();
    c.restore();
  }

  function drawArrows() {
    if (MAXCAM <= 0) return;
    var target = camHold !== null ? camHold : G.clamp(dino.x - W / 2, 0, MAXCAM);
    if (target > 12) {
      G.ui.round({
        id: 'cam-l', x: 76, y: 372, r: 56, color: 'rgba(255,246,224,.82)',
        icon: function (cc, x, y, r) { camArrow(cc, x, y, r, -1); },
        onTap: function () { camHold = 0; G.sfx('whoosh'); }
      });
    }
    if (target < MAXCAM - 12) {
      G.ui.round({
        id: 'cam-r', x: W - 76, y: 372, r: 56, color: 'rgba(255,246,224,.82)',
        icon: function (cc, x, y, r) { camArrow(cc, x, y, r, 1); },
        onTap: function () { camHold = MAXCAM; G.sfx('whoosh'); }

  function plaqueWidth(c, st, size) {
    if (st._w && st._ws === size) return st._w;
    c.save();
    c.font = G.font(size);
    var w = c.measureText(st.name).width;
    c.restore();
    st._ws = size;
    st._w = Math.max(190, Math.min(320, w + 46));

  }

  function drawStation(c, st) {
    var r = SIGN_R * (1 + st.pop * 0.07);
    var cx = st.cx, cy = st.cy, base = st.by;
    var i, a;

    c.save();
    c.translate(cx, base);
    c.rotate(Math.sin(G.t * 0.8 + st.sway) * 0.022);   // slow, gentle sway
    c.translate(-cx, -base);

    // ground contact
    c.fillStyle = 'rgba(20,10,0,.20)';
    c.beginPath(); c.ellipse(cx, base + 2, 46, 12, 0, 0, 7); c.fill();

    // posts
    var y0 = cy + r * 0.5;
    c.fillStyle = G.C.barkDark;
    c.fillRect(cx - 32, y0, 18, base - y0);
    c.fillRect(cx + 14, y0, 18, base - y0);
    c.fillStyle = G.C.bark;
    c.fillRect(cx - 30, y0, 11, base - y0);
    c.fillRect(cx + 16, y0, 11, base - y0);

    // the little ones get a soft halo that keeps saying "tap me"
    if (!big) {
      c.fillStyle = G.C.sun;
      c.globalAlpha = 0.14 + 0.10 * Math.sin(G.t * 2 + st.sway);
      c.beginPath(); c.arc(cx, cy, r + 20, 0, 7); c.fill();
      c.globalAlpha = 1;
    }

    // round board
    c.fillStyle = 'rgba(20,10,0,.18)';
    c.beginPath(); c.arc(cx + 6, cy + 11, r, 0, 7); c.fill();
    c.fillStyle = G.C.barkDark;
    c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
    c.fillStyle = G.C.bark;
    c.beginPath(); c.arc(cx, cy, r * 0.93, 0, 7); c.fill();
    c.fillStyle = G.C.cream;
    c.beginPath(); c.arc(cx, cy, r * 0.80, 0, 7); c.fill();
    c.strokeStyle = 'rgba(122,74,38,.35)';
    c.lineWidth = 4;
    c.beginPath(); c.arc(cx, cy, r * 0.72, 0, 7); c.stroke();
    c.fillStyle = 'rgba(78,47,24,.55)';
    for (i = 0; i < 6; i++) {
      a = i * Math.PI / 3 + 0.5;
      c.beginPath();
      c.arc(cx + Math.cos(a) * r * 0.87, cy + Math.sin(a) * r * 0.87, 4, 0, 7);
      c.fill();
    }

    // the sign, otherwise the most label-looking part of the sign is dead.
    var fs = big ? 26 : 30;

    var px = cx - pw / 2, py = cy + r + 4;
    st.px = px; st.py = py; st.pw = pw; st.ph = ph;

    G.text(st.name, cx, py + ph / 2, {

      // the big one can also read how much he has done in each place

  function butterfly(c, x, y, s, col, ph) {
    var f = Math.abs(Math.sin(G.t * 9 + ph));
    var w = s * (0.35 + 0.65 * f);
    c.save();
    c.translate(x, y);
    c.fillStyle = col;
    c.beginPath(); c.ellipse(-w * 0.58, -s * 0.14, w * 0.58, s * 0.44, -0.34, 0, 7); c.fill();

    c.beginPath(); c.ellipse(-w * 0.44, s * 0.24, w * 0.40, s * 0.28, -0.2, 0, 7); c.fill();

    c.fillStyle = G.C.ink;
    c.beginPath(); c.ellipse(0, 0, s * 0.11, s * 0.48, 0, 0, 7); c.fill();
    c.restore();

  function drawProp(c, p) {
    if (p.k === 'bush') A.bush(c, p.x, p.y, p.s, { berries: p.berries });
    else if (p.k === 'flower') A.flower(c, p.x, p.y, p.s, p.c);
    else A.rock(c, p.x, p.y, p.s);

  /* ---------------------------------------------------------------- scene */
  G.scene('giungla', {
    hud: true,
    back: false,

    enter: function () {
      // An old or hand-edited save can hold anything here, and writing a
      // property on a primitive throws in strict mode — check the type, not
      // just the truthiness. enter() is called without a try/catch at boot.
      if (!G.save.seen || typeof G.save.seen !== 'object') G.save.seen = {};

      // share the tablet and switching account re-enters this very scene.

        lastProfile = prof;
        visited = false;
        lastStop = null;
        lastPoke = -1;
      }

      big = G.level === 2;               // anything unexpected gets the easy set
      SIGN_R = big ? 92 : 112;
      // The youngest is the one with the least patience: he waits less, not more.
      SPEED = big ? 270 : 305;

      var i, st;
      for (i = 0; i < STATIONS.length; i++) {
        st = STATIONS[i];
        st.s = st.at * PLEN;
        posAt(st.s, tmpA);
        st.bx = tmpA.x; st.by = tmpA.y;
        st.cx = tmpA.x; st.cy = tmpA.y - SIGN_R - 76;
        st.pop = 0;
        st._w = 0; st._ws = 0;
        st.px = 0; st.py = 0; st.pw = 0; st.ph = 0;
      }

      dino.s = lastStop === null ? PLEN * 0.055 : G.clamp(lastStop, 0, PLEN);
      dino.target = dino.s;
      dino.facing = 1;
      dino.happy = 0;
      posAt(dino.s, tmpA);
      dino.x = tmpA.x; dino.y = tmpA.y;
      state = 'idle';
      pending = null;
      idleT = 0;
      nudges = 0;
      camHold = null;
      cam = G.clamp(dino.x - W / 2, 0, MAXCAM);   // start framed on him, no slide
      hushPending();

      var who = (G.account && G.account.name) || 'Dino';
      if (!visited) {
        visited = true;
        // One single utterance: G.say cancels whatever was speaking before.
        if (!G.save.seen.giungla) {
          G.save.seen.giungla = true;
          G.saveNow();
          // Longest wait of the three: the account screen is still welcoming him.

          speak('Ciao ' + who + '! Dove andiamo?', 1.2);
        }

      }
    },

    exit: function () {
      lastStop = dino.s;                 // come back where we left, session only
      hushPending();
    },

    update: function (dt) {
      var i;
      for (i = 0; i < STATIONS.length; i++) {
        if (STATIONS[i].pop > 0) STATIONS[i].pop = Math.max(0, STATIONS[i].pop - dt * 3.2);
      }
      if (dino.happy > 0) dino.happy = Math.max(0, dino.happy - dt);

      for (i = 0; i < CLOUDS.length; i++) {
        CLOUDS[i].x += CLOUDS[i].v * dt;
        if (CLOUDS[i].x > W + 220) CLOUDS[i].x = -220;
      }

      if (sayT > 0) {
        sayT -= dt;
        if (sayT <= 0) { sayT = 0; if (sayMsg) { G.say(sayMsg); sayMsg = null; } }
      }

      /* A three-year-old on his own can simply not know what to do. After a
         long silence the dino hops and asks for a sign to be tapped — twice at
         most, never for the big one, never while something is happening. */
      if (state === 'idle' && sayT === 0) {
        idleT += dt;
        if (!big && nudges < 2 && idleT >= 16) {
          idleT = 0; nudges++;
          dino.happy = 1.2;
          var hint = nearestStation();
          // effects live in screen space, the station in world space
          G.fx.ring(hint.cx - cam, hint.cy, G.C.sun, SIGN_R + 60);
          G.say('Tocca un cartello per giocare!');
        }
      } else {
        idleT = 0;
      }

      if (state === 'walk') {
        var d = dino.target - dino.s;
        var step = SPEED * dt;
        if (Math.abs(d) <= step) arrive();
        else {
          dino.s += d > 0 ? step : -step;
          dino.facing = d > 0 ? 1 : -1;
        }
      } else if (state === 'enter') {
        enterT -= dt;
        if (enterT <= 0) {
          var id = pending;
          pending = null;
          state = 'idle';              // stay usable even if that scene is missing
          if (id) G.go(id);
        }
      }
      posAt(dino.s, tmpA);
      dino.x = tmpA.x; dino.y = tmpA.y;

      // Camera: on the dino, unless an arrow pinned it somewhere else.
      var ct = camHold !== null ? camHold : G.clamp(dino.x - W / 2, 0, MAXCAM);
      cam += (ct - cam) * Math.min(1, dt * 6);
      if (Math.abs(ct - cam) < 0.5) cam = ct;
    },

    draw: function (c) {
      var i, p;

      /* Backdrop and clouds stay in SCREEN space: they are the far distance, so
         holding them still while the trail slides reads as depth, and it costs
         nothing. Everything the child can touch lives in world space below. */
      A.jungle(c, G.t);
      for (i = 0; i < CLOUDS.length; i++) A.cloud(c, CLOUDS[i].x, CLOUDS[i].y, CLOUDS[i].s);

      c.save();
      c.translate(-cam, 0);

      for (i = 0; i < TREES.length; i++) A.tree(c, TREES[i].x, TREES[i].y, TREES[i].s, { kind: TREES[i].kind });

      drawTrail(c);

      for (i = 0; i < STATIONS.length; i++) drawStation(c, STATIONS[i]);

      for (i = 0; i < BUGS.length; i++) {
        p = BUGS[i];
        butterfly(c,
          p.cx + Math.sin(G.t * 0.62 + p.ph) * p.rx,
          p.cy + Math.sin(G.t * 0.97 + p.ph * 1.7) * p.ry,
          p.s, p.c, p.ph);
      }

      // props behind the dino
      var di = 0;
      while (di < PROPS.length && PROPS[di].y <= dino.y) { drawProp(c, PROPS[di]); di++; }

      // where we are headed
      if (state === 'walk') {
        posAt(dino.target, tmpB);
        var k = (G.t * 1.5) % 1;
        c.save();
        c.globalAlpha = (1 - k) * 0.75;
        c.strokeStyle = G.C.cream;
        c.lineWidth = 5;
        c.beginPath();
        c.ellipse(tmpB.x, tmpB.y, 18 + k * 30, 7 + k * 12, 0, 0, 7);
        c.stroke();
        c.restore();
      }

      // the dino
      var size = 118 + G.clamp((dino.y - 470) / 200, 0, 1) * 34;
      c.fillStyle = 'rgba(20,10,0,.20)';
      c.beginPath();
      c.ellipse(dino.x, dino.y + 4, size * 0.30, size * 0.10, 0, 0, 7);
      c.fill();
      // This is the CURRENT player, so we pass no `gear` and no `hat` and let
      // A.dino read the live save (G.look hardens it). Naming `hat` here would
      // mean "I am drawing somebody else" and would strip the glasses and the
      // bow tie off him — see CONTRACT.md.
      var col = (G.account && typeof G.account.color === 'string') ? G.account.color : G.C.dino;
      A.dino(c, dino.x, dino.y, size, {
        facing: dino.facing,
        pose: state === 'walk' ? 'walk' : (dino.happy > 0 ? 'happy' : 'idle'),
        t: G.t,
        color: col
      });

      // props in front of the dino
      while (di < PROPS.length) { drawProp(c, PROPS[di]); di++; }

      c.restore();

      A.canopy(c, G.t);
      drawArrows();
    },

    onDown: function (p) {
      idleT = 0;
      if (state === 'enter') {                    // already stepping in, let it be
        G.fx.ring(p.x, p.y, 'rgba(255,255,255,.65)', 44);
        return;
      }
      hushPending();                              // never talk over his own tap

      // Everything below is hit-tested in WORLD coordinates: the finger arrives
      // in screen space and the world may be scrolled under it.
      var wx = p.x + cam;

      var i, st, r;
      // stations first: the board is the primary thing to touch
      for (i = 0; i < STATIONS.length; i++) {
        st = STATIONS[i];
        r = SIGN_R + 16;
        if (G.dist(wx, p.y, st.cx, st.cy) <= r) { goStation(st); return; }
        // the name plaque hangs below the board and reads as part of the sign
        if (st.pw > 0 && wx >= st.px && wx <= st.px + st.pw &&
            p.y >= st.py && p.y <= st.py + st.ph) { goStation(st); return; }
      }

      // then the dino himself
      if (G.dist(wx, p.y, dino.x, dino.y - 54) <= 74) { pokeDino(); return; }

      // anywhere near the trail: walk there. Tapping while walking re-aims.
      var n = nearestOnTrail(wx, p.y);
      if (n.d <= 210) {
        G.sfx('tap');
        walkTo(n.s, null);
        G.fx.ring(p.x, p.y, G.C.cream, 70);
        return;
      }

      // nothing to do here — a friendly sparkle, never a "no"
      G.fx.ring(p.x, p.y, 'rgba(255,255,255,.65)', 44);
    }
  });
})();


/* ==================== 20-conta.js ==================== */
/* Dino Giungla — "La Radura dei Numeri" (scene `conta`).
   The maths heart of the game, Treasure MathStorm style: a round is 6 questions,
   every question is a spoken prompt + a drawn scene + big tappable answers.

   Level 1 (3 years old): numbers 1..5, never past 6.
     count  — how many fruits are there
     more   — which of the two baskets has more (tap the group, not a number)
     touch  — tap N fruits one by one, counted out loud
   Level 2 (6 years old): within 10, then within 20 once 12 rounds are done.
     add / sub / missing addend / compare / doubles

   There is no way to lose: a wrong tap shakes the button, the dino thinks, the
   voice encourages, and the same question stays on screen. After the second
   miss the right answer glows and the objects are counted out loud, one by one. */
(function () {
  'use strict';

  var C = G.C;
  var ROUND = 6;

  /* ------------------------------------------------------------- vocabulary */
  /* Italian agrees in gender and number. A grammar mistake read out loud to a
     child is a bug, so every spoken sentence is composed from this table. */
  var KINDS = [
    { id: 'fragola', one: 'fragola', many: 'fragole', g: 'f' },
    { id: 'banana', one: 'banana', many: 'banane', g: 'f' },
    { id: 'mela', one: 'mela', many: 'mele', g: 'f' },
    { id: 'melone', one: 'melone', many: 'meloni', g: 'm' },
    { id: 'cocco', one: 'noce di cocco', many: 'noci di cocco', g: 'f' },
    { id: 'uva', one: 'grappolo d\'uva', many: 'grappoli d\'uva', g: 'm' }
  ];

  var NUMW = ['zero', 'uno', 'due', 'tre', 'quattro', 'cinque', 'sei', 'sette',
    'otto', 'nove', 'dieci', 'undici', 'dodici', 'tredici', 'quattordici',
    'quindici', 'sedici', 'diciassette', 'diciotto', 'diciannove', 'venti'];

  function nw(n) { return (n >= 0 && n < NUMW.length) ? NUMW[n] : String(n); }
  function howMany(k) { return k.g === 'f' ? 'Quante' : 'Quanti'; }
  function theMany(k) { return k.g === 'f' ? 'le ' : 'i '; }
  /* "una fragola" / "un melone" / "tre mele" */
  function amount(n, k) { return n === 1 ? (k.g === 'f' ? 'una ' : 'un ') + k.one : nw(n) + ' ' + k.many; }
  /* pronoun form after "ne": "ne mangia una" / "ne mangia uno" */
  function pron(n, k) { return n === 1 ? (k.g === 'f' ? 'una' : 'uno') : nw(n); }

  var PRAISE_TXT = ['Bravo!', 'Esatto!', 'Perfetto!', 'Sì!'];
  var PRAISE_SAY = ['Esatto!', 'Perfetto!', 'Giusto!', 'Bravissimo!', 'Proprio così!'];
  var ENCOURAGE = ['Quasi! Riprova.', 'Contiamo insieme.', 'Ci sei quasi, prova ancora.',
    'Non fa niente, riproviamo.', 'Guarda bene e riprova.'];

  /* ------------------------------------------------------------------ layout */
  var BOARD = { x: 170, y: 220, w: 990, h: 296 };
  var WIDE = { x: 210, y: 250, w: 910, h: 236 };      // objects only, full board
  var HALF_A = { x: 196, y: 252, w: 316, h: 226 };    // left addend
  var HALF_B = { x: 584, y: 252, w: 316, h: 226 };    // right addend
  var LONG = { x: 210, y: 250, w: 680, h: 232 };      // one group + answer card
  var TOUCH = { x: 230, y: 236, w: 1000, h: 290 };
  var PADS = [{ x: 176, y: 236, w: 434, h: 292 }, { x: 670, y: 236, w: 434, h: 292 }];
  var CARD_X = 1046, CARD_Y = 365;
  var ANS_COL = [C.berry, C.blueberry, C.tangerine, C.plum];

  var lock = 0;            // >0 while celebrating: taps ignored

    c.save();

  function board(c, x, y, w, h) {

      boardGrad = c.createLinearGradient(0, 180, 0, 580);
      boardGrad.addColorStop(0, 'rgba(255,246,224,.95)');

    c.strokeStyle = 'rgba(122,74,38,.5)'; c.lineWidth = 6;

    c.restore();
  }

  function dots(c, cx, cy, n, r, sp, color) {

  function askCard(c, x, y) {

    c.lineWidth = 9 + p * 7;
    G.roundRect(c, x - e, y - e, w + e * 2, h + e * 2, 36); c.stroke();
    c.restore();
  }

  /* ------------------------------------------------------------ object layout */
  /* Positions are computed once per question, never per frame. */
  function grid(n, rect, maxR) {
    var rows = n <= 5 ? 1 : (n <= 12 ? 2 : 3);
    var cols = Math.ceil(n / rows);
    var cw = rect.w / cols, ch = rect.h / rows;
    var r = G.clamp(Math.min(cw, ch) * .40, 12, maxR || 56);
    var out = [], row, col, inRow, x0, left = n;
    for (row = 0; row < rows && left > 0; row++) {
      inRow = Math.min(cols, left);
      left -= inRow;
      x0 = rect.x + (rect.w - inRow * cw) / 2;
      for (col = 0; col < inRow; col++) {
        out.push({
          x: x0 + cw * (col + .5) + G.rnd(-5, 5),
          y: rect.y + ch * (row + .5) + G.rnd(-5, 5),
          r: r, ph: G.rnd(0, 6.3)
        });
      }
    }
    return out;
  }

  function inset(pad) { return { x: pad.x + 34, y: pad.y + 36, w: pad.w - 68, h: pad.h - 104 }; }

  function drawObjs(c, list, kind, eatenFrom) {
    var i, o, y, eaten;
    c.save();
    for (i = 0; i < list.length; i++) {
      o = list[i];
      eaten = eatenFrom >= 0 && i >= eatenFrom;
      y = o.y + Math.sin(G.t * 2 + o.ph) * 3;
      c.globalAlpha = eaten ? .22 : 1;
      c.fillStyle = 'rgba(20,10,0,.12)';
      c.beginPath(); c.ellipse(o.x, o.y + o.r * .98, o.r * .85, o.r * .26, 0, 0, 6.3); c.fill();
      drawFruit(c, o.x, y, o.r, kind);
      c.globalAlpha = 1;
      if (eaten) {
        c.setLineDash([9, 9]);
        c.strokeStyle = 'rgba(43,29,18,.42)'; c.lineWidth = 4;
        c.beginPath(); c.arc(o.x, o.y, o.r * 1.05, 0, 6.3); c.stroke();
        c.setLineDash([]);
      }
    }
    c.restore();
  }

  /* --------------------------------------------------------- question making */
  function options(ans, count, lo, hi) {
    var set = [ans], cand = [], i, v;
    for (i = 1; i <= 5; i++) { cand.push(ans - i); cand.push(ans + i); }
    cand = G.shuffle(cand);
    for (i = 0; i < cand.length && set.length < count; i++) {
      v = cand[i];
      if (v < lo || v > hi || set.indexOf(v) >= 0) continue;
      set.push(v);
    }
    v = lo;
    while (set.length < count && v <= hi + count) { if (set.indexOf(v) < 0) set.push(v); v++; }
    return G.shuffle(set);
  }

  function pickType(list) {
    var t = G.pick(list), i = 0;
    while (t === lastType && i++ < 8) t = G.pick(list);
    return t;
  }

  /* ---- level 1: 3 years old. Never past 6, and one type is pure tapping. */
  function gen1() {
    var k = G.pick(KINDS);
    var t = pickType(['count', 'count', 'more', 'touch', 'touch']);
    var o = { type: t, kind: k, lvl: 1 };
    var n, a, b, tot;

    if (t === 'count') {
      n = G.rndi(1, 5);
      o.answer = n;
      o.objs = grid(n, WIDE, 56);
      o.guideList = o.objs;
      o.options = options(n, 3, 1, 6);
      o.say = G.pick([
        howMany(k) + ' ' + k.many + ' ci sono?',
        howMany(k) + ' ' + k.many + ' vedi?',
        'Conta ' + theMany(k) + k.many + '. ' + howMany(k) + ' ce ne sono?'
      ]);
      o.title = howMany(k) + ' ' + k.many + '?';
      o.sig = 'count' + n + k.id;
    } else if (t === 'more') {
      a = G.rndi(1, 5); b = G.rndi(1, 5);
      while (Math.abs(a - b) < 2) { a = G.rndi(1, 5); b = G.rndi(1, 5); }
      o.counts = [a, b];
      o.answer = a > b ? 0 : 1;
      o.groups = [grid(a, inset(PADS[0]), 40), grid(b, inset(PADS[1]), 40)];
      o.guideList = o.groups[o.answer];
      o.say = 'Guarda i due cesti. Dove ci sono più ' + k.many + '?';
      o.title = 'Dove ce ne sono di più?';
      o.sig = 'more' + a + '-' + b + k.id;
    } else {
      n = G.rndi(2, 5);
      tot = Math.min(6, n + G.rndi(1, 2));
      o.answer = n;
      o.objs = grid(tot, TOUCH, 58);
      o.taken = [];
      o.say = 'Tocca ' + amount(n, k) + '.';
      o.title = 'Tocca ' + n + ' ' + (n === 1 ? k.one : k.many);
      o.sig = 'touch' + n + '-' + tot + k.id;
    }
    return o;
  }

  /* ---- level 2: 6 years old. Within 10, within 20 after 12 finished rounds. */
  function gen2(big) {
    var k = G.pick(KINDS);
    var max = big ? 20 : 10;
    var t = pickType(['add', 'add', 'sub', 'sub', 'missing', 'cmp', 'double']);
    var o = { type: t, kind: k, lvl: 2 };
    var a, b, tot, eat, i, sp, r, x0, cap, sum;

    if (t === 'add') {
      a = G.rndi(2, max - 2);
      b = G.rndi(2, max - a);
      o.answer = a + b;
      o.gA = grid(a, HALF_A, 40);
      o.gB = grid(b, HALF_B, 40);
      o.guideList = o.gA.concat(o.gB);
      o.options = options(o.answer, 4, 1, max + 2);
      o.say = 'Ci sono ' + nw(a) + ' ' + k.many + ' e ne arrivano ' +
        (k.g === 'f' ? 'altre ' : 'altri ') + nw(b) + '. ' +
        howMany(k) + ' ' + k.many + ' ci sono in tutto?';
      o.title = a + ' + ' + b + ' = ?';
      o.sig = 'add' + a + '+' + b;
    } else if (t === 'sub') {
      tot = G.rndi(3, max);
      eat = G.rndi(1, tot - 1);
      o.answer = tot - eat;
      o.remain = o.answer;
      o.eat = eat;
      o.objs = grid(tot, LONG, 40);
      o.guideList = o.objs.slice(0, o.remain);
      o.options = options(o.answer, 4, 0, max);
      sum = 0;
      for (i = o.remain; i < o.objs.length; i++) sum += o.objs[i].x;
      o.eatCx = sum / eat;
      o.say = 'Ci sono ' + nw(tot) + ' ' + k.many + '. Il dino ne mangia ' + pron(eat, k) +
        '. ' + howMany(k) + ' ' + k.many + ' restano?';
      o.title = tot + ' − ' + eat + ' = ?';
      o.sig = 'sub' + tot + '-' + eat;
    } else if (t === 'missing') {
      tot = G.rndi(4, max);
      a = G.rndi(2, tot - 1);
      o.answer = tot - a;
      o.a = a; o.tot = tot;
      o.options = options(o.answer, 4, 1, max);
      sp = Math.min(66, 940 / tot);
      r = sp * .40;
      x0 = 640 - (tot - 1) * sp / 2;
      o.slots = [];
      for (i = 0; i < tot; i++) {
        o.slots.push({ x: x0 + i * sp, y: 438, r: r, ph: G.rnd(0, 6.3), full: i < a });
      }
      o.guideList = o.slots.slice(a);
      o.say = 'Abbiamo ' + nw(a) + ' ' + k.many + '. ' + howMany(k) +
        ' ne mancano per arrivare a ' + nw(tot) + '?';
      o.title = a + ' + ? = ' + tot;
      o.sig = 'miss' + a + '/' + tot;
    } else if (t === 'cmp') {
      cap = big ? 14 : 9;
      a = G.rndi(2, cap); b = G.rndi(2, cap);
      while (a === b) b = G.rndi(2, cap);
      o.counts = [a, b];
      o.answer = a > b ? 0 : 1;
      o.groups = [grid(a, inset(PADS[0]), 34), grid(b, inset(PADS[1]), 34)];
      o.guideList = o.groups[o.answer];
      o.say = 'Quale gruppo ha più ' + k.many + '? Toccalo.';
      o.title = 'Quale gruppo è più grande?';
      o.sig = 'cmp' + a + '-' + b;
    } else {
      a = G.rndi(2, Math.floor(max / 2));
      o.answer = a * 2;
      o.pairs = grid(a, LONG, 34);
      o.guideList = [];
      for (i = 0; i < o.pairs.length; i++) {
        o.guideList.push({ x: o.pairs[i].x - o.pairs[i].r * .8, y: o.pairs[i].y, r: o.pairs[i].r * .84 });
        o.guideList.push({ x: o.pairs[i].x + o.pairs[i].r * .8, y: o.pairs[i].y, r: o.pairs[i].r * .84 });
      }
      o.options = options(o.answer, 4, 2, max + 2);
      o.say = G.pick([
        'Quanto fa il doppio di ' + nw(a) + '?',
        'Conta a due a due. ' + howMany(k) + ' ' + k.many + ' ci sono in tutto?'
      ]);
      o.title = 'Il doppio di ' + a + ' = ?';
      o.sig = 'dbl' + a;
    }
    return o;
  }

  function newQuestion(prefix) {
    var big = G.level === 2 && (G.save.conta.done || 0) > 12;
    var made = null, i = 0;
    do { made = G.level === 2 ? gen2(big) : gen1(); } while (made.sig === lastSig && ++i < 10);
    lastSig = made.sig; lastType = made.type;
    q = made;
    tries = 0; shakeI = -1; shakeT = 0; hintOn = false; guide = null; touched = 0;
    G.say((prefix ? prefix + ' ' : '') + q.say);
  }

  /* --------------------------------------------------------------- feedback */
  function setPose(p, secs) { pose = p; poseT = secs; }

  function correct(x, y, spoken) {
    if (tries === 0) firstTry++;
    var s = G.save.conta;
    s.right = (s.right || 0) + 1;
    G.saveNow();
    G.sfx('good');
    G.fx.burst(x, y, { color: C.sun, count: 18, speed: 330, size: 15 });
    G.fx.burst(x, y, { color: C.tangerine, count: 12, speed: 250, size: 12 });
    G.fx.burst(x, y, { color: C.berry, count: 10, speed: 200, size: 11 });
    G.fx.ring(x, y, C.sun, 160);
    G.fx.text(x, y - 96, G.pick(PRAISE_TXT), C.cream, 56);
    G.say((spoken ? spoken + '! ' : '') + G.pick(PRAISE_SAY));
    setPose('happy', 1.6);
    guide = null; hintOn = false;
    lock = 1.15;
  }

  function encourage() {
    var i = G.rndi(0, ENCOURAGE.length - 1), n = 0;
    while (i === lastEnc && n++ < 5) i = G.rndi(0, ENCOURAGE.length - 1);
    lastEnc = i;
    return ENCOURAGE[i];
  }

  function wrong(i) {
    tries++;
    G.sfx('bad');
    shakeI = i; shakeT = .42;
    setPose('think', 1.8);
    G.say(encourage());
    if (tries >= 2) {          // gentle rescue: glow the answer and count aloud
      hintOn = true;
      if (q.guideList && q.guideList.length) startGuide(q.guideList);
    }
  }

  function startGuide(list) { guide = { list: list, i: 0, t: .9 }; }

  function stepGuide(dt) {
    guide.t -= dt;
    if (guide.t > 0) return;
    if (guide.i >= guide.list.length) { guide = null; return; }
    var o = guide.list[guide.i];
    G.say(nw(guide.i + 1));
    G.sfx('pop');
    G.fx.ring(o.x, o.y, C.cream, 74);
    guide.i++;
    guide.t = .95;
  }

  function advance() {
    qi++;
    if (qi >= ROUND) { finishRound(); return; }
    newQuestion(null);
  }

  function finishRound() {
    var s = G.save.conta;
    phase = 'done';
    s.done = (s.done || 0) + 1;
    if (firstTry > (s.best || 0)) s.best = firstTry;
    G.saveNow();
    G.fx.confetti();
    G.sfx('win');
    setPose('happy', 4);
    rewardT = .55;   // let the win jingle breathe before the coin sounds
    G.say('Evviva! Hai finito il giro. Vuoi continuare?');
  }

  /* Prize lands a beat after the win jingle, so the sounds do not pile up. */
  function grantReward() {
    rewardT = 0;
    G.addStars(1, 640, 330);
    G.addFruits(G.level === 2 ? 18 : 12, 700, 330);
  }

  function newRound() {
    if (rewardT > 0) grantReward();   // never lose the prize to an eager tap
    qi = 0; firstTry = 0; phase = 'play'; lock = 0;
    newQuestion(null);
  }

  /* ------------------------------------------------------------------- draws */
  function progress(c) {
    var i, x, r, filled = qi + (lock > 0 && phase === 'play' ? 1 : 0);
    for (i = 0; i < ROUND; i++) {
      x = 640 - (ROUND - 1) * 44 / 2 + i * 44;
      r = (i === filled && phase === 'play') ? 13 + Math.sin(G.t * 3.4) * 2.5 : 13;
      c.fillStyle = i < filled ? C.sun : 'rgba(255,246,224,.30)';
      c.beginPath(); c.arc(x, 110, r, 0, 6.3); c.fill();
      c.strokeStyle = 'rgba(20,10,0,.35)'; c.lineWidth = 3;
      c.beginPath(); c.arc(x, 110, r, 0, 6.3); c.stroke();
    }
  }

  function promptBar(c, str) {
    c.save();
    c.fillStyle = 'rgba(38,24,13,.72)';
    G.roundRect(c, 206, 142, 868, 70, 24); c.fill();
    c.restore();
    G.text(str, 640, 178, { size: 38, color: C.cream, maxWidth: 812 });
  }

  function speakerBtn() {
    G.ui.round({
      id: 'say-again', x: 108, y: 177, r: 46, color: C.cream, silent: true,
      icon: function (cc, x, y, r) {
        cc.save();
        cc.fillStyle = C.ink;
        cc.beginPath();
        cc.moveTo(x - r * .34, y - r * .15); cc.lineTo(x - r * .10, y - r * .15);
        cc.lineTo(x + r * .10, y - r * .40); cc.lineTo(x + r * .10, y + r * .40);
        cc.lineTo(x - r * .10, y + r * .15); cc.lineTo(x - r * .34, y + r * .15);
        cc.closePath(); cc.fill();
        cc.strokeStyle = C.ink; cc.lineWidth = r * .11; cc.lineCap = 'round';
        cc.beginPath(); cc.arc(x + r * .16, y, r * .26, -.9, .9); cc.stroke();
        cc.beginPath(); cc.arc(x + r * .16, y, r * .46, -.9, .9); cc.stroke();
        cc.restore();
      },
      onTap: function () { if (q) { G.sfx('tap'); G.say(q.say); } }
    });
  }

  function padTap(i) {
    return function () {
      if (lock > 0 || phase !== 'play') return;
      var p = PADS[i];
      if (i === q.answer) correct(p.x + p.w / 2, p.y + p.h / 2, null);
      else wrong(i);
    };
  }

  function drawPads(c) {
    var i, p, down, sh;
    for (i = 0; i < 2; i++) {
      p = PADS[i];
      sh = (shakeI === i && shakeT > 0) ? Math.sin(shakeT * 62) * 9 * (shakeT / .42) : 0;
      if (hintOn && i === q.answer) halo(c, p.x + sh, p.y, p.w, p.h);
      down = G.ui.button({
        id: 'pad' + i, x: p.x + sh, y: p.y, w: p.w, h: p.h, r: 30,
        color: i === 0 ? '#7bc96f' : '#6fbfd8', silent: true, onTap: padTap(i)
      });
      c.save();
      c.translate(sh, down ? 5 : 0);
      drawObjs(c, q.groups[i], q.kind.id, -1);
      c.restore();
      if (q.type === 'cmp') {     // 6 year olds get the written number too
        c.save();
        c.fillStyle = C.cream;
        G.roundRect(c, p.x + sh + p.w / 2 - 54, p.y + p.h - 78, 108, 62, 20); c.fill();
        c.restore();
        G.text(String(q.counts[i]), p.x + sh + p.w / 2, p.y + p.h - 46, { size: 46, color: C.ink });
      }
    }
  }

  function objTap(i) {
    return function () {
      if (lock > 0 || phase !== 'play') return;
      if (q.taken[i]) return;
      var o = q.objs[i];
      q.taken[i] = true;
      touched++;
      guide = null;
      G.sfx('pop');
      G.fx.burst(o.x, o.y, { color: C.mint, count: 10, speed: 210, size: 11 });
      G.fx.ring(o.x, o.y, C.cream, 86);
      G.fx.text(o.x, o.y - 70, nw(touched), C.cream, 46);
      if (touched >= q.answer) correct(o.x, o.y, nw(touched));
      else G.say(nw(touched));   // count out loud: "uno", "due", ...
    };
  }

  function drawTouch(c) {
    var i, o, n = q.answer, sp, r, x0;
    var x = 470, y = 542, w = 340, h = 152;
    for (i = 0; i < q.objs.length; i++) {
      if (q.taken[i]) continue;
      o = q.objs[i];
      G.ui.round({
        id: 'obj' + i, x: o.x, y: o.y, r: o.r, color: C.leafLight,
        silent: true, icon: fruitIcon, onTap: objTap(i)
      });
    }
    // counter card: digits for who reads them, one slot per unit for who does not
    c.save();
    c.fillStyle = 'rgba(255,246,224,.96)';
    G.roundRect(c, x, y, w, h, 28); c.fill();
    c.strokeStyle = C.bark; c.lineWidth = 6;
    G.roundRect(c, x, y, w, h, 28); c.stroke();
    c.restore();
    G.text(touched + ' / ' + n, x + w / 2, y + 46, { size: 48, color: C.ink });
    sp = Math.min(58, (w - 50) / n); r = sp * .32; x0 = x + w / 2 - (n - 1) * sp / 2;
    c.save();
    for (i = 0; i < n; i++) {
      c.fillStyle = i < touched ? C.berry : 'rgba(43,29,18,.16)';
      c.beginPath(); c.arc(x0 + i * sp, y + 108, r, 0, 6.3); c.fill();
    }
    c.restore();
  }

  function drawMissing(c) {
    var i, s, y;
    G.text(String(q.a), 470, 300, { size: 84, color: C.ink });
    G.text('+', 552, 300, { size: 72, color: C.barkDark });
    c.save();
    c.fillStyle = C.cream;
    G.roundRect(c, 590, 246, 100, 110, 22); c.fill();
    c.strokeStyle = C.bark; c.lineWidth = 6;
    G.roundRect(c, 590, 246, 100, 110, 22); c.stroke();
    c.restore();
    G.text('?', 640, 302, { size: 72, color: C.berry });
    G.text('=', 730, 300, { size: 72, color: C.barkDark });
    G.text(String(q.tot), 812, 300, { size: 84, color: C.ink });
    // support row: real fruit for what we have, empty rings for what is missing
    c.save();
    for (i = 0; i < q.slots.length; i++) {
      s = q.slots[i];
      if (s.full) {
        y = s.y + Math.sin(G.t * 2 + s.ph) * 3;
        drawFruit(c, s.x, y, s.r, q.kind.id);
      } else {
        c.setLineDash([8, 8]);
        c.strokeStyle = 'rgba(43,29,18,.45)'; c.lineWidth = 4;
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.3); c.stroke();
        c.setLineDash([]);
      }
    }
    c.restore();
  }

  function drawPairs(c) {
    var i, p, y;
    c.save();
    for (i = 0; i < q.pairs.length; i++) {
      p = q.pairs[i];
      y = p.y + Math.sin(G.t * 2 + p.ph) * 3;
      c.fillStyle = 'rgba(47,143,78,.20)';
      G.roundRect(c, p.x - p.r * 1.75, p.y - p.r * 1.15, p.r * 3.5, p.r * 2.3, p.r); c.fill();
      drawFruit(c, p.x - p.r * .8, y, p.r * .84, q.kind.id);
      drawFruit(c, p.x + p.r * .8, y, p.r * .84, q.kind.id);
    }
    c.restore();
  }

  function eatenBadge(c) {
    c.save();
    c.fillStyle = 'rgba(38,24,13,.80)';
    G.roundRect(c, q.eatCx - 62, BOARD.y + 8, 124, 56, 18); c.fill();
    c.restore();
    G.text('− ' + q.eat, q.eatCx, BOARD.y + 37, { size: 38, color: C.sun });
  }

  function drawStage(c) {
    var t = q.type;
    if (t === 'more' || t === 'cmp') { drawPads(c); return; }
    if (t === 'touch') { drawTouch(c); return; }
    board(c, BOARD.x, BOARD.y, BOARD.w, BOARD.h);
    if (t === 'count') {
      drawObjs(c, q.objs, q.kind.id, -1);
    } else if (t === 'add') {
      drawObjs(c, q.gA, q.kind.id, -1);
      drawObjs(c, q.gB, q.kind.id, -1);
      sym(c, '+', 548, CARD_Y);
      sym(c, '=', 936, CARD_Y);
      askCard(c, CARD_X, CARD_Y);
    } else if (t === 'sub') {
      drawObjs(c, q.objs, q.kind.id, q.remain);
      eatenBadge(c);
      sym(c, '=', 936, CARD_Y);
      askCard(c, CARD_X, CARD_Y);
    } else if (t === 'double') {
      drawPairs(c);
      sym(c, '=', 936, CARD_Y);
      askCard(c, CARD_X, CARD_Y);
    } else if (t === 'missing') {
      drawMissing(c);
    }
  }

  /* the counting hand: a pulsing ring plus the running number, one object at a time */
  function guideMark(c) {
    if (!guide || guide.i <= 0) return;
    var o = guide.list[guide.i - 1], r = o.r || 40;
    var p = .5 + .5 * Math.sin(G.t * 7);
    c.save();
    c.strokeStyle = 'rgba(255,215,94,' + (.6 + p * .4).toFixed(3) + ')';
    c.lineWidth = 7;
    c.beginPath(); c.arc(o.x, o.y, r * 1.3 + p * 5, 0, 6.3); c.stroke();
    c.restore();
    G.text(String(guide.i), o.x, o.y - r * 1.9, {
      size: 40, color: C.cream, stroke: 'rgba(40,20,0,.65)'
    });
  }

  /* `q` can have moved on between the frame that declared these buttons and the
     frame that handles the tap: the UI is immediate mode with one frame of lag
     (uiHot = uiRects at the swap), and the 'more' and 'touch' questions carry
     no options at all. Touching an answer at the exact moment the round changes
     used to throw here. */
  function ansGeom() {
    var n = (q && q.options) ? q.options.length : 3;
