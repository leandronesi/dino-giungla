  var DINO_OPT = { facing: 1, t: 0, color: C.dino, pose: 'idle' };
  var PANEL_OPT = { r: 28 }, WIN_PANEL_OPT = { r: 34 };

  /* A cell is the tap target, so it must never drop under 96 logical px:
     6x6 gets the largest board the 96..720 band can hold (576 / 6 = 96). */
  function sizeFor(k) { return k === 3 ? 486 : k === 4 ? 520 : k === 5 ? 540 : 576; }

  function layout() {
    side = sizeFor(n);
    cs = side / n;
    gx = Math.round(468 - side / 2);
    gy = Math.round(96 + (H - 96 - side) / 2);
    // Wooden frame: thick when there is room, never over the HUD band nor off-screen.
    fpad = Math.max(8, Math.min(24, gy - 100, H - 4 - (gy + side)));
  }

  function resetLines() {
    var i;
    lines = [];
    for (i = 0; i < pairs; i++) lines.push({ cells: [], closed: false, glow: 0 });
    active = -1; won = false; winT = 0; perfect = false; spoke = false;
    rebuildOwn();
  }

  function newGrid() {
    var p = plan(), i, path;
    n = p.n; pairs = p.pairs;
    sol = buildPuzzle(n, pairs);
    if (!sol) { n = 3; pairs = 2; sol = snake(3, 2) || FLOOR3; }  // never show nothing
    pairs = sol.length;
    layout();
    kinds = G.shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
    while (kinds.length < pairs) kinds = kinds.concat(G.shuffle([0, 1, 2, 3, 4, 5, 6, 7]));
    kinds = kinds.slice(0, pairs);
    dots = [];
    dotOf = new Int8Array(n * n);
    for (i = 0; i < n * n; i++) dotOf[i] = -1;
    for (i = 0; i < pairs; i++) {
      path = sol[i];
      var a = path[0], b = path[path.length - 1];
      dots.push([a, b]);
      dotOf[a[0] * n + a[1]] = i;
      dotOf[b[0] * n + b[1]] = i;
    }
    var f = branch();
    f.size = n; f.pairs = pairs; G.saveNow();
    resetLines();
  }

  function rebuildOwn() {
    var i, k, cells;
    if (!own || own.length !== n * n) own = new Int8Array(n * n);
    for (i = 0; i < own.length; i++) own[i] = -1;
    for (k = 0; k < lines.length; k++) {
      cells = lines[k].cells;
      for (i = 0; i < cells.length; i++) own[cells[i][0] * n + cells[i][1]] = k;
    }
  }

  function kindOf(k) { return KINDS[(kinds[k] | 0) % KINDS.length] || KINDS[0]; }
  function colOf(k) { return kindOf(k).col; }
  /* The empty cells, once every pair is joined and only at level 2. Not a
     scolding and not a lock: the threads stay where they are, the child just
     has to stretch one of them a bit further. A grid-filling solution always
     exists, so this can never be a dead end. */
  function drawGaps(c) {
    if (won || G.level !== 2 || !own || !allClosed() || fullGrid()) return;
    var i, r, cc, k = 0.30 + Math.sin(pulse * 5) * 0.22;
    c.save();
    for (i = 0; i < own.length; i++) {
      if (own[i] >= 0) continue;
      r = Math.floor(i / n); cc = i % n;
      c.globalAlpha = k;
      c.fillStyle = C.sun;
      c.beginPath(); c.arc(cxOf(cc), cyOf(r), cs * 0.24, 0, 6.2832); c.fill();
      c.globalAlpha = k * 1.5;
      c.strokeStyle = C.cream; c.lineWidth = 4;
      c.beginPath(); c.arc(cxOf(cc), cyOf(r), cs * 0.32, 0, 6.2832); c.stroke();
    }
    c.restore();
  }

  function cxOf(c) { return gx + c * cs + cs / 2; }
  function cyOf(r) { return gy + r * cs + cs / 2; }
  function idxIn(cells, r, c) {
    var i;
    for (i = 0; i < cells.length; i++) if (cells[i][0] === r && cells[i][1] === c) return i;
    return -1;
  }
  /* Forgiving pick: the nearest cell centre, accepting a quarter of a cell of
     slop outside the board so edge dots stay easy to grab. */
  function cellAt(p) {
    if (!p) return null;
    var c = Math.floor((p.x - gx) / cs), r = Math.floor((p.y - gy) / cs);
    if (c < 0) c = 0; else if (c > n - 1) c = n - 1;
    if (r < 0) r = 0; else if (r > n - 1) r = n - 1;
    if (Math.abs(p.x - cxOf(c)) > cs * .75 || Math.abs(p.y - cyOf(r)) > cs * .75) return null;
    return [r, c];
  }
  function blockedFor(k, r, c) {
    var i = r * n + c;
    if (dotOf[i] >= 0 && dotOf[i] !== k) return true;
    return own[i] >= 0 && own[i] !== k;
  }
  /* The thread cannot go that way. There is no failure state here, so this is
     a soft, rate-limited nudge at the head of the thread — never the "wrong"
     buzzer, which would fire constantly while a small finger explores. */
  function softBad() {
    if (active < 0 || G.t - lastBad < .5) return;
    lastBad = G.t;
    var L = lines[active], last = L && L.cells[L.cells.length - 1];
    if (last) G.fx.ring(cxOf(last[1]), cyOf(last[0]), C.cream, cs * .5);
  }

  function closePair(k) {
    var L = lines[k], last = L.cells[L.cells.length - 1];
    var x = cxOf(last[1]), y = cyOf(last[0]), kk = kindOf(k);
    L.closed = true; L.glow = 1;
    G.sfx('pop');
    G.fx.ring(x, y, kk.col, cs * 1.1);
    G.fx.burst(x, y, { color: kk.col, count: 10, speed: 170, size: cs * .12, life: .6, gravity: 240 });
    if (G.level === 1) G.say(kk.name + '!');
  }

  function allClosed() {
    for (var i = 0; i < lines.length; i++) if (!lines[i].closed) return false;
    return true;
  }
  function fullGrid() {
    for (var i = 0; i < own.length; i++) if (own[i] < 0) return false;
    return true;
  }

  var nearT = 0;              // all pairs joined, but the grid is not full yet

  function checkWin() {
    var i;
    if (!allClosed()) return;

    /* Level 2 has to fill the WHOLE grid, and that is the rule this generator
       was built for: every puzzle is a partition of all the cells into paths,
       so a grid-filling solution always exists by construction — validate()
       ends with `count === total`. Joining the dots was a weaker condition than
       what the generator already guaranteed.
       Level 1 keeps the gentler rule on purpose. On a 3x3 with two pairs,
       covering every cell is far harder than joining the dots, and a
       three-year-old who has joined everything and sees nothing happen has met
       a failure state wearing a friendly face. */
    if (G.level === 2 && !fullGrid()) {
      if (nearT <= 0) {
        nearT = 2.6;
        G.sfx('pop');
        G.say(G.pick(['Manca ancora un pezzetto!', 'Riempi tutta la griglia!', 'Quasi! Resta un buchino.']));
      }
      return;
    }

    var f = branch();
    f.done = f.done + 1; f.size = n; f.pairs = pairs;
    G.saveNow();
    won = true; winT = 0; spoke = false; active = -1;
    perfect = true;
    for (i = 0; i < own.length; i++) if (own[i] < 0) { perfect = false; break; }
    G.fx.confetti();
    G.sfx('win');
    G.shake(3);
    G.addStars(1, 468, 300);
    G.addFruits(G.level === 1 ? 10 : 16, 468, 340);
    if (perfect && G.level === 2) {
      G.addStars(1, 468, 260);
      G.fx.text(468, 230, 'Perfetto!', C.sun, 54);
    }
  }

  /* Walk the head of the active thread towards the touched cell, one
     orthogonal step at a time. A few steps per event keeps up with a fast
     finger without ever teleporting the thread. */
  function stepToward(tr, tc) {
    var L = lines[active], guard, moved, i, last, dr, dc, opts, nr, nc, hit;
    for (guard = 0; guard < 4; guard++) {
      last = L.cells[L.cells.length - 1];
      if (!last || (last[0] === tr && last[1] === tc)) return;
      if (L.closed) return;                                  // never grow past the far dot
      dr = tr - last[0]; dc = tc - last[1];
      opts = [];
      if (Math.abs(dr) >= Math.abs(dc)) {
        if (dr) opts.push([last[0] + (dr > 0 ? 1 : -1), last[1]]);
        if (dc) opts.push([last[0], last[1] + (dc > 0 ? 1 : -1)]);
      } else {
        if (dc) opts.push([last[0], last[1] + (dc > 0 ? 1 : -1)]);
        if (dr) opts.push([last[0] + (dr > 0 ? 1 : -1), last[1]]);
      }
      moved = false;
      for (i = 0; i < opts.length; i++) {
        nr = opts[i][0]; nc = opts[i][1];
        if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
        hit = idxIn(L.cells, nr, nc);
        if (hit >= 0) {                                      // back over our own thread: shorten it
          L.cells.length = hit + 1;
          L.closed = false;
          moved = true;
          break;
        }
        if (blockedFor(active, nr, nc)) continue;            // someone else's thread: just stop
        L.cells.push([nr, nc]);
        moved = true;
        if (dotOf[nr * n + nc] === active) closePair(active);
        break;
      }
      rebuildOwn();
      if (!moved) { softBad(); return; }
      if (L.closed) return;
    }
  }

  /* -------------------------------------------------------------- painting */
  function threadPath(c, cells, dy) {
    var i;
    c.beginPath();
    c.moveTo(cxOf(cells[0][1]), cyOf(cells[0][0]) + dy);
    for (i = 1; i < cells.length; i++) c.lineTo(cxOf(cells[i][1]), cyOf(cells[i][0]) + dy);
  }

  function drawThreads(c) {
    var k, L, col, w = cs * .42;
    c.save();
    c.lineCap = 'round';
    c.lineJoin = 'round';
    for (k = 0; k < lines.length; k++) {
      L = lines[k];
      if (L.cells.length < 2) continue;
      col = colOf(k);
      threadPath(c, L.cells, 0);
      c.lineWidth = w + 8; c.strokeStyle = G.shade(col, -66); c.stroke();
      threadPath(c, L.cells, 0);
      c.lineWidth = w; c.strokeStyle = col; c.stroke();
      threadPath(c, L.cells, -w * .17);
      c.lineWidth = w * .30; c.strokeStyle = G.shade(col, 52); c.stroke();
    }
    c.restore();
  }

  function drawDots(c) {
    var k, d, i, r, x, y, kk, done, beat, rr;
    for (k = 0; k < pairs; k++) {
      kk = kindOf(k);
      d = dots[k];
      done = lines[k].closed;
      beat = done ? 1 + Math.sin(pulse * 5 + k) * .04
        : (G.level === 1 ? 1 + Math.sin(pulse * 3.2 + k * 1.7) * .05 : 1);
      for (i = 0; i < 2; i++) {
        x = cxOf(d[i][1]); y = cyOf(d[i][0]);
        r = cs * .32 * beat;
        c.save();
        c.fillStyle = G.shade(kk.col, -66);
        c.beginPath(); c.arc(x, y + cs * .035, r, 0, 6.2832); c.fill();
        c.fillStyle = done ? G.shade(kk.col, 22) : kk.col;
        c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
        c.fillStyle = 'rgba(255,255,255,.26)';
        c.beginPath(); c.arc(x, y - r * .26, r * .70, Math.PI, 0); c.fill();
        c.restore();
        glyph(c, kk.shape, x, y, r * .58, C.cream);
        if (lines[k].glow > 0) {
          rr = r + (1 - lines[k].glow) * cs * .30;
          c.save();
          c.globalAlpha = lines[k].glow * .9;
          c.strokeStyle = C.cream; c.lineWidth = 6;
          c.beginPath(); c.arc(x, y, rr, 0, 6.2832); c.stroke();
          c.restore();
        }
      }
    }
  }

  function drawBoard(c) {
    var Art = window.A, r0, c0, x, y, pad = cs * .07, f = fpad, f2 = f * .66;
    if (Art && typeof Art.panel === 'function') Art.panel(c, gx - f, gy - f, side + f * 2, side + f * 2, PANEL_OPT);
    else {
      c.fillStyle = C.barkDark;
      G.roundRect(c, gx - f, gy - f, side + f * 2, side + f * 2, 28); c.fill();
      c.fillStyle = C.bark;
      G.roundRect(c, gx - f2, gy - f2, side + f2 * 2, side + f2 * 2, 22); c.fill();
    }
    for (r0 = 0; r0 < n; r0++) {
      for (c0 = 0; c0 < n; c0++) {
        x = gx + c0 * cs + pad; y = gy + r0 * cs + pad;
        c.fillStyle = ((r0 + c0) & 1) ? '#e7d9b6' : '#f0e5c8';
        G.roundRect(c, x, y, cs - pad * 2, cs - pad * 2, cs * .18); c.fill();
      }
    }
  }

  /* Button icons — a child who cannot read has to tell the buttons apart. */
  function iconRestart(cc, cx, cy, s) {
    cc.save();
    cc.strokeStyle = '#fff6e0'; cc.lineWidth = s * .17; cc.lineCap = 'round';
    cc.beginPath(); cc.arc(cx, cy, s * .34, .7, 5.3); cc.stroke();
    cc.fillStyle = '#fff6e0';
    cc.beginPath();
    cc.moveTo(cx + s * .40, cy - s * .46); cc.lineTo(cx + s * .48, cy + s * .04); cc.lineTo(cx + s * .02, cy - s * .18);
    cc.closePath(); cc.fill();
    cc.restore();
  }
  function iconHouse(cc, cx, cy, s) {
    cc.save();
    cc.fillStyle = '#fff6e0'; cc.strokeStyle = '#5b2c00';
    cc.lineWidth = Math.max(3, s * .09); cc.lineJoin = 'round';
    cc.beginPath();
    cc.moveTo(cx - s * .46, cy + s * .04); cc.lineTo(cx, cy - s * .44); cc.lineTo(cx + s * .46, cy + s * .04);
    cc.lineTo(cx + s * .33, cy + s * .04); cc.lineTo(cx + s * .33, cy + s * .42);
    cc.lineTo(cx - s * .33, cy + s * .42); cc.lineTo(cx - s * .33, cy + s * .04);
    cc.closePath(); cc.fill(); cc.stroke();
    cc.restore();
  }
  function iconGrid(cc, cx, cy, s) {
    var i, j, d = s * .21, o = s * .24;
    cc.save();
    cc.fillStyle = '#fff6e0';
    for (i = 0; i < 2; i++) for (j = 0; j < 2; j++) {
      G.roundRect(cc, cx - o - d / 2 + i * o * 2, cy - o - d / 2 + j * o * 2, d, d, d * .3);
      cc.fill();
    }
    cc.restore();
  }

  function drawExample(c, x, y, w, h) {
    var ax = x + w * .24, ay = y + h * .68, bx = x + w * .78, by = y + h * .34, mx = x + w * .52;
    c.save();
    c.fillStyle = 'rgba(255,246,224,.16)';
    G.roundRect(c, x, y, w, h, 20); c.fill();
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(ax, ay); c.lineTo(mx, ay); c.lineTo(mx, by); c.lineTo(bx, by);
    c.lineWidth = 24; c.strokeStyle = G.shade(C.mint, -66); c.stroke();
    c.beginPath();
    c.moveTo(ax, ay); c.lineTo(mx, ay); c.lineTo(mx, by); c.lineTo(bx, by);
    c.lineWidth = 16; c.strokeStyle = C.mint; c.stroke();
    c.fillStyle = C.mint;
    c.beginPath(); c.arc(ax, ay, 20, 0, 6.2832); c.fill();
    c.beginPath(); c.arc(bx, by, 20, 0, 6.2832); c.fill();
    c.restore();
    glyph(c, 'triangolo', ax, ay, 11, C.cream);
    glyph(c, 'triangolo', bx, by, 11, C.cream);
  }

  function drawSide(c) {
    var i, k, x, y, doneCount = 0, step, chipR;
    for (i = 0; i < lines.length; i++) if (lines[i].closed) doneCount++;
    // Chips are centred on the column and shrink with the pair count, so they
    // can never spill past x = 1190 however many pairs the generator returns.
    step = Math.min(74, 340 / (pairs > 0 ? pairs : 1));
    chipR = Math.min(30, step * .44);
    G.text('I Fili Intrecciati', 1000, 122, { size: 30, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
    drawExample(c, 810, 142, 380, 116);
    for (k = 0; k < pairs; k++) {
      x = 1000 - (pairs - 1) * step / 2 + k * step; y = 300;
      c.save();
      c.globalAlpha = lines[k].closed ? 1 : .30;
      c.fillStyle = 'rgba(255,246,224,.92)';
      c.beginPath(); c.arc(x, y, chipR, 0, 6.2832); c.fill();
      c.restore();
      c.save();
      c.globalAlpha = lines[k].closed ? 1 : .45;
      glyph(c, kindOf(k).shape, x, y, chipR * .62, kindOf(k).col);
      c.restore();
    }
    G.text(doneCount + ' / ' + pairs, 1000, 366, { size: 38, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 9 });
    if (won) return;
    G.ui.button({
      x: 810, y: G.level === 2 ? 396 : 424, w: 380, h: 140, r: 30,
      label: 'Ricomincia', color: C.leaf, fontSize: 40, iconSize: 60,
      icon: iconRestart,
      onTap: function () { resetLines(); }
    });
    if (G.level === 2) {
      G.ui.button({
        x: 810, y: 552, w: 380, h: 140, r: 30,
        label: 'Nuova', sub: 'griglia', color: C.blueberry, fontSize: 40, iconSize: 60,
        icon: iconGrid,
        onTap: function () { newGrid(); G.sfx('whoosh'); }
      });
    }
  }

  function drawWinPanel(c) {
    var Art = window.A, pw = 720, ph = 380, px = (W - pw) / 2, py = 176;
    c.save();
    c.fillStyle = 'rgba(9,32,21,.46)';
    c.fillRect(0, 0, W, H);
    c.restore();
    if (Art && typeof Art.panel === 'function') Art.panel(c, px, py, pw, ph, WIN_PANEL_OPT);
    else {
      c.fillStyle = C.barkDark; G.roundRect(c, px, py, pw, ph, 34); c.fill();
      c.fillStyle = C.cream; G.roundRect(c, px + 10, py + 10, pw - 20, ph - 20, 26); c.fill();
    }
    // Neutral wording: the two children are not necessarily both boys.
    G.text(perfect && G.level === 2 ? 'Perfetto!' : 'Evviva!', W / 2, py + 74, { size: 58, color: C.ink });
    var stars = (perfect && G.level === 2) ? 2 : 1, i;
    for (i = 0; i < stars; i++) G.starIcon(c, W / 2 + (i - (stars - 1) / 2) * 72, py + 146, 30);
    /* Third button only when a present is actually waiting, so the two-button
       panel the children already know is untouched the rest of the time. */
    var crate = (typeof G.crates === 'function') ? G.crates() : 0;
    if (crate > 0) {
      G.ui.button({
        x: px + 28, y: py + 196, w: 210, h: 150, r: 32,
        label: 'Ancora!', color: C.leaf, fontSize: 30, iconSize: 48,
        icon: iconRestart,
        onTap: function () { newGrid(); }
      });
      G.ui.button({
        x: px + 255, y: py + 196, w: 210, h: 150, r: 32,
        label: 'Apri la cassa!', color: C.plum, fontSize: 24,
        onTap: function () { G.go('guardaroba'); }
      });
      G.ui.button({
        x: px + 482, y: py + 196, w: 210, h: 150, r: 32,
        label: 'Giungla', color: C.tangerine, fontSize: 30, iconSize: 48,
        icon: iconHouse,
        onTap: function () { G.home(); }
      });
      return;
    }
    G.ui.button({
      x: px + 42, y: py + 196, w: 300, h: 150, r: 32,
      label: 'Ancora!', color: C.leaf, fontSize: 38, iconSize: 56,
      icon: iconRestart,
      onTap: function () { newGrid(); }
    });
    G.ui.button({
      x: px + pw - 342, y: py + 196, w: 300, h: 150, r: 32,
      label: 'Giungla', color: C.tangerine, fontSize: 36, iconSize: 56,
      icon: iconHouse,
      onTap: function () { G.home(); }
    });
  }

  /* ----------------------------------------------------------------- scene */
  G.scene('fili', {
    enter: function () {
      resolvePainters();
      if (!bgGrad && G.ctx && G.ctx.createLinearGradient) {
        bgGrad = G.ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, C.skyDeep);
        bgGrad.addColorStop(1, C.leafDark);
      }
      branch();
      pulse = 0; lastBad = -9;
      newGrid();
      if (!G.save.seen || typeof G.save.seen !== 'object') G.save.seen = {};
      var first = !G.save.seen.fili;
      G.save.seen.fili = true; G.saveNow();
      if (G.level === 2) {
        G.say(first
          ? 'Unisci ogni coppia di pallini uguali, senza far incrociare i fili. Prova a riempire tutta la griglia!'
          : 'Unisci i pallini uguali senza incrociare i fili!');
      } else {
        G.say(first
          ? 'Unisci i pallini uguali! Metti il dito su un pallino e portalo fino al suo gemello.'
          : 'Unisci i pallini uguali!');
      }
    },

    exit: function () { active = -1; },

    update: function (dt) {
      var i;
      pulse += dt;
      for (i = 0; i < lines.length; i++) if (lines[i].glow > 0) lines[i].glow = Math.max(0, lines[i].glow - dt * 1.6);
      if (nearT > 0) nearT = Math.max(0, nearT - dt);
      if (won) {
        winT += dt;
        if (!spoke && winT > .8) {
          spoke = true;
          G.say(perfect && G.level === 2 ? 'Perfetto! Hai riempito tutta la griglia!' : 'Evviva! Hai unito tutti i fili!');
        }
      }
    },

    draw: function (c) {
      var Art = window.A;
      if (Art && typeof Art.jungle === 'function') Art.jungle(c, G.t, JUNGLE_OPT);
      else { c.fillStyle = bgGrad || C.leafDark; c.fillRect(0, 0, W, H); }
      if (Art && typeof Art.dino === 'function') {
        DINO_OPT.t = G.t;
        DINO_OPT.color = (G.account && G.account.color) || C.dino;
        DINO_OPT.pose = won ? 'happy' : (active >= 0 ? 'think' : 'idle');
        Art.dino(c, 104, 692, 176, DINO_OPT);
      }
      drawBoard(c);
      drawThreads(c);
      drawDots(c);
      if (active >= 0 && lines[active].cells.length) {
        var L = lines[active], head = L.cells[L.cells.length - 1];
        c.save();
        c.globalAlpha = .55 + Math.sin(pulse * 9) * .25;
        c.strokeStyle = C.cream; c.lineWidth = 5;
        c.beginPath(); c.arc(cxOf(head[1]), cyOf(head[0]), cs * .40, 0, 6.2832); c.stroke();
        c.restore();
      }
      drawGaps(c);
      drawSide(c);
      if (won && winT > .85) drawWinPanel(c);
    },

    onDown: function (p) {
      if (won) return;
      var hit = cellAt(p);
      if (!hit) { active = -1; return; }

   Level 2 (6 years old): all 5 plots, upgrades to level 5, level pips and

    c.beginPath(); c.ellipse(cx, GROUND - 20, rw - 10, 31, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3;
    for (i = 0; i < 3; i++) {
      k = (G.t * .3 + i / 3) % 1;
      c.globalAlpha = (1 - k) * .6;
      c.beginPath(); c.ellipse(cx, GROUND - 20, 14 + k * (rw - 24), 5 + k * 21, 0, 0, TAU); c.stroke();
    }
    c.globalAlpha = 1;
    for (i = 0; i < 3; i++) {
      var lx = cx - rw * .48 + i * rw * .48, ly = GROUND - 26 + (i % 2) * 12;
      c.fillStyle = i === 1 ? C.leafLight : C.leaf;
      c.beginPath(); c.ellipse(lx, ly, 21, 9, 0, 0, TAU); c.fill();
      c.fillStyle = C.leafDark;
      c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx + 8, ly - 5); c.lineTo(lx + 8, ly + 5); c.fill();
    }
    c.restore();
    fruitIcon(c, cx + rw * .18, GROUND - 46 - Math.abs(Math.sin(G.t * 1.2)) * 8, 15, 'melone');
    if (rockFn) { rockFn(c, cx - rw - 6, GROUND - 12, 42); rockFn(c, cx + rw + 4, GROUND - 8, 30); }
    else {
      blobs(c, [cx - rw - 6, GROUND - 16, 22, cx + rw + 4, GROUND - 12, 16], '#9aa7a2', 4);
    }
  }

  function sprout(c, x, y, s, ph) {
    var sw = Math.sin(G.t * 1.1 + ph) * .2;
    c.save();
    c.translate(x, y); c.rotate(sw * .28);
    c.strokeStyle = C.leafDark; c.lineWidth = Math.max(2.5, s * .10); c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -s * .52); c.stroke();
    c.fillStyle = C.leafLight;
    c.beginPath(); c.ellipse(-s * .26, -s * .36, s * .30, s * .15, -.7, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(s * .26, -s * .36, s * .30, s * .15, .7, 0, TAU); c.fill();
    c.restore();
  }

  function pGarden(c, cx, lvl) {
    var r, i, x, hw, yy, flowerFn = A_('flower');
    c.save();
    c.fillStyle = '#6d4a2a';
    for (r = 0; r < 3; r++) {
      c.beginPath(); c.ellipse(cx, GROUND - 6 - r * 26, 104 - r * 17, 11, 0, 0, TAU); c.fill();
    }
    c.restore();
    for (r = 0; r < 3; r++) {
      hw = 86 - r * 17; yy = GROUND - 10 - r * 26;
      for (i = 0; i < 3; i++) {
        x = cx - hw + i * hw;
        sprout(c, x, yy, 30 + r * 4 + Math.min(lvl, 5) * 2, i + r * 2);
      }
    }
    if (flowerFn) { flowerFn(c, cx - 108, GROUND - 24, 26, C.pinkPop); flowerFn(c, cx + 110, GROUND - 20, 24, C.sun); }
    fruitIcon(c, cx - 44, GROUND - 40, 14, 'mela');
    fruitIcon(c, cx + 48, GROUND - 34, 13, 'melone');
  }

  function drawPlotArt(c, d, cx, it, ghost) {
    var lvl = ghost ? 1 : (it.lvl || 1);
    var pop = S.pop[d.id] || 0;
    var sy = 1 + Math.sin(pop * Math.PI) * .10;
    c.save();
    if (ghost) c.globalAlpha = .20;
    else plotShadow(c, cx, conf().w * .33);
    c.translate(cx, GROUND); c.scale(2 - sy, sy); c.translate(-cx, -GROUND);
    if (d.id === 'cespuglio') pBush(c, cx, lvl);
    else if (d.id === 'banano') pPalm(c, cx, lvl);
    else if (d.id === 'uova') pNest(c, cx, lvl, it);
    else if (d.id === 'stagno') pPond(c, cx, lvl);
    else pGarden(c, cx, lvl);
    c.restore();
  }

  /* --------------------------------------------------------- floating fruit */
  function drawBubbles(c, d, R) {
    var list = S.bub[d.id], i, b, by;
    for (i = 0; i < list.length; i++) {
      b = list[i];
      by = b.y + Math.sin(G.t * 1.7 + b.ph) * 8;
      c.save();
      c.globalAlpha = .30; c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(b.x, by, R * .62, 0, TAU); c.fill();
      c.restore();
      fruitIcon(c, b.x, by, R * .44, d.kind);
      if (b.v > 1) {
        c.save();
        c.fillStyle = C.cream; c.strokeStyle = C.bark; c.lineWidth = 3;
        c.beginPath(); c.arc(b.x + R * .44, by - R * .44, 19, 0, TAU); c.fill(); c.stroke();
        c.restore();
        G.text(nShow(b.v), b.x + R * .44, by - R * .42, { size: 23, color: C.ink });
      }
    }
  }

  /* ------------------------------------------------------------------ title */

  /* One title, no tabs: the hat shop that used to sit beside the clearing moved
     out to its own place, so this scene is a single product again and gets its
     y 104..206 band back. */
  function drawTabs(c, sv) {
    var sign = A_('sign');
    if (sign) sign(c, 578, TAB_Y - 4, 272, TAB_H + 8, 'Il Nido');
    else {
      board(c, 578, TAB_Y, 272, TAB_H, 24);
      G.text('Il Nido', 714, TAB_Y + TAB_H / 2, { size: 40, color: C.ink });
    }

    // Level 2 gets a single "collect everything" button; level 1 has one huge
    // button per plot instead, which is easier to understand at three.
    if (G.level !== 2) return;
    var n = nSlots(), tot = 0;
    DEFS.forEach(function (d, i) { if (i < n) tot += bubSum(S.bub[d.id]); });
    if (tot <= 0) return;
    G.ui.button({
      id: 'nido-all', x: 976, y: TAB_Y, w: 276, h: TAB_H, r: 26, color: C.leaf,
      label: nShow(tot), sub: 'Raccogli tutto', fontSize: 40,
      icon: function (cc, x, y, s) { fruitIcon(cc, x, y, s * .34, 'fragola'); },
      onTap: function () {
        var got = pickEverything(sv);
        if (got > 0) { G.sfx('good'); G.say('Che raccolto!'); }
      }
    });
  }

  /* ------------------------------------------------------------- the clearing */
  function drawField(c, sv, live) {
    var L = conf(), n = L.n, i;

    // soil patches
    for (i = 0; i < n; i++) {
      c.save();
      c.fillStyle = 'rgba(60,40,18,.18)';
      c.beginPath(); c.ellipse(colCx(L, i), GROUND + 6, L.w * .40, 21, 0, 0, TAU); c.fill();
      c.restore();
    }

    DEFS.forEach(function (d, i) {
      if (i >= n) return;
      var it = sv.items[d.id], cx = colCx(L, i);
      if (it.n) drawPlotArt(c, d, cx, it, false);
      else {
        c.save();
        c.setLineDash([13, 13]);
        c.lineDashOffset = -G.t * 12;
        c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 5;
        G.roundRect(c, colX(L, i) + 14, GROUND - 196, L.w - 28, 196, 26); c.stroke();
        c.setLineDash([]); c.lineDashOffset = 0;
        c.restore();
        drawPlotArt(c, d, cx, it, true);   // a faded preview of what grows here
      }

      // growth bar (gold and pulsing when the plot is full)
      if (!it.n) return;
      var bw = L.w * .56, bx = cx - bw / 2, full = it.pend >= STORE_CAP;
      c.save();
      c.fillStyle = 'rgba(18,48,30,.45)';
      G.roundRect(c, bx, GROUND + 12, bw, 11, 6); c.fill();
      if (full) {
        c.globalAlpha = .5 + Math.sin(G.t * 4) * .35;
        c.fillStyle = C.sun;
        G.roundRect(c, bx, GROUND + 12, bw, 11, 6); c.fill();
      } else {
        c.fillStyle = C.leafLight;
        G.roundRect(c, bx, GROUND + 12, Math.max(7, bw * G.clamp(it.t / d.every, 0, 1)), 11, 6); c.fill();
      }
      c.restore();
    });

    DEFS.forEach(function (d, i) { if (i < n) drawBubbles(c, d, L.bubR); });

    if (live) drawPlotButtons(c, sv, L, n);
    drawPlotInfo(c, sv, L, n);
  }

  function drawPlotButtons(c, sv, L, n) {
    DEFS.forEach(function (d, i) {
      if (i >= n) return;
      var it = sv.items[d.id], cx = colCx(L, i);
      var o = { id: 'nido-p-' + d.id, x: colX(L, i), y: L.bY, w: L.w, h: L.bH, r: 26 };

      if (!it.n) {
        /* --- buy: cost written with the fruit icon, name underneath */
        var cost = buyCost(d), can = fruitsOwned() >= cost;
        o.label = nShow(cost);
        o.sub = d.name;
        o.fontSize = G.level === 2 ? 42 : 50;
        o.color = can ? C.tangerine : '#a49889';
        o.icon = function (cc, x, y, s) { fruitIcon(cc, x, y, s * .36, 'fragola'); };
        o.onTap = function () {
          if (fruitsOwned() < cost || !G.spend(cost)) { softNo('fruit', cx, 370); return; }
          it.n = 1; it.lvl = 1; it.t = 0;
          S.pop[d.id] = 1;
          G.fx.confetti(); G.sfx('win');
          G.fx.ring(cx, GROUND - 90, C.cream, 200);
          G.say('Hai comprato ' + d.an + '!');
          G.saveNow();
        };

      } else if (G.level === 2 && it.lvl < maxLvl()) {
        /* --- upgrade (level 2 only): cost in fruit, level written small */
        var uc = upCost(d, it.lvl), canUp = fruitsOwned() >= uc;
        o.label = nShow(uc);
        o.sub = 'liv. ' + it.lvl + ' → ' + (it.lvl + 1);
        o.fontSize = 38;
        o.color = canUp ? C.plum : '#a49889';
        o.icon = function (cc, x, y, s) {
          fruitIcon(cc, x, y, s * .34, 'fragola');
          upGlyph(cc, o.x + o.w - o.h * .40, y, s * .40);
        };
        o.onTap = function () {
          if (fruitsOwned() < uc || !G.spend(uc)) { softNo('fruit', cx, 370); return; }
          it.lvl = Math.min(maxLvl(), it.lvl + 1);
          S.pop[d.id] = 1;
          G.sfx('win');
          G.fx.burst(cx, GROUND - 110, { color: C.sun, count: 22, speed: 270, size: 12, life: .8, shape: 'star' });
          G.say(d.name + ' più grande!');
          G.saveNow();
        };

      } else {
        /* --- harvest: the whole plot in one enormous tap */
        var ready = it.pend > 0;
        o.label = ready ? nShow(it.pend) : 'Cresce';
        o.sub = ready ? 'Raccogli' : null;
        o.fontSize = ready ? (G.level === 2 ? 40 : 50) : 32;
        o.color = ready ? C.leaf : '#a49889';
        o.icon = function (cc, x, y, s) { fruitIcon(cc, x, y, s * .36, d.kind); };
        o.onTap = function () {
          if (!ready) {
            G.say('I frutti stanno ancora crescendo.');
            G.fx.text(cx, 400, 'Cresce...', C.cream, 32);
            return;
          }
          var got = pickPlot(d, it, i);
          if (got > 0) { G.sfx('good'); G.say(G.pick(['Che bei frutti!', 'Buonissimi!', 'Bravo!'])); }
        };
      }
      G.ui.button(o);
    });
  }

  function drawPlotInfo(c, sv, L, n) {
    var big = G.level === 1 ? 1.18 : 1;
    DEFS.forEach(function (d, i) {
      if (i >= n) return;
      var it = sv.items[d.id], cx = colCx(L, i), y = L.iY;
      var per = yieldOf(d, it.n ? it.lvl : 1);
      c.save();
      c.globalAlpha = it.n ? 1 : .62;
      fruitIcon(c, cx - 70 * big, y, 15 * big, d.kind);
      G.text('×' + per, cx - 50 * big, y, {
        size: 27 * big, color: C.cream, align: 'left', stroke: 'rgba(10,36,22,.75)', strokeWidth: 7
      });
      clockIcon(c, cx + 24 * big, y, 15 * big);
      G.text(d.every + 's', cx + 44 * big, y, {
        size: 25 * big, color: C.cream, align: 'left', stroke: 'rgba(10,36,22,.75)', strokeWidth: 7
      });
      c.restore();
      if (G.level === 2 && it.n) {
        var k;
        for (k = 0; k < maxLvl(); k++) {
          c.save();
          c.fillStyle = k < it.lvl ? C.sun : 'rgba(255,255,255,.32)';
          c.beginPath(); c.arc(cx - 40 + k * 20, y + 28, k < it.lvl ? 8 : 6, 0, TAU); c.fill();
          c.restore();
        }
      }
    });
  }

  /* ------------------------------------------------------------- the hat shop */
  function drawWelcome(c) {
    var i, a, rr;
    c.save(); c.fillStyle = 'rgba(8,26,18,.64)'; c.fillRect(0, 0, W, H); c.restore();

    // fruit orbiting the panel, the "look what grew" moment
    for (i = 0; i < 11; i++) {
      a = WB.t * .85 + i * (TAU / 11);
      rr = 316 + Math.sin(WB.t * 1.5 + i) * 26;
      fruitIcon(c, 640 + Math.cos(a) * rr, 356 + Math.sin(a) * rr * .52, 21, DEFS[i % DEFS.length].kind);
    }

    board(c, 300, 148, 680, 424, 34);
    G.text('Mentre non c\'eri...', 640, 216, { size: 46, color: C.ink });
    var bump = 1 + Math.sin(WB.t * 3.4) * .04;
    c.save();
    c.translate(640, 322); c.scale(bump, bump); c.translate(-640, -322);
    fruitIcon(c, 516, 322, 54, 'fragola');
    G.text('+' + nShow(WB.total), 594, 322, {
      size: 86, color: C.berry, align: 'left', stroke: 'rgba(70,18,26,.20)', strokeWidth: 9
    });
    c.restore();
    if (WB.chicks > 0) {
      G.text(WB.chicks === 1 ? 'e si è schiuso 1 cucciolo!' : 'e si sono schiusi ' + WB.chicks + ' cuccioli!',
        640, 396, { size: 27, color: '#8a7864', weight: 800 });
    }
    G.ui.button({
      id: 'nido-wb', x: 400, y: 424, w: 480, h: 126, r: 30, color: C.tangerine,
      label: 'Raccogli!', fontSize: 54,
      icon: function (cc, x, y, s) { fruitIcon(cc, x, y, s * .34, 'fragola'); },
      onTap: function () {
        G.addFruits(WB.total, 640, 322);
        G.fx.confetti(); G.sfx('win');
        G.say('Evviva!');
        WB.on = false; WB.total = 0; WB.chicks = 0;
        S.idle = 0;
      }
    });
  }

  /* -------------------------------------------------------------------- scene */
  G.scene('nido', {
    enter: function () {
      var sv = bank(), n = nSlots();
      S.bub = {}; S.chicks = []; S.pet = {}; S.pop = {};
      S.idle = 0; S.hintT = 0; S.saveT = 0; S.hello = .5;
      WB.on = false; WB.total = 0; WB.chicks = 0; WB.t = 0;
      DEFS.forEach(function (d) { S.bub[d.id] = []; });

      // a three-year-old must never meet an empty clearing he cannot afford
      var gift = false;
      if (G.level === 1 && !G.save.seen.nido && !sv.items.cespuglio.n) {
        sv.items.cespuglio.n = 1; sv.items.cespuglio.lvl = 1; sv.items.cespuglio.t = 0;
        gift = true;
      }
      G.save.seen.nido = true;

      var res = catchUp(sv);
      syncChicks(sv.items.uova.chicks);

      // rebuild the fruit that was floating when we left
      DEFS.forEach(function (d, i) {
        if (i >= n) return;
        var it = sv.items[d.id], waiting = it.pend;
        it.pend = 0;
        if (it.n && waiting > 0) addFruitTo(d, it, i, waiting);
      });

      var away = res.total + res.spare;
      if (res.away >= WELCOME_MIN && away >= 1) {
        WB.on = true; WB.total = Math.min(9999, Math.round(away)); WB.chicks = res.hatched;
        G.sfx('chime');
      } else {
        DEFS.forEach(function (d, i) {
          if (i >= n) return;
          if (sv.items[d.id].n && res.got[d.id]) addFruitTo(d, sv.items[d.id], i, res.got[d.id]);
        });
        if (res.spare > 0) G.addFruits(res.spare, 640, 380);
      }
      S.gift = gift;
      G.saveNow();
    },

    exit: function () {
      var sv = bank();
      DEFS.forEach(function (d) {
        sv.items[d.id].pend = G.clamp(Math.round(bubSum(S.bub[d.id] || [])), 0, STORE_CAP);
      });
      sv.lastSeen = Date.now();
      // never swallow the welcome-back gift, even if we walk out on it
      if (WB.on && WB.total >= 1) { G.addFruits(WB.total, 640, 322); WB.on = false; WB.total = 0; }
      G.saveNow();
    },

    update: function (dt) {
      var sv = bank(), n = nSlots(), i, d;

      if (S.hello > 0) {
        S.hello -= dt;
        if (S.hello <= 0) {
          if (WB.on) G.say('Mentre non c\'eri sono cresciuti ' + WB.total + ' frutti!');
          else if (S.gift) G.say('Benvenuto nel Nido! Il primo cespuglio è un regalo per te.');
          else G.say(G.pick(['Benvenuto nel Nido!', 'Ecco la tua radura!', 'Guarda come cresce il Nido!']));
        }
      }
      for (i = 0; i < DEFS.length; i++) {
        d = DEFS[i];
        if (S.pop[d.id] > 0) S.pop[d.id] = Math.max(0, S.pop[d.id] - dt * 2.6);
        if (S.pet[d.id] > 0) S.pet[d.id] = Math.max(0, S.pet[d.id] - dt);
      }

      if (WB.on) { WB.t += dt; return; }

      // growth
      DEFS.forEach(function (d, i) {
        if (i >= n) return;
        var it = sv.items[d.id];
        if (!it.n) return;
        if (it.pend >= STORE_CAP) { it.t = Math.min(it.t + dt, d.every); return; }
        it.t += dt;
        var guard = 0;
        while (it.t >= d.every && guard < 4) {
          it.t -= d.every; guard++;
          harvest(d, it, i);
          if (it.pend >= STORE_CAP) { it.t = d.every; break; }
        }
        if (it.t > d.every) it.t = d.every;
      });

      // chicks pottering about
      for (i = 0; i < S.chicks.length; i++) {
        var k = S.chicks[i];
        k.x += k.dir * k.sp * dt;
        if (k.x > .78) { k.x = .78; k.dir = -1; }
        if (k.x < -.78) { k.x = -.78; k.dir = 1; }
      }

      // a gentle nudge when ripe fruit is just sitting there
      var ripe = 0;
      DEFS.forEach(function (d, i) { if (i < n) ripe += bubSum(S.bub[d.id]); });
      S.idle += dt;
      if (ripe > 0 && S.idle > 6) {
        S.hintT -= dt;
        if (S.hintT <= 0) {
          S.hintT = 2.4;
          var found = null;
          DEFS.forEach(function (d, i) { if (i < n && !found && S.bub[d.id].length) found = S.bub[d.id][0]; });
          if (found) G.fx.ring(found.x, found.y, C.cream, 110);
          if (G.level === 1 && S.idle > 11 && S.idle < 14) G.say('Tocca i frutti per raccoglierli!');
        }
      }

      // keep lastSeen honest while playing: nothing may ever be counted twice
      S.saveT += dt;
      if (S.saveT > 2) { S.saveT = 0; sv.lastSeen = Date.now(); G.saveNow(); }
    },

    draw: function (c) {
      var sv = bank();               // an ancient or partial save must not crash us
      drawBg(c);
      drawField(c, sv, !WB.on);
      if (!WB.on) drawTabs(c, sv);
      else drawWelcome(c);
    },

    onDown: function (p) {
      if (WB.on || p.y < FIELD_TOP) return;
      S.idle = 0; S.hintT = 0;

      var L = conf(), sv = bank(), n = L.n, i, j;
      var best = null, bestD = 1e9;

      // 1) floating fruit: the nearest one inside a very forgiving radius
      for (i = 0; i < n; i++) {
        var d = DEFS[i], list = S.bub[d.id];
        for (j = 0; j < list.length; j++) {
          var b = list[j];
          var by = b.y + Math.sin(G.t * 1.7 + b.ph) * 8;
          var dd = G.dist(p.x, p.y, b.x, by);
          if (dd < bestD && dd <= L.bubR * L.tapK) { bestD = dd; best = { d: d, k: j }; }
        }
      }
      if (best) { pickBubble(best.d, sv.items[best.d.id], best.k); return; }

      // 2) a stroke on the plot itself: always a little joy, +1 on a cooldown
      for (i = 0; i < n; i++) {
        var pd = DEFS[i], it = sv.items[pd.id];
        var x0 = colX(L, i), cx = colCx(L, i);
        if (p.x < x0 || p.x > x0 + L.w || p.y < GROUND - 256 || p.y > GROUND + 18) continue;
        if (!it.n) {
          G.sfx('tap');
          G.fx.burst(cx, GROUND - 8, { color: C.sand, count: 7, speed: 120, size: 8, life: .4 });
          return;
        }
        S.pop[pd.id] = 1;
        G.fx.burst(cx, GROUND - 96, { color: C.leafLight, count: 10, speed: 200, size: 11, life: .55, shape: 'rect' });
        if (pd.id === 'uova' && S.chicks.length) {
          G.sfx('pop');
          G.fx.text(cx, GROUND - 130, 'Squit!', C.cream, 34);
        } else {
          G.sfx('tap');
        }
        if ((S.pet[pd.id] || 0) <= 0) {
          S.pet[pd.id] = PET_CD;
          G.addFruits(1, cx, GROUND - 140);
        }
        return;
      }
    }
  });
})();


/* ==================== 23-guardaroba.js ==================== */
/* Dino Giungla — "Il Guardaroba".

   The fourth place. It is NOT a shop: nothing here has a price, and nothing
   here can ever tell a child no. Pieces arrive in crates that fill up as you
   play the other three games, and a crate that is not ready yet is simply not
   drawn — not greyed out, not padlocked. A dark object that answers "not yet"
   is a padlock painted beige.

   The reward is not the piece, it is the REACTION: every item carries a pose
   and a line (see A.GEAR in 01c-art-gear.js), so putting the nightcap on makes
   the dino actually fall asleep. Reliable cause and effect is the thing a
   three-year-old repeats eighty times in a row.

   Level 1 is a toy box with four rules and no slots at all: tap a toy, it flies
   on and the dino reacts; tap it again, it comes off; tap the dino, he does it
   again; tap the dice, everything changes. Level 2 is composition: four slots,
   a shelf per slot, three portraits that save a whole look, and a window onto
   your brother's dino.

   Owns: G.save.guardaroba, plus G.save.hat / G.save.hats, which moved here when
   the hat shop left the Nido. */
(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;

  /* Given in this order — sorted by how strong the reaction is, not by slot.
     The first four crates are the four best reactions in the game. Showing a
     child "the four places things go" is a grown-up's taxonomy; at three it
     means nothing. */
  var CRATE_ORDER = [
    'cuffia', 'occhialini', 'fiocco', 'mago', 'papillon', 'sole', 'corona',
    'anellino', 'berretto', 'medaglia', 'pirata', 'fiore', 'esploratore', 'cilindro'
  ];

  /* Stars needed to have earned the nth crate. Cheap at first — the first crate
     lands after two games — then slower. The whole collection costs 48 stars
     against the 107 the old shop wanted for the eight hats alone. */
  function starsFor(n) {
    return n <= 6 ? n * 2 : n <= 12 ? 12 + (n - 6) * 4 : 36 + (n - 12) * 6;
  }

  /* ------------------------------------------------------------ save branch */
  function br() {
    var g = G.save.guardaroba;
    if (!g || typeof g !== 'object') { g = G.save.guardaroba = {}; }
    if (!g.gear || typeof g.gear !== 'object') g.gear = { occhi: null, collo: null, coda: null };
    if (!Array.isArray(g.owned)) g.owned = [];
    if (!Array.isArray(g.shots)) g.shots = [];
    if (typeof g.opened !== 'number' || !isFinite(g.opened) || g.opened < 0) g.opened = 0;
    if (typeof g.nudges !== 'number' || !isFinite(g.nudges)) g.nudges = 0;
    if (A.SLOTS.indexOf(g.slot) < 0) g.slot = 'testa';
    if (!Array.isArray(G.save.hats)) G.save.hats = [];
    if (typeof G.save.hat !== 'string') G.save.hat = null;

    /* One-off migration: whoever already bought hats keeps them, is not given
       them a second time (CRATE_ORDER skips what you own), and gets credit for
       what they already spent — otherwise closing the shop would quietly wipe
       out an afternoon of saving up. */
    if (typeof g.seed !== 'number' || !isFinite(g.seed)) {
      var spent = 0, k;
      for (k = 0; k < (A.HATS || []).length; k++) {
        if (G.save.hats.indexOf(A.HATS[k].id) >= 0) spent += A.HATS[k].price || 0;
      }
      g.seed = spent;
      g.opened = Math.min(CRATE_ORDER.length, G.save.hats.length);
    }
    return g;
  }

  function ownsId(id) {
    var g = A.gearOf(id);
    if (!g) return false;
    return g.slot === 'testa'
      ? G.save.hats.indexOf(id) >= 0
      : br().owned.indexOf(id) >= 0;
  }
  function ownedList() {
    return A.GEAR.filter(function (g) { return ownsId(g.id); });
  }
  function wornIn(slot) {
    return slot === 'testa' ? G.save.hat : br().gear[slot];
  }
  function wear(slot, id) {
    if (slot === 'testa') G.save.hat = id; else br().gear[slot] = id;
    G.saveNow();
  }

  /* How many crates have been earned, opened, and are waiting right now.
     Recomputed every frame on purpose: G.addStars does not raise G.save.stars
     until the flying star lands on the HUD (~0.6s), so a crate earned by the
     round you just won would be invisible if this were read once on enter(). */
  function earned() {
    var g = br(), total = (G.save.stars || 0) + g.seed, n = 0;
    while (n < CRATE_ORDER.length && starsFor(n + 1) <= total) n++;
    return n;
  }
  function waiting() { return Math.max(0, earned() - br().opened); }
  function nextId() {
    for (var i = 0; i < CRATE_ORDER.length; i++) {
      if (!ownsId(CRATE_ORDER[i])) return CRATE_ORDER[i];
    }
    return null;
  }
  /* Published so the jungle can badge the station and the two minigames can
     offer a shortcut straight to the present. */
  G.crates = function () { return waiting(); };

  /* --------------------------------------------------------------- state */
  var S = {
    mode: 'gioca',        // 'gioca' | 'apri'
    react: 0,             // seconds left on the current reaction
    pose: null, last: null,
    fly: null,            // {id, x, y, tx, ty, k}
    crate: 0,             // taps landed on the crate, 0..3
    prize: null, prizeT: 0,
    idle: 0, shake: 0, flash: 0
  };
  var look = { testa: null, occhi: null, collo: null, coda: null };
  var mate = { testa: null, occhi: null, collo: null, coda: null };

  function react(id) {
    var g = A.gearOf(id);
    if (!g) return;
    S.react = 1.4; S.pose = g.pose; S.last = id;
    G.say(g.say);
  }
  function pose() { return S.react > 0 ? S.pose : 'idle'; }

  /* --------------------------------------------------------------- pieces */
  function toggle(id, fromX, fromY, dinoX, dinoY) {
    var g = A.gearOf(id);
    if (!g) return;
    if (wornIn(g.slot) === id) {                 // same rule, mirrored: take it off
      wear(g.slot, null);
      G.sfx('pop');
      G.fx.burst(fromX, fromY, { color: C.cream, count: 8, speed: 120, life: 0.5 });
      if (S.last === id) { S.react = 0; S.last = null; }
      return;
    }
    wear(g.slot, id);
    G.sfx('tap');
    /* The 0.4s flight is not a delay to trim: at three, tracking a slow moving
       object is mature, while a saccade to a sparkle 900px from your finger is
       not. It is what makes the destination legible. */
    S.fly = { id: id, x: fromX, y: fromY, tx: dinoX, ty: dinoY, k: 0 };
  }

  function stripAll() {
    var i;
    wear('testa', null);
    for (i = 1; i < A.SLOTS.length; i++) wear(A.SLOTS[i], null);
    S.react = 0; S.last = null;
    G.sfx('pop');
    for (i = 0; i < 14; i++) {
      G.fx.burst(240 + Math.random() * 140, 300 + Math.random() * 200,
        { color: C.sun, count: 3, speed: 200, life: 0.8, gravity: 420, shape: 'star' });
    }
    G.say('Tutto via!');
  }

  function roll() {
    var own = ownedList(), i, s, pool, pick = null;
    for (i = 0; i < A.SLOTS.length; i++) {
      s = A.SLOTS[i];
      pool = own.filter(function (g) { return g.slot === s; });
      /* Every owned slot, including the ones this level does not show — a child
         who put a bow on the tail at level 2 and then moved to level 1 must
         still be able to lose it. And null is a legal outcome: sometimes the
         surprise is that something comes off. */
      if (!pool.length) { wear(s, null); continue; }
      var r = G.rndi(0, pool.length);            // == pool.length means "nothing"
      wear(s, r >= pool.length ? null : pool[r].id);
      if (r < pool.length) pick = pool[r].id;
    }
    G.sfx('chime');
    G.fx.confetti();
    if (pick) react(pick); else G.say('Sorpresa!');
  }

  /* ---------------------------------------------------------------- crate */
  function openCrate() {
    var g = br(), id = nextId();
    g.opened = Math.min(CRATE_ORDER.length, g.opened + 1);
    if (!id) { G.saveNow(); S.mode = 'gioca'; return; }
    var item = A.gearOf(id);
    if (item.slot === 'testa') { if (G.save.hats.indexOf(id) < 0) G.save.hats.push(id); }
    else if (g.owned.indexOf(id) < 0) g.owned.push(id);
    wear(item.slot, id);
    G.saveNow();
    S.prize = id; S.prizeT = 2.2;
    G.sfx('win'); G.fx.confetti();
    G.fx.ring(W / 2, 380, C.sun);
    G.say('Guarda! ' + item.name + '!');
    S.react = 2.2; S.pose = item.pose; S.last = id;
  }

  function drawCrate(c, x, y, s, open) {
    var w = s * 0.52, hh = s * 0.34, lift = open * 0.5;
    c.save();
    c.fillStyle = 'rgba(20,10,0,.22)';
    c.beginPath(); c.ellipse(x, y + hh + s * 0.06, w * 1.05, s * 0.09, 0, 0, 7); c.fill();
    if (open > 0.05) {                            // light spilling out
      c.globalAlpha = 0.30 + open * 0.5;
      c.fillStyle = C.sun;
      c.beginPath(); c.ellipse(x, y - hh * 0.2, w * (0.7 + open), hh * (0.5 + open), 0, 0, 7); c.fill();
      c.globalAlpha = 1;
    }
    c.save();                                     // lid, hinged at the back
    c.translate(x, y - hh);
    c.rotate(-lift);
    c.fillStyle = C.barkDark;
    G.roundRect(c, -w, -s * 0.20, w * 2, s * 0.22, s * 0.05); c.fill();
    c.fillStyle = C.bark;
    G.roundRect(c, -w * 0.94, -s * 0.17, w * 1.88, s * 0.15, s * 0.04); c.fill();
    c.restore();
    c.fillStyle = C.barkDark;                     // body
    G.roundRect(c, x - w, y - hh, w * 2, hh * 2, s * 0.05); c.fill();
    c.fillStyle = C.bark;
    G.roundRect(c, x - w * 0.94, y - hh * 0.9, w * 1.88, hh * 1.8, s * 0.04); c.fill();
    c.fillStyle = C.barkDark;                     // bands
    c.fillRect(x - w * 0.62, y - hh, w * 0.16, hh * 2);
    c.fillRect(x + w * 0.46, y - hh, w * 0.16, hh * 2);
    c.fillStyle = C.sun;                          // clasp
    c.beginPath(); c.arc(x, y - hh * 0.05, s * 0.07, 0, 7); c.fill();
    c.restore();
  }

  /* -------------------------------------------------------------- helpers */
  function cross(c, cx, cy, r) {
    c.save();
    c.strokeStyle = 'rgba(120,100,80,.75)'; c.lineWidth = Math.max(3, r * 0.13);
    c.lineCap = 'round';
    c.beginPath(); c.arc(cx, cy, r * 0.66, 0, 7); c.stroke();
    c.beginPath();
    c.moveTo(cx - r * 0.44, cy + r * 0.44); c.lineTo(cx + r * 0.44, cy - r * 0.44);
    c.stroke(); c.restore();
  }
  function dice(c, cx, cy, r) {
    c.save();
    c.fillStyle = C.cream;
    G.roundRect(c, cx - r * 0.62, cy - r * 0.62, r * 1.24, r * 1.24, r * 0.22);
    c.fill();
    c.strokeStyle = C.ink; c.lineWidth = Math.max(2.5, r * 0.09); c.stroke();
    c.fillStyle = C.ink;
    [[-0.28, -0.28], [0.28, -0.28], [0, 0], [-0.28, 0.28], [0.28, 0.28]].forEach(function (p) {
      c.beginPath(); c.arc(cx + p[0] * r, cy + p[1] * r, r * 0.10, 0, 7); c.fill();
    });
    c.restore();
  }
  function camera(c, cx, cy, r) {
    c.save();
    c.fillStyle = C.ink;
    G.roundRect(c, cx - r * 0.64, cy - r * 0.42, r * 1.28, r * 0.86, r * 0.14); c.fill();
    c.fillStyle = C.cream;
    c.beginPath(); c.arc(cx, cy, r * 0.28, 0, 7); c.fill();
    c.fillStyle = C.blueberry;
    c.beginPath(); c.arc(cx, cy, r * 0.18, 0, 7); c.fill();
    c.fillStyle = C.berry;
    c.beginPath(); c.arc(cx + r * 0.40, cy - r * 0.26, r * 0.08, 0, 7); c.fill();
    c.restore();
  }
  var SHOT_ICON = ['stella', 'cuore', 'luna'];
  function shotIcon(c, cx, cy, r, i) {
    var f = A.SHAPES && A.SHAPES[SHOT_ICON[i % 3]];
    c.save();
    if (f) f(c, cx, cy, r, [C.sun, C.pinkPop, C.tangerine][i % 3]);
    else { c.fillStyle = C.sun; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); }
    c.restore();
  }

  function backdrop(c) {
    A.jungle(c, G.t, { dim: 0.30 });
    c.save(); c.fillStyle = 'rgba(18,45,30,.42)'; c.fillRect(0, 0, W, H); c.restore();
  }

  /* Preview of a piece inside a cell, at a size the cell can hold. */
  function preview(c, g, cx, cy, size) {
    c.save();
    g.draw(c, cx, cy, size);
    c.restore();
  }

  /* ================================================================ SCENE */
  G.scene('guardaroba', {
    enter: function () {
      var g = br();
      S.mode = waiting() > 0 ? 'apri' : 'gioca';
      S.react = 0; S.pose = null; S.last = null; S.fly = null;
      S.crate = 0; S.prize = null; S.prizeT = 0; S.idle = 0; S.flash = 0;
      G.look(G.save, look);
      if (!G.save.seen) G.save.seen = {};
      var first = !G.save.seen.guardaroba;
      G.save.seen.guardaroba = true;
      G.saveNow();
      setTimeout(function () {
        if (G.current !== 'guardaroba') return;
        if (S.mode === 'apri') G.say('Un regalo! Aprilo!');
        else if (first) G.say('Questo e il guardaroba. Tocca un giocattolo e vedi cosa fa!');
        else G.say(G.pick(['Cosa ti metti oggi?', 'Vestiamo il dino!', 'Provane uno!']));
      }, 420);
    },

    exit: function () { S.fly = null; S.mode = 'gioca'; },

    update: function (dt) {
      if (S.react > 0) S.react = Math.max(0, S.react - dt);
      if (S.prizeT > 0) S.prizeT = Math.max(0, S.prizeT - dt);
      if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 3);
      if (S.fly) {
        S.fly.k += dt / 0.4;
        if (S.fly.k >= 1) { react(S.fly.id); S.fly = null; }
      }
      G.look(G.save, look);

      /* A nudge if he freezes, twice at most, and only for the little one. */
      if (G.level === 1 && S.mode === 'gioca' && !S.fly) {
        S.idle += dt;
        if (S.idle > 12 && br().nudges < 2) {
          S.idle = 0; br().nudges++;
          var own = ownedList();
          if (own.length) { G.say('Provalo!'); S.flash = 1; }
        }
      }
    },

    onDown: function () { S.idle = 0; },

    draw: function (c) {
      backdrop(c);
      if (S.mode === 'apri') { drawOpen(c); return; }
      if (G.level === 2) drawBig(c); else drawSmall(c);
    }
  });

  /* --------------------------------------------------------- crate opening */
  function drawOpen(c) {
    var open = S.prize ? 1 : S.crate / 3;
    G.text('Un regalo per te!', W / 2, 132, {
      size: 54, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 11
    });
    drawCrate(c, W / 2, 420, 330, open);

    if (S.prize) {
      var item = A.gearOf(S.prize);
      var k = 1 - Math.max(0, S.prizeT - 1.2) / 1.0;
      var yy = 300 - G.ease(G.clamp(k, 0, 1)) * 60;
      c.save();
      c.globalAlpha = G.clamp(k * 1.4, 0, 1);
      preview(c, item, W / 2, yy, 150);
      c.restore();
      G.text(item.name, W / 2, 560, {
        size: 46, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 10
      });
      if (S.prizeT <= 0) {
        G.ui.button({
          x: W / 2 - 190, y: 610, w: 380, h: 96, r: 28, color: C.leaf,
          label: waiting() > 0 ? 'Un altro!' : 'Provalo!', fontSize: 40,
          onTap: function () {
            S.prize = null; S.crate = 0;
            S.mode = waiting() > 0 ? 'apri' : 'gioca';
          }
        });
      }
      return;
    }

    /* One huge target, three identical knocks. No aiming, no order. */
    G.ui.button({
      id: 'crate', x: W / 2 - 230, y: 220, w: 460, h: 400, r: 40, ghost: true,
      onTap: function () {
        S.crate++;
        G.sfx('tap'); G.shake(3);
        G.fx.burst(W / 2, 420, { color: C.sun, count: 10, speed: 240, life: 0.5, shape: 'star' });
        if (S.crate >= 3) openCrate();
      }
    });
    G.text(['Tocca la cassa!', 'Ancora!', 'Ancora una volta!'][Math.min(2, S.crate)],
      W / 2, 640, { size: 38, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 9, weight: 800 });
  }

  /* ------------------------------------------------------------- level 1 */
  /* Grid that resizes itself so every toy you own is always on screen at once:
     never a page, never an arrow, and never a toy that disappears. A crown that
     vanishes behind a chevron is a real loss at three. */
  var GX = 560, GY = 120, GW = 696, GH = 480;
  function fit(n) {
    if (n <= 4) return { cols: 2, rows: 2 };
    if (n <= 6) return { cols: 3, rows: 2 };
    if (n <= 9) return { cols: 3, rows: 3 };
    if (n <= 12) return { cols: 4, rows: 3 };
    return { cols: 4, rows: 4 };
  }

  function drawSmall(c) {
    var own = ownedList();
    var dx = 300, dy = 650, ds = 280;

    A.dino(c, dx, dy, ds, { gear: look, color: dinoColor(), pose: pose(), t: G.t, facing: 1 });
    G.ui.button({
      id: 'poke', x: dx - 150, y: dy - 300, w: 300, h: 300, r: 40, ghost: true,
      onTap: function () { if (S.last) react(S.last); else { G.sfx('tap'); G.say('Ciao!'); } }
    });

    var f = fit(own.length), i;
    var cw = (GW - (f.cols - 1) * 20) / f.cols;
    var ch = (GH - (f.rows - 1) * 18) / f.rows;
    for (i = 0; i < own.length && i < f.cols * f.rows; i++) {
      (function (g, idx) {
        var bx = GX + (idx % f.cols) * (cw + 20);
        var by = GY + Math.floor(idx / f.cols) * (ch + 18);
        var on = wornIn(g.slot) === g.id;
        G.ui.button({
          id: 'toy' + g.id, x: bx, y: by, w: cw, h: ch, r: 24,
          color: on ? C.leafLight : C.cream,
          icon: function (cc, ccx, ccy) {
            preview(cc, g, ccx, ccy, Math.min(cw, ch) * 0.66);
            if (on) {
              cc.save(); cc.strokeStyle = C.leafDark; cc.lineWidth = 7; cc.lineCap = 'round';
              cc.beginPath();
              cc.moveTo(bx + cw - 46, by + 26); cc.lineTo(bx + cw - 32, by + 40);
              cc.lineTo(bx + cw - 12, by + 16); cc.stroke(); cc.restore();
            }
          },
          onTap: function () { toggle(g.id, bx + cw / 2, by + ch / 2, dx, dy - ds * 0.72); }
        });
      })(own[i], i);
    }

    if (!own.length) {
      G.text('Gioca e arriveranno i regali!', GX + GW / 2, GY + GH / 2, {
        size: 36, color: C.cream, weight: 800, maxWidth: GW - 40,
        stroke: 'rgba(12,40,25,.7)', strokeWidth: 9
      });
    }

    G.ui.button({
      x: GX, y: 616, w: 336, h: 96, r: 28, color: C.bark, label: 'Tutto via!', fontSize: 40,
      onTap: stripAll
    });
    G.ui.button({
      x: GX + 360, y: 616, w: 336, h: 96, r: 28, color: C.plum, label: 'Sorpresa!', fontSize: 40,
      icon: function (cc, ccx, ccy) { dice(cc, ccx - 108, ccy, 30); },
      onTap: roll
    });

    drawFly(c);
    drawProgress(c, 300, 128);
  }

  /* ------------------------------------------------------------- level 2 */
  var SLOT_NAME = { testa: 'Testa', occhi: 'Occhi', collo: 'Collo', coda: 'Coda' };

  function drawBig(c) {
    var g = br(), i;
    var dx = 330, dy = 560, ds = 225;

    mirror(c, dx, 400, 200, 260);
    A.dino(c, dx, dy, ds, { gear: look, color: dinoColor(), pose: pose(), t: G.t, facing: 1 });
    G.ui.button({
      id: 'poke', x: dx - 120, y: dy - 250, w: 240, h: 250, r: 36, ghost: true,
      onTap: function () { if (S.last) react(S.last); else { G.sfx('tap'); G.say('Ciao!'); } }
    });

    // slot bar + dice
    for (i = 0; i < A.SLOTS.length; i++) {
      (function (slot, idx) {
        var cx = 640 + idx * 122;
        var on = g.slot === slot;
        G.ui.round({
          id: 'slot' + slot, x: cx, y: 160, r: 54,
          color: on ? C.leafLight : C.cream,
          icon: function (cc, ccx, ccy, r) {
            var id = wornIn(slot), it = id && A.gearOf(id);
            if (it) preview(cc, it, ccx, ccy, r * 1.15);
            else cross(cc, ccx, ccy, r * 0.72);
          },
          onTap: function () { g.slot = slot; G.sfx('pop'); G.saveNow(); }
        });
        G.text(SLOT_NAME[slot], cx, 232, {
          size: 20, color: C.cream, weight: 800, stroke: 'rgba(12,40,25,.7)', strokeWidth: 6
        });
      })(A.SLOTS[i], i);
    }
    G.ui.round({
      id: 'dice', x: 1128, y: 160, r: 54, color: C.plum,
      icon: function (cc, ccx, ccy, r) { dice(cc, ccx, ccy, r * 0.9); },
      onTap: roll
    });
    // The dice needs its caption on the same line as the four slots, or the
    // next thing printed there gets read as its name.
    G.text('Sorpresa', 1128, 232, {
      size: 20, color: C.cream, weight: 800, stroke: 'rgba(12,40,25,.7)', strokeWidth: 6
    });

    // shelf of the active slot: nine cells, "Niente" always first
    var pool = ownedList().filter(function (it) { return it.slot === g.slot; });
    var cells = [null].concat(pool.map(function (it) { return it.id; })).slice(0, 9);
    for (i = 0; i < cells.length; i++) {
      (function (id, idx) {
        var bx = 600 + (idx % 3) * 208, by = 252 + Math.floor(idx / 3) * 138;
        var on = wornIn(g.slot) === id;
        G.ui.button({
          id: 'cell' + g.slot + idx, x: bx, y: by, w: 190, h: 130, r: 22,
          color: on ? C.leafLight : C.cream,
          icon: function (cc, ccx, ccy) {
            if (!id) { cross(cc, ccx, ccy, 40); return; }
            preview(cc, A.gearOf(id), ccx, ccy, 78);
          },
          onTap: function () {
            if (!id) {
              wear(g.slot, null); G.sfx('pop');
              S.react = 0; S.last = null;
              return;
            }
            toggle(id, bx + 95, by + 65, dx, dy - ds * 0.72);
          }
        });
      })(cells[i], i);
    }

    drawShots(c, g, dx, dy, ds);
    drawMate(c);
    drawFly(c);
    /* Bottom right, in the strip the shorter shelf frees up. It used to sit at
       (330, 690), straight on top of the second portrait, and the counter used
       to sit under the dice — where it read as the name of the dice. */
    drawProgress(c, 1214, 686);
    var have = ownedList().length, tot = CRATE_ORDER.length;
    G.text(have + ' di ' + tot, 1176, 692, {
      size: 24, color: C.cream, weight: 800, align: 'right',

/* Dino Giungla — "La Casetta".

   The fifth place, and the first one in the whole game where fruit buys
   something that does not produce more fruit. Until now fruit bought producers
   that made more fruit: a closed circle, with no reason to HAVE fruit other than
   having more of it.

   TWO ROOMS — Salotto and Nanna — because one room could not hold the furniture.
   Measured: the twelve floor pieces are 2226px wide against 1100px of floor
   band, so with everything bought the overlap was arithmetic, not bad luck.
   The catalogue is SPLIT, never duplicated: same fourteen pieces over 2200px,
   which is the whole fix and costs no new art. Each room also has two LANES —
   back and front — because nine of the twelve pieces are taller than the band is
   deep, so a single row can only ever be a single row.

   AND THE HOUSE DOES NOT END. Buying everything used to be the finish line,
   reached in fifteen minutes. Now it is the STARTING line: a full house means
   more pieces that can be asked for, more seats, more guests, more moments. The
   content is not material, so the Nido's exponential fruit faucet cannot consume
   it — three nested cycles, all driven by the child's taps:
     1. a REQUEST: somebody wants to be taken to a piece you already own.
        Not a NEED — a need decays, and a need that gets worse while you are away
        is a failure state with a clock in it, and both are banned here. Toca
        Kitchen does not work on need either: you offer an onion and it sneezes.
        Offer-and-react, never lack-and-repair.
     2. a MOMENT of the day, every few requests: the light changes, and the same
        fourteen pieces mean five different things.
     3. the CAST: named guests come and go, one per party.

   THE LINE AGAINST THE NIDO, the real design risk since both are "buy things and
   put them in your space":
     - The catalogue is NOT a ladder. Nothing has a yield, nothing seats more than
       one, and `seats` is not correlated with price: the 25-fruit pouf and the
       300-fruit hammock do the same thing. No dominant strategy, no way to be
       wrong.
     - No clock: nothing here reads Date.now, and nothing changes while the scene
       is not running. The Nido makes VALUE while you are away; the Casetta makes
       BEHAVIOUR while you watch.
     - No faucet: not one G.addFruits. The first negative-sum place in the game.
     - No ghost outlines of what you do not own. That moment belongs to the Nido.

   Owns G.save.casetta. Reads G.save.nido.items[*].chicks READ-ONLY. */
(function () {
  'use strict';

     seats more guests there is a right order to buy in, which is the one thing
     this room promised not to have.

     than 140px — the previous layout had ten such pairs. */
  var CAT = [
    // ---- Salotto

    { id: 'finestra', name: 'Finestra', cost: 60, seats: 0, on: 'wall', r: 0, w: 210, home: [1000, 386], pose: 'think', say: 'Guarda la giungla!', l1: true },
    { id: 'tavolino', name: 'Tavolino', cost: 140, seats: 1, on: 'floor', r: 0, w: 190, home: [620, 672], pose: 'happy', say: 'Facciamo festa!', l1: true },
    { id: 'casetta', name: 'Casetta', cost: 300, seats: 0, on: 'floor', r: 0, w: 170, home: [700, 524], pose: 'happy', say: 'Casa dolce casa!', l1: true },
    { id: 'amaca', name: 'Amaca', cost: 300, seats: 1, on: 'floor', r: 0, w: 280, home: [230, 668], pose: 'sleep', say: 'Dondolooo...', l1: false },
    { id: 'acquario', name: 'Acquario', cost: 600, seats: 0, on: 'floor', r: 0, w: 210, home: [400, 528], pose: 'think', say: 'Ciao pesciolini!', l1: false },
    // ---- Nanna

    { id: 'libreria', name: 'Libreria', cost: 300, seats: 0, on: 'floor', r: 1, w: 180, home: [360, 516], pose: 'think', say: 'Che bel libro!', l1: false },
    { id: 'albero', name: 'Albero', cost: 600, seats: 0, on: 'floor', r: 1, w: 200, home: [1080, 524], pose: 'happy', say: 'Un albero in casa!', l1: false }
  ];
  var BY_ID = {};
  CAT.forEach(function (d) { BY_ID[d.id] = d; });

  var SURF = [
    { id: 'w1', kind: 'wall', v: 1, cost: 140, name: 'Parete' },
    { id: 'w2', kind: 'wall', v: 2, cost: 140, name: 'Parete' },
    { id: 'w3', kind: 'wall', v: 3, cost: 140, name: 'Parete' },
    { id: 'f1', kind: 'floor', v: 1, cost: 140, name: 'Pavimento' },
    { id: 'f2', kind: 'floor', v: 2, cost: 140, name: 'Pavimento' },
    { id: 'f3', kind: 'floor', v: 3, cost: 140, name: 'Pavimento' }
  ];

     coming back after weeks, and it is the thing this game had none of. Each one

     living here — which is the reason to throw the twentieth party. */
  var CAST = [
    { id: 'pippi', name: 'Pippi', color: '#ff6fae', wants: 'ciotola' },
    { id: 'bubu', name: 'Bubu', color: '#4d80e4', wants: 'tappeto' },
    { id: 'momo', name: 'Momo', color: '#ffd75e', wants: 'tavolino' },
    { id: 'nina', name: 'Nina', color: '#38d9a9', wants: 'pianta' },
    { id: 'rufo', name: 'Rufo', color: '#ff9f43', wants: 'casetta' },
    { id: 'lulu', name: 'Lulu', color: '#8f5bd6', wants: 'lettino' }
  ];
  var CAST_BY = {};
  CAST.forEach(function (q) { CAST_BY[q.id] = q; });

  /* The five moments. Not persisted on purpose: a child coming back at nine in
     the morning to a midnight-blue house looks like a bug to a parent. */
  var MOMENTS = [
    { name: 'Mattina', say: 'Buongiorno!', tint: 'rgba(255,215,94,.10)', wants: ['lettino', 'tappeto', 'finestra'] },
    { name: 'Gioco', say: 'Si gioca!', tint: null, wants: ['casetta', 'albero', 'acquario', 'pouf'] },
    { name: 'Merenda', say: 'E ora della merenda!', tint: 'rgba(255,159,67,.10)', wants: ['ciotola', 'tavolino'] },
    { name: 'Sera', say: 'Si fa sera...', tint: 'rgba(143,91,214,.14)', wants: ['lampada', 'libreria', 'quadro'] },
    { name: 'Nanna', say: 'Tutti a nanna!', tint: 'rgba(77,128,228,.20)', wants: ['lettino', 'tappeto', 'amaca'] }
  ];

  function big() { return G.level === 2; }
  function price(cost) { return big() ? cost : Math.max(1, Math.round(cost / 2)); }
  function inCatalog(d) { return big() || d.l1; }
  function fruitsOwned() {
    var v = Number(G.save.fruits);
    return isFinite(v) ? Math.max(0, Math.floor(v)) : 0;
  }

  /* ------------------------------------------------------------ save branch */
  function br() {
    var g = G.save.casetta;
    if (!g || typeof g !== 'object' || Array.isArray(g)) g = G.save.casetta = {};
    if (!Array.isArray(g.items)) g.items = [];
    g.items = g.items.filter(function (it) {
      return it && typeof it === 'object' && BY_ID[it.id];
    });
    g.items.forEach(function (it) {
      var d = BY_ID[it.id];
      it.c = Math.max(0, Math.min(3, Math.round(Number(it.c)) || 0));
      it.r = d.r;                              // the room is the catalogue's call
      it.x = clampX(Number(it.x), d);
      it.y = clampY(Number(it.y), d);
    });
    trimRooms(g);
    if (!Array.isArray(g.surf)) g.surf = [];
    g.surf = g.surf.filter(function (s) { return typeof s === 'string'; });
    g.wall = pair(g.wall, (A.WALL_N || 4) - 1);
    g.floor = pair(g.floor, (A.FLOOR_N || 4) - 1);
    if (!Array.isArray(g.cast)) g.cast = ['pippi', 'bubu', 'momo'];
    g.cast = g.cast.filter(function (id) { return CAST_BY[id]; });
    if (!g.cast.length) g.cast = ['pippi'];
    g.room = (g.room === 1) ? 1 : 0;
    if (typeof g.gift !== 'boolean') g.gift = false;
    if (typeof g.parties !== 'number' || !isFinite(g.parties) || g.parties < 0) g.parties = 0;
    return g;
  }
  function pair(v, max) {
    var a = Array.isArray(v) ? v : [v, v];
    return [clampInt(a[0], 0, max), clampInt(a[1], 0, max)];
  }
  function trimRooms(g) {
    var n = [0, 0], out = [];
    g.items.forEach(function (it) {
      if (n[it.r] >= MAX_PER_ROOM) return;
      n[it.r]++; out.push(it);
    });
    g.items = out;
  }
  function clampInt(v, a, b) {
    v = Math.round(Number(v));
    return isFinite(v) ? Math.max(a, Math.min(b, v)) : a;
  }
  function clampX(v, d) {
    if (!isFinite(v)) v = d.home[0];
    return Math.max(X_MIN + d.w * 0.2, Math.min(X_MAX - d.w * 0.2, v));
  }
  function clampY(v, d) {
    if (!isFinite(v)) v = d.home[1];
    return d.on === 'wall'
      ? Math.max(WALL_TOP, Math.min(WALL_BOT, v))
      : Math.max(FLOOR_TOP, Math.min(FLOOR_BOT, v));
  }

  function room() { return br().room; }
  function here(it) { return it.r === room(); }
  function items() { return br().items.filter(here); }
  function countOf(id) {
    return br().items.reduce(function (n, it) { return n + (it.id === id ? 1 : 0); }, 0);
  }
  function ownsId(id) { return countOf(id) > 0; }
  function hasSurf(id) { return br().surf.indexOf(id) >= 0; }
  function roomFull() { return items().length >= MAX_PER_ROOM; }

  /* Find a gap on a lane wide enough for a new piece, instead of dropping the
     second copy at home + [74, 14], which used to overlap by up to three
     quarters. Also what makes "A posto!" actually tidy. */
  function packLane(r, laneY, w, skip) {
    var used = br().items.filter(function (it) {
      return it !== skip && it.r === r && BY_ID[it.id].on === 'floor' &&
        Math.abs(it.y - laneY) < 60;
    }).map(function (it) {
      return [it.x - BY_ID[it.id].w / 2, it.x + BY_ID[it.id].w / 2];
    }).sort(function (a, b) { return a[0] - b[0]; });

    var cur = X_MIN, i;
    for (i = 0; i < used.length; i++) {
      if (used[i][0] - cur >= w + 20) return cur + w / 2 + 10;
      cur = Math.max(cur, used[i][1] + 20);
    }
    if (X_MAX - cur >= w) return cur + w / 2;
    return null;                                  // this lane is genuinely full
  }

  function placeNew(d) {
    var lane = d.home[1] < 600 ? LANE_BACK : LANE_FRONT;
    var x = packLane(d.r, lane, d.w, null);
    if (x === null) {
      lane = lane === LANE_BACK ? LANE_FRONT : LANE_BACK;
      x = packLane(d.r, lane, d.w, null);
    }
    if (x === null) { x = d.home[0]; lane = d.home[1]; }
    return { x: x, y: lane };
  }

  /* Guests: chicks hatched at the Nido come to live here once there is somewhere
     to sit. READ-ONLY on another scene's branch, and never a write. */
  function chicksBorn() {
    var nido = G.save.nido, k, it, n = 0;
    if (!nido || typeof nido !== 'object') return 0;
    var list = nido.items;
    if (!list || typeof list !== 'object') return 0;
    for (k in list) {

    D.facing = D.tx >= D.x ? 1 : -1;
    D.state = 'walk'; D.use = it; D.spont = !!spontaneous;
  }
  function chooseSomething() {
    var pool = items();
    if (!pool.length) { D.state = 'idle'; D.t = 2 + Math.random() * 2; D.use = null; return; }
    sendTo(pool[G.rndi(0, pool.length - 1)], true);
  }
  function say(msg, delay) { S.sayMsg = msg; S.sayT = delay === undefined ? 0.1 : delay; }

  /* ------------------------------------------------------- the request cycle */
  /* HARD RULE: a request only ever names something you ALREADY OWN. Naming
     something from the shop would turn it into a shopping list, which this file
     forbids. Ignoring a request does nothing at all: no counter, no reward, no
     sad face — it just changes on its own after a while. */
  function newAsk() {
    var g = br(), pool = items().filter(function (it) { return BY_ID[it.id].on === 'floor'; });

    var liked = pool.filter(function (it) { return wanted.indexOf(it.id) >= 0; });
    var pick = (liked.length ? liked : pool)[G.rndi(0, (liked.length ? liked : pool).length - 1)];
    var who = null;

      who = CAST_BY[g.cast[G.rndi(0, g.cast.length - 1)]] || null;

    return (id === 'amaca' || id === 'casetta' || id === 'ciotola' ||
      id === 'lampada' || id === 'pianta' || id === 'libreria' || id === 'finestra') ? 'la ' : 'il ';
