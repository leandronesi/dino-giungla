    }
    if (fruitsOwned() < cost || !G.spend(cost)) { softNo(cx, cy); return; }
    var spot = d.on === 'wall' ? { x: d.home[0], y: d.home[1] } : placeNew(d);
    var it = { id: d.id, c: countOf(d.id) % 4, r: d.r, x: clampX(spot.x, d), y: clampY(spot.y, d) };
    g.items.push(it);
    G.saveNow();
    S.fly = { id: d.id, c: it.c, x: cx, y: cy, tx: it.x, ty: it.y, k: 0 };
    G.sfx('chime'); G.fx.ring(cx, cy, C.sun); G.fx.confetti();
    say(d.say, 0.5);
    if (!S.ask) newAsk();
  }

  function buySurface(s, cx, cy) {
    var g = br(), cost = price(s.cost);
    if (hasSurf(s.id)) { applySurface(s); return; }
    if (fruitsOwned() < cost || !G.spend(cost)) { softNo(cx, cy); return; }
    g.surf.push(s.id);
    applySurface(s);
    G.sfx('chime'); G.fx.confetti();
  }
  function applySurface(s) {
    var g = br();
    if (s.kind === 'wall') g.wall[room()] = s.v; else g.floor[room()] = s.v;
    G.saveNow(); G.sfx('whoosh');
  }

  /* At level 2 the dice no longer repaints hand-painted furniture: the brush and
     the dice were undoing each other, and there is no undo. It rolls the walls
     and floors of BOTH rooms, which is already a double surprise. */
  function roll() {
    var g = br(), i;
    for (i = 0; i < 2; i++) {
      g.wall[i] = ownedSurfV('wall');
      g.floor[i] = ownedSurfV('floor');
    }
    if (!big()) g.items.forEach(function (it) { it.c = G.rndi(0, 3); });
    G.saveNow();
    G.sfx('chime'); G.fx.confetti();
    G.say('Sorpresa!');
  }
  function ownedSurfV(kind) {
    var ok = [0], i, s;
    for (i = 0; i < SURF.length; i++) {
      s = SURF[i];
      if (s.kind === kind && hasSurf(s.id)) ok.push(s.v);
    }
    return ok[G.rndi(0, ok.length - 1)];
  }

  function tidy() {
    var g = br(), r, lane, x;
    [0, 1].forEach(function (rr) {
      [LANE_BACK, LANE_FRONT].forEach(function (ly) {
        var cur = X_MIN + 20;
        g.items.filter(function (it) {
          return it.r === rr && BY_ID[it.id].on === 'floor' &&
            Math.abs(BY_ID[it.id].home[1] - ly) < 80;
        }).forEach(function (it) {
          var d = BY_ID[it.id];
          it.x = clampX(cur + d.w / 2, d); it.y = ly;
          cur += d.w + 24;
        });
      });
    });
    void r; void lane; void x;
    G.saveNow(); G.sfx('pop'); G.say('A posto!');
  }

  function partyCost() {
    return price(Math.min(240, PARTY_COST + 20 * Math.max(0, br().parties - 2)));
  }
  function party(cx, cy) {
    if (S.party > 0) return;
    var g = br(), cost = partyCost();
    if (fruitsOwned() < cost || !G.spend(cost)) { softNo(cx, cy); return; }
    g.parties++;
    rotateCast(g);
    G.saveNow();
    S.party = 4.5;
    G.sfx('win'); G.fx.confetti();
    G.say(G.pick(['Che festa!', 'Evviva la festa!', 'Tutti a tavola!']));
  }
  /* One guest leaves and another arrives at every party: the reason to throw the
     twentieth one. */
  function rotateCast(g) {
    var away = CAST.filter(function (q) { return g.cast.indexOf(q.id) < 0; });
    if (!away.length) return;
    g.cast.shift();
    g.cast.push(away[G.rndi(0, away.length - 1)].id);
  }

  /* ---------------------------------------------------------- the door */
  function goRoom(to) {
    if (S.fade > 0 || to === room()) return;
    S.fadeTo = to;
    S.fade = 1;
    G.sfx('whoosh');
  }

  /* ================================================================ SCENE */
  G.scene('casetta', {
    enter: function () {
      var g = br();
      S.shop = false; S.brush = false; S.fly = null; S.drag = null;
      S.party = 0; S.idle = 0; S.nudges = 0; S.softT = 0;
      S.sayMsg = null; S.sayT = 0;
      S.moment = 0; S.beat = 0; S.tintK = 1; S.tintFrom = 0;
      S.ask = null; S.askT = 0; S.fade = 0; S.fadeTo = -1;
      g.room = 0;

      /* Two presents, one per room, so neither is ever empty on the first visit:
         a room with nothing in it is the only moment the house can look broken. */
      if (!g.gift) {
        g.gift = true;
        [BY_ID.tappeto, BY_ID.ciotola].forEach(function (d) {
          g.items.push({ id: d.id, c: 0, r: d.r, x: d.home[0], y: d.home[1] });
        });
        G.saveNow();
      }
      D.x = 640; D.y = 620; D.tx = 640; D.ty = 620;
      D.state = 'idle'; D.t = 1.4; D.use = null; D.facing = 1;
      newAsk();

      if (!G.save.seen) G.save.seen = {};
      var first = !G.save.seen.casetta;
      G.save.seen.casetta = true;
      G.saveNow();
      setTimeout(function () {
        if (G.current !== 'casetta') return;
        G.say(first
          ? 'Questa e la tua casetta! Guarda cosa vuole il dino.'
          : G.pick(['Bentornato a casa!', 'Cosa facciamo oggi?', 'Guarda chi c e!']));
      }, 420);
    },

    exit: function () { S.fly = null; S.drag = null; S.shop = false; },

    update: function (dt) {
      if (S.softT > 0) S.softT = Math.max(0, S.softT - dt);
      if (S.party > 0) S.party = Math.max(0, S.party - dt);
      if (S.tintK < 1) S.tintK = Math.min(1, S.tintK + dt / 1.2);
      if (S.sayT > 0) {
        S.sayT -= dt;
        if (S.sayT <= 0 && S.sayMsg) { G.say(S.sayMsg); S.sayMsg = null; }
      }
      if (S.fly) { S.fly.k += dt / 0.4; if (S.fly.k >= 1) S.fly = null; }

      if (S.fade > 0) {                       // crossing the door
        S.fade -= dt / 0.30;
        if (S.fade <= 0.5 && S.fadeTo >= 0) {
          var g = br();
          g.room = S.fadeTo; S.fadeTo = -1;
          G.saveNow();
          D.x = room() === 0 ? 200 : 1080; D.y = LANE_FRONT;
          D.tx = D.x; D.ty = D.y; D.state = 'idle'; D.t = 1.2; D.use = null;
          S.shop = false;
          newAsk();
        }
        if (S.fade < 0) S.fade = 0;
      }

      if (S.ask) { S.askT -= dt; if (S.askT <= 0) newAsk(); }

      if (S.party > 0) {
        var tav = items().filter(function (i) { return i.id === 'tavolino'; })[0];
        if (tav) { D.tx = tav.x - 90; D.ty = tav.y; }
        D.state = Math.abs(D.tx - D.x) > 8 ? 'walk' : 'use';
      } else if (D.state === 'walk') {
        var dx = D.tx - D.x, dy = D.ty - D.y, dist = Math.hypot(dx, dy);
        var step = (big() ? 270 : 305) * dt;
        if (dist <= step) {
          D.x = D.tx; D.y = D.ty; D.state = 'use';
          D.t = D.spont ? 3 + Math.random() * 2 : 3.4;
          if (D.use && !D.spont) {
            say(BY_ID[D.use.id].say, 0);
            satisfyAsk(D.use);
          }
        } else {
          D.x += dx / dist * step; D.y += dy / dist * step;
          D.facing = dx >= 0 ? 1 : -1;
        }
      } else {
        D.t -= dt;
        if (D.t <= 0) {
          if (D.state === 'use') { D.state = 'idle'; D.t = 4 + Math.random() * 3; D.use = null; }
          else chooseSomething();
        }
      }

      /* A nudge that DEMONSTRATES instead of explaining, and at level 1 the
         'Nanna' moment walks him through the door on his own — otherwise a
         three-year-old may never discover the second room exists. */
      S.idle += dt;
      if (!big() && S.idle > 8 && S.nudges < 2 && items().length) {
        S.idle = 0; S.nudges++;
        if (moment().name === 'Nanna' && room() === 0) goRoom(1);
        else chooseSomething();
      }
    },

    onDown: function (p) {
      S.idle = 0;
      if (S.fade > 0) return;
      if (S.shop) { S.shop = false; return; }

      var dr = ROOMS[room()].door;              // the door: walk through it
      var doorX = dr === 1 ? 1204 : 76;
      if (Math.abs(p.x - doorX) < 90 && p.y > 210 && p.y < 480) {
        goRoom(1 - room());
        return;
      }

      var list = items(), i, it, d, hit = -1, best = 1e9, dd;
      for (i = list.length - 1; i >= 0; i--) {
        it = list[i]; d = BY_ID[it.id];
        dd = Math.hypot(p.x - it.x, p.y - (d.on === 'wall' ? it.y - d.w * 0.3 : it.y - d.w * 0.25));
        if (dd < Math.max(58, d.w * 0.55) * (big() ? 1.06 : 1.30) && dd < best) { best = dd; hit = i; }
      }
      if (hit < 0) return;
      it = list[hit]; d = BY_ID[it.id];

      if (big() && S.brush) { it.c = (it.c + 1) % 4; G.saveNow(); G.sfx('pop'); return; }
      if (big()) {
        S.drag = { i: br().items.indexOf(it), dx: p.x - it.x, dy: p.y - it.y, moved: false, t: 0 };
      }
      sendTo(it, false);
      G.sfx('tap');
    },

    onMove: function (p) {
      if (!big() || !S.drag) return;
      var g = br(), it = g.items[S.drag.i];
      if (!it) { S.drag = null; return; }
      var d = BY_ID[it.id];
      if (!S.drag.moved) {
        if (Math.hypot(p.x - S.drag.dx - it.x, p.y - S.drag.dy - it.y) < 12) return;
        S.drag.moved = true;
      }
      it.x = clampX(p.x - S.drag.dx, d);
      it.y = clampY(Math.round((p.y - S.drag.dy) / 10) * 10, d);
    },

    onUp: function () {
      if (S.drag && S.drag.moved) { G.saveNow(); G.sfx('pop'); }
      S.drag = null;
    },

    draw: function (c) { drawRoom(c); }
  });

  /* ---------------------------------------------------------------- draw */
  function drawRoom(c) {
    var g = br(), r = room(), i;
    A.room(c, { wall: g.wall[r], floor: g.floor[r] });
    drawMomentTint(c);
    drawDoor(c);

    var list = [];
    g.items.filter(here).forEach(function (it, idx) {
      var d = BY_ID[it.id];
      list.push({ y: d.on === 'wall' ? -1000 + idx : it.y, it: it, d: d });
    });
    list.push({ y: D.y, dino: true });
    guestList().forEach(function (q) { list.push({ y: q.y, guest: q }); });
    list.sort(function (a, b) { return a.y - b.y; });

    list.forEach(function (e) {
      if (e.dino) { drawDino(c); return; }
      if (e.guest) { drawGuest(c, e.guest); return; }
      var k = A.roomDepth(e.y);
      A.roomShadow(c, e.it.x, e.it.y, e.d.w * k * 0.8);
      A.house(c, e.it.id, e.it.x, e.it.y, e.d.w * k, { c: e.it.c });
    });
    g.items.filter(here).forEach(function (it) {
      var d = BY_ID[it.id];
      if (A.HOUSE_FRONT[it.id]) A.houseFront(c, it.id, it.x, it.y, d.w * A.roomDepth(it.y), { c: it.c });
    });

    drawAsk(c);
    drawFly(c);
    drawPartyButton(c);
    if (S.party > 0) drawParty(c);
    if (big()) drawShopL2(c); else drawShopL1(c);
    drawSoftNo(c);
    drawFade(c);
    void i;
  }

  /* One rectangle, cross-faded on frame time. This is what makes fourteen pieces
     of furniture mean five different things. */
  function drawMomentTint(c) {
    var to = MOMENTS[S.moment].tint, from = MOMENTS[S.tintFrom].tint;
    var k = S.tintK;
    c.save();
    if (from && k < 1) { c.globalAlpha = 1 - k; c.fillStyle = from; c.fillRect(0, 96, W, 624); }
    if (to) { c.globalAlpha = k; c.fillStyle = to; c.fillRect(0, 96, W, 624); }
    c.restore();
  }

  function drawDoor(c) {
    var dr = ROOMS[room()].door;
    var x = dr === 1 ? 1204 : 76;
    A.porta(c, x, 470, 190, { side: dr });
    /* A pulsing dot when what is being asked for is in the other room — the
       reason two rooms are a mechanic and not two screens. */
    if (big() && S.ask && BY_ID[S.ask.id].r !== room()) {
      var col = (S.ask.who && S.ask.who.color) || C.sun;
      c.save();
      c.globalAlpha = 0.5 + Math.sin(G.t * 4) * 0.35;
      c.fillStyle = col;
      c.beginPath(); c.arc(x, 300, 22, 0, 7); c.fill();
      c.restore();
    }
  }

  function drawFade(c) {
    if (S.fade <= 0) return;
    c.save();
    c.globalAlpha = 1 - Math.abs(S.fade - 0.5) * 2;
    c.fillStyle = '#1c1208';
    c.fillRect(0, 0, W, H);
    c.restore();
  }

  /* The bubble: who wants what, drawn as the piece itself. Never blocks a tap,
     never counts, and expires on its own. */
  function drawAsk(c) {
    if (!S.ask) return;
    var d = BY_ID[S.ask.id];
    if (d.r !== room()) return;
    var r = big() ? 54 : 62;
    var bx = D.x, by = D.y - dinoSize() * 1.08 - r * 0.4;
    if (S.ask.who) {
      var q = guestList().filter(function (g2) { return g2.id === S.ask.who.id; })[0];
      if (q) { bx = q.x; by = q.y - 96; }
    }
    var pulse = 1 + Math.sin(G.t * 3) * 0.05;
    c.save();
    c.translate(bx, by); c.scale(pulse, pulse); c.translate(-bx, -by);
    c.fillStyle = 'rgba(255,246,224,.95)';
    c.beginPath(); c.arc(bx, by, r, 0, 7); c.fill();
    c.strokeStyle = (S.ask.who && S.ask.who.color) || C.bark;
    c.lineWidth = 6;
    c.beginPath(); c.arc(bx, by, r, 0, 7); c.stroke();
    c.beginPath();                               // the little tail
    c.moveTo(bx - 12, by + r * 0.86);
    c.lineTo(bx + 4, by + r * 1.34);
    c.lineTo(bx + 14, by + r * 0.80);
    c.closePath();
    c.fillStyle = 'rgba(255,246,224,.95)'; c.fill();
    c.restore();
    c.save();                                    // the piece, drawn small
    var k = Math.min(1, (r * 1.3) / Math.max(40, d.w * 0.7));
    A.house(c, d.id, bx, by + r * 0.42, d.w * k * 0.66, { c: 0 });
    c.restore();
  }

  function drawDino(c) {
    var s = dinoSize(), pose = 'idle';
    if (D.state === 'walk') pose = 'walk';
    else if (D.state === 'use' && D.use) pose = BY_ID[D.use.id].pose;
    if (S.party > 0 && D.state === 'use') pose = 'happy';
    var col = (G.account && G.account.color) || C.dino;
    A.dino(c, D.x, D.y, s, { facing: D.facing, pose: pose, t: G.t, color: col });
    if (D.spont && D.state === 'use') {
      G.text('!', D.x + D.facing * s * 0.34, D.y - s * 1.06, {
        ctx: c, size: 34, color: C.sun, stroke: 'rgba(43,29,18,.7)', strokeWidth: 7
      });
    }
  }

  var guestBuf = [];
  function guestList() {
    var n = guests(), g = br(), out = guestBuf, i;
    out.length = 0;
    var seats = g.items.filter(function (it) { return here(it) && BY_ID[it.id].seats > 0; });
    for (i = 0; i < n && i < seats.length; i++) {
      var who = CAST_BY[g.cast[i % g.cast.length]] || CAST[0];
      out.push({ x: seats[i].x + 44, y: seats[i].y - 4, i: i, id: who.id, name: who.name, color: who.color });
    }
    return out;
  }
  function drawGuest(c, q) {
    var k = A.roomDepth(q.y);
    var hop = S.party > 0 ? Math.abs(Math.sin(G.t * 6 + q.i)) * 18 : 0;
    var sleepy = moment().name === 'Nanna';
    if (A.chick) A.chick(c, q.x, q.y - 26 * k - hop, 62 * k, { t: G.t + q.i * 1.7, color: q.color });
    if (sleepy) {
      c.save();
      c.globalAlpha = 0.5 + Math.sin(G.t * 1.6 + q.i) * 0.3;
      G.text('z', q.x + 26 * k, q.y - 72 * k, { ctx: c, size: 22 * k, color: C.cream, stroke: 'rgba(43,29,18,.5)' });
      c.restore();
    }
  }

  function drawFly(c) {
    if (!S.fly) return;
    var k = G.ease(G.clamp(S.fly.k, 0, 1)), d = BY_ID[S.fly.id];
    var x = G.lerp(S.fly.x, S.fly.tx, k);
    var y = G.lerp(S.fly.y, S.fly.ty, k) - Math.sin(k * Math.PI) * 110;
    c.save(); c.globalAlpha = 1 - k * 0.15;
    A.house(c, S.fly.id, x, y, d.w * (0.7 + k * 0.3), { c: S.fly.c });
    c.restore();
  }

  function drawPartyButton(c) {
    var tav = items().filter(function (it) { return it.id === 'tavolino'; })[0];
    if (!tav) return;
    var cost = partyCost(), can = fruitsOwned() >= cost;
    var by = tav.y - 156 + Math.sin(G.t * 2) * 5, bx = tav.x;
    G.ui.round({
      id: 'festa', x: bx, y: by, r: 54,
      color: S.party > 0 ? C.sun : (can ? C.pinkPop : '#a49889'),
      icon: function (cc, x, y, r) { partyGlyph(cc, x, y, r * 0.82, S.party > 0); },
      onTap: function () { party(bx, by - 40); }
    });
    if (!can && S.party <= 0) {
      ring(c, bx + 62, by + 26, 22, G.clamp(fruitsOwned() / Math.max(1, cost), 0, 1));
    }
    if (big()) {
      G.text(String(cost), bx, by + 78, {
        ctx: c, size: 26, color: C.cream, weight: 800,
        stroke: 'rgba(12,40,25,.75)', strokeWidth: 7
      });
    }
  }
  function partyGlyph(c, cx, cy, r, going) {
    c.save();
    c.fillStyle = going ? C.berry : C.cream;
    c.beginPath();
    c.moveTo(cx, cy - r * 0.86); c.lineTo(cx + r * 0.52, cy + r * 0.30);
    c.lineTo(cx - r * 0.52, cy + r * 0.30); c.closePath(); c.fill();
    c.strokeStyle = C.ink; c.lineWidth = Math.max(3, r * 0.11); c.stroke();
    c.fillStyle = going ? C.cream : C.berry;
    c.beginPath(); c.arc(cx, cy - r * 0.86, r * 0.15, 0, 7); c.fill();
    [[-0.78, 0.62, C.sun], [0.80, 0.50, C.mint], [0.10, 0.78, C.blueberry]].forEach(function (p, i) {
      c.fillStyle = p[2];
      var d = going ? Math.sin(G.t * 7 + i) * r * 0.12 : 0;
      c.beginPath(); c.arc(cx + p[0] * r, cy + p[1] * r + d, r * 0.13, 0, 7); c.fill();
    });
    c.restore();
  }

  function drawParty(c) {
    var i, a, r;
    c.save();
    c.globalAlpha = G.clamp(S.party / 1.2, 0, 1) * 0.5;
    for (i = 0; i < 9; i++) {
      a = G.t * 1.4 + i * 0.7;
      r = 130 + Math.sin(G.t * 2 + i) * 26;
      c.fillStyle = [C.sun, C.pinkPop, C.mint, C.tangerine][i % 4];
      c.beginPath(); c.arc(640 + Math.cos(a) * r, 300 + Math.sin(a) * r * 0.4, 9, 0, 7); c.fill();
    }
    c.globalAlpha = G.clamp(S.party / 1.5, 0, 1);
    G.text('Festa!', 640, 200, {
      ctx: c, size: 62, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 12
    });
    c.restore();
  }

  function drawSoftNo(c) {
    if (S.softT <= 0) return;
    var k = S.softT / 1.1;
    c.save(); c.globalAlpha = k;
    G.text('Servono piu frutti', S.softX, S.softY - 40 - (1 - k) * 30, {
      ctx: c, size: 30, color: C.cream, weight: 800,
      stroke: 'rgba(12,40,25,.75)', strokeWidth: 8
    });
    c.restore();
  }

  /* ---------------------------------------------------------- shop, level 1 */
  function shopList() {
    var out = [], i, d;
    for (i = 0; i < CAT.length; i++) {
      d = CAT[i];
      if (d.r !== room() || !inCatalog(d) || d.cost === 0) continue;
      if (countOf(d.id) >= 2) continue;
      out.push({ kind: 'item', d: d, cost: price(d.cost) });
    }
    SURF.forEach(function (s) {
      if (!hasSurf(s.id)) out.push({ kind: 'surf', s: s, cost: price(s.cost) });
    });
    out.sort(function (a, b) { return a.cost - b.cost; });
    return out;
  }
  function shopCellsL1() {
    var list = shopList(), its = [], srf = [], i;
    for (i = 0; i < list.length; i++) {
      if (list[i].kind === 'surf') srf.push(list[i]); else its.push(list[i]);
    }
    var out = its.slice(0, 2);
    if (srf.length) out.push(srf[0]);
    while (out.length < 3 && its.length > out.length) out.push(its[out.length]);
    return out;
  }

  /* The shop lives ON THE WALL. It used to be a strip over the floor band, which
     swallowed most of the tap disc of the very furniture it had just sold. */
  function drawShopL1(c) {
    var cells = shopCellsL1(), i, firstDim = -1;
    for (i = 0; i < cells.length; i++) {
      if (fruitsOwned() < cells[i].cost) { firstDim = i; break; }
    }
    for (i = 0; i < cells.length; i++) {
      (function (e, idx) {
        var bx = 44 + idx * 312, can = fruitsOwned() >= e.cost;
        G.ui.button({
          id: 'sl1' + idx, x: bx, y: 104, w: 300, h: 116, r: 26,
          color: can ? C.tangerine : '#a49889',
          icon: function (cc, cx, cy) { cellIcon(cc, e, cx, cy, 74); },
          onTap: function () {
            if (e.kind === 'surf') buySurface(e.s, bx + 150, 170);
            else buy(e.d, bx + 150, 170);
          }
        });

/* Dino Giungla — "La Pista dei Gusci" (scene: kart).

   A race a three-year-old cannot lose, and a six-year-old can actually get good
   at. Owns G.save.kart.

   THREE CONSTRUCTION DECISIONS DO ALL THE WORK. Everything else follows.

   1. A KART IS (s, lat), NEVER (x, y). Position along the track and offset from
      the centre line, and the drawing converts. This deletes free-body physics,
      wall collision, swept tests, tunnelling, per-frame nearest-point search and
      sub-stepping in one go — that is, the entire class of bug that shows up to a
      small child as "my car is stuck", the most agitating outcome there is.
      Driving off the track is not REPRESENTABLE.

   2. NO LINE OF CODE SUBTRACTS SPEED. `spd = Math.max(spd, CRUISE)` after every
      update. No brake, no penalty, no obstacle that slows you, no grass, no
      wall. The puddle SPEEDS YOU UP. A whole category of failure has no way to
      be expressed.

   3. NO CAMERA. The whole oval fits on screen, so all five karts are always
      visible. "I fell behind and can't see anyone" is closed by arithmetic
      instead of by a device — and the device would itself be the diagnosis:
      a zoom that widens, or an arrow that points at the leader, is a sign
      saying YOU ARE LOSING.

   And the corollary that took three tries to see: A VISIBLE HELP THAT ONLY
   SWITCHES ON WHEN YOU ARE BEHIND IS A SIGN THAT SAYS YOU ARE BEHIND. So the
   friends do not slow down for you. Each of them stops to eat blackberries on
   its own offset timer; falling behind only nudges how LONG the stop lasts.

   There is no position, no placing, no finishing order, and no number anywhere
   except the fruit counter in the HUD. "Last" has no representation, so it
   cannot be read. */

  'use strict';

  var C = G.C, W = G.W, H = G.H;

  /* --------------------------------------------------------------- track */

     rather than sampled from a spline. An ellipse was the obvious choice and is
     wrong: its minimum radius of curvature would be b*b/a = 71px against a
     half-width of 72, so the inner edge of the ribbon folds through itself and
     the (s, lat) -> point map stops being injective. The kart would visibly
     travel BACKWARDS while s increases, exactly at the corner the whole no-fail
     promise rests on. A stadium's minimum radius is HB = 175. */
  var CX = 640, CY = 445, HA = 450, HB = 175;
  var LSTR = HA - HB;                   // 275, half the length of one straight
  var ARC = Math.PI * HB;               // 549.78 per semicircle
  var PLEN = 4 * LSTR + 2 * ARC;        // 2199.6
  var HW = 72;                          // half width of the ribbon
  var LAT_MAX = 40;                     // the drivable corridor, well inside HW

  var S1 = 2 * LSTR;                    // end of the top straight
  var S2 = S1 + ARC;                    // end of the right bend
  var S3 = S2 + 2 * LSTR;               // end of the bottom straight

  function wrapS(s) { s %= PLEN; return s < 0 ? s + PLEN : s; }
  /* Signed shortest arc from a to b, in (-PLEN/2, PLEN/2]. */

     `lat` is positive INWARDS, which is what makes the inner line genuinely
     shorter: the parallel curve at distance lat from a curve of curvature k has
     length scaled by (1 - lat*k). */
  var _p = { x: 0, y: 0, dx: 1, dy: 0, nx: 0, ny: 1, k: 0 };
  function at(s) {
    s = wrapS(s);
    var a;
    if (s < S1) {                                   // top straight, going right
      _p.x = CX - LSTR + s; _p.y = CY - HB;
      _p.dx = 1; _p.dy = 0; _p.k = 0;
    } else if (s < S2) {                            // right bend, clockwise
      a = -Math.PI / 2 + (s - S1) / HB;
      _p.x = CX + LSTR + Math.cos(a) * HB;
      _p.y = CY + Math.sin(a) * HB;
      _p.dx = -Math.sin(a); _p.dy = Math.cos(a); _p.k = 1 / HB;
    } else if (s < S3) {                            // bottom straight, going left
      _p.x = CX + LSTR - (s - S2); _p.y = CY + HB;
      _p.dx = -1; _p.dy = 0; _p.k = 0;
    } else {                                        // left bend
      a = Math.PI / 2 + (s - S3) / HB;

      _p.y = CY + Math.sin(a) * HB;

    var kinds = ['fragola', 'banana', 'uva', 'mela', 'melone'];
    for (i = 0; i < 8; i++) {                        // fruit around the lap

        fruit: kinds[i % kinds.length], taken: 0, glow: 0

    for (i = 0; i < 3; i++) {                        // wind leaves

    }

    onMove: function (p) {
      if (!big() || S.downX === null) return;
      /* Relative drag, never absolute: a finger that lands anywhere is not a
         steering command by itself. */
      var dx = p.x - S.downX;
      S.downLat = G.clamp(S.downLat + dx * 0.10, -LAT_MAX, LAT_MAX);
      S.downX = p.x;
      S.steered = Math.min(1, S.steered + Math.abs(dx) / 240);
    },

    onUp: function () { S.gasHeld = false; S.downX = null; },

    draw: function (c) { drawAll(c); }
  });

  S.lapDone = 0;

  /* --------------------------------------------------------------- motion */
  function advance(k, dt) {
    var p = at(k.s);
    /* The exact length of the parallel path at distance lat from a curve of
       curvature k: the inner line is genuinely shorter, and there is no
       coefficient to tune. Off at level 1, where he is never punished for
       being off the racing line. */
    var scale = big() ? G.clamp(1 / (1 - k.lat * p.k), 0.86, 1.16) : 1;
    var ds = k.spd * dt * scale;
    k.s = wrapS(k.s + ds);
    k.dist += ds;
  }

  /* The line the game drives for you: hug the inside through the bends. */
  function autoLine(s) {
    var p = at(s);
    return p.k > 0 ? 22 : 0;
  }

  function take(it, k) {
    var x = px(it.s, it.lat), y = py(it.s, it.lat);
    it.taken = 3.2;
    if (it.kind === 'fruit') {
      bank(big() ? 3 : 2, x, y);
      G.sfx('coin');
      G.fx.burst(x, y, { color: C.sun, count: 8, speed: 180, life: 0.5 });
      if (!big()) S.callLat = null;
    } else if (it.kind === 'wind') {
      k.spd = Math.min(boost() * 1.25, k.spd + 90);
      G.sfx('whoosh');
      G.fx.burst(x, y, { color: C.leafLight, count: 10, speed: 240, life: 0.5 });
    } else if (it.kind === 'pool') {
      k.spd = Math.min(boost() * 1.3, k.spd + 120);
      G.sfx('chime');
      G.fx.ring(x, y, C.water);
    } else if (it.kind === 'hat') {
      S.wearHat = it.hat;
      G.sfx('good');
      G.fx.confetti();
      G.say('Il tuo cappello!');
    }
  }

  function onLap() {
    var mek = me();
    G.sfx('chime');
    bank(big() ? 6 : 4, mek.x || 640, 240);
    if (big()) {
      var g = br();
      /* Never Date.now: below 20fps the core clamps dt to 0.05 and physics and
         wall clock would diverge. And a lap is rejected if the frame rate was
         so poor that a slow tablet would be rewarded. */
      if (S.lapFrames > 0 && S.lapT / S.lapFrames <= 0.022) {
        if (!g.best || S.lapT < g.best) {
          g.best = S.lapT; G.saveNow();
          S.bestShown = 2.4;
          G.fx.text(640, 300, 'Giro record!', C.sun, 46);
        }
      }
    }
    S.lapT = 0; S.lapFrames = 0;
    items.forEach(function (it) { if (it.kind !== 'hat') it.taken = 0; });
  }

  function finish() {
    var g = br();
    g.done++;
    G.saveNow();
    S.phase = 'festa'; S.t = 0;
    G.sfx('win'); G.fx.confetti();
    G.addStars(1, 640, 300);
    G.say(G.pick(['Che bel giro!', 'Bravissimo!', 'Evviva!']));
  }

  /* ----------------------------------------------------------------- draw */
  /* The backdrop is baked once into an offscreen canvas and blitted with a
     single drawImage. Only possible because there is no camera, and it is what
     keeps this scene at about a third of the overworld's raster load. */
  function bake() {
    var cv, c;
    try { cv = document.createElement('canvas'); } catch (e) { return false; }
    cv.width = 1280; cv.height = 720;
    c = cv.getContext('2d');
    if (!c) return false;

    c.fillStyle = '#7fbf5a'; c.fillRect(0, 0, 1280, 720);
    if (A.jungle) { try { A.jungle(c, 0, { dim: 0.25 }); } catch (e) { /* keep the grass */ } }

    ribbon(c, HW + 10, '#5a4326');                 // shoulder
    ribbon(c, HW, '#c8a06a');                      // the track itself
    kerbs(c);
    c.save();                                       // the inner meadow pond
    c.globalAlpha = 0.55; c.fillStyle = C.water;
    c.beginPath(); c.ellipse(CX, 443, 132, 78, 0, 0, 7); c.fill();
    c.restore();
    bg = cv;
    return true;
  }

  function ribbon(c, w, col) {
    var i, s, p, n = 160;
    c.beginPath();
    for (i = 0; i <= n; i++) { s = i / n * PLEN; p = at(s); if (i) c.lineTo(p.x + p.nx * -w, p.y + p.ny * -w); else c.moveTo(p.x + p.nx * -w, p.y + p.ny * -w); }
    for (i = n; i >= 0; i--) { s = i / n * PLEN; p = at(s); c.lineTo(p.x + p.nx * w, p.y + p.ny * w); }
    c.closePath();
    c.fillStyle = col; c.fill();
  }

  function kerbs(c) {
    var i, s, p, k = 44;
    for (i = 0; i < k; i++) {
      s = i / k * PLEN;
      p = at(s);
      c.fillStyle = i % 2 ? '#e8536b' : '#fff6e0';
      [-1, 1].forEach(function (side) {
        c.save();
        c.translate(p.x + p.nx * side * (HW - 5), p.y + p.ny * side * (HW - 5));
        c.rotate(Math.atan2(p.dy, p.dx));
        c.fillRect(-PLEN / k / 2, -6, PLEN / k, 12);
        c.restore();
      });
    }
  }

  function drawAll(c) {
    var i;
    if (!bgOK) { bgOK = true; if (!bake()) bg = null; }
    if (bg) { try { c.drawImage(bg, 0, 0); } catch (e) { bg = null; } }
    if (!bg) { c.fillStyle = '#7fbf5a'; c.fillRect(0, 0, W, H); ribbon(c, HW, '#c8a06a'); }

    drawArch(c);
    for (i = 0; i < items.length; i++) drawItem(c, items[i]);

    /* Depth order: whoever is lower on screen is nearer. */
    var order = karts.slice().sort(function (a, b) { return py(a.s, a.lat) - py(b.s, b.lat); });
    for (i = 0; i < order.length; i++) drawKart(c, order[i]);

    drawPedal(c);
    if (S.phase === 'via') drawLights(c);
    if (S.phase === 'festa') drawFinish(c);
    if (S.bestShown > 0) S.bestShown = Math.max(0, S.bestShown - G.dt);
  }

  /* The lap counter is three big fruits hanging from the start arch. One drops
     each lap, with a chime, and flies away. Cause and effect in one glance —
     no bar, no tally, no text. */
  function drawArch(c) {
    var x = CX - LSTR, y = CY - HB;
    var n = laps(), doneL = Math.min(n, S.lapDone), i;
    c.save();
    c.strokeStyle = C.bark; c.lineWidth = 16; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x - HW - 12, y + 4); c.lineTo(x - HW - 12, y - 92);
    c.moveTo(x + HW + 12, y + 4); c.lineTo(x + HW + 12, y - 92);
    c.stroke();
    c.strokeStyle = C.barkDark; c.lineWidth = 14;
    c.beginPath(); c.moveTo(x - HW - 20, y - 92); c.lineTo(x + HW + 20, y - 92); c.stroke();
    c.restore();
    for (i = 0; i < n; i++) {
      if (i < doneL) continue;
      var fx = x - HW + 18 + i * ((HW * 2 - 36) / Math.max(1, n - 1 || 1));
      if (n === 1) fx = x;
      c.save();
      c.strokeStyle = 'rgba(60,40,20,.6)'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(fx, y - 92); c.lineTo(fx, y - 66); c.stroke();
      c.restore();
      if (A.fruit) A.fruit(c, fx, y - 52, 20, ['fragola', 'mela', 'uva', 'banana', 'melone'][i % 5]);
    }
  }

  function drawItem(c, it) {
    if (it.taken > 0) return;
    var x = px(it.s, it.lat), y = py(it.s, it.lat);
    var g = 1 + it.glow * 0.6;
    var bob = Math.sin(S.t * 3 + it.s) * 4;
    c.save();
    c.translate(x, y + bob);
    c.scale(g, g);
    if (it.kind === 'fruit') {
      if (A.fruit) A.fruit(c, 0, 0, 20, it.fruit);
    } else if (it.kind === 'wind') {
      c.fillStyle = C.leafLight;
      c.beginPath();
      c.ellipse(0, 0, 22, 12, Math.sin(S.t * 4) * 0.4, 0, 7);
      c.fill();
      c.strokeStyle = C.leafDark; c.lineWidth = 3; c.stroke();
    } else if (it.kind === 'pool') {
      c.globalAlpha = 0.7; c.fillStyle = C.water;
      c.beginPath(); c.ellipse(0, 0, 34, 15, 0, 0, 7); c.fill();
      c.globalAlpha = 0.5; c.strokeStyle = '#fff'; c.lineWidth = 3;
      c.beginPath(); c.ellipse(0, 0, 22, 9, 0, 0, 7); c.stroke();
    } else if (it.kind === 'hat' && A.hat) {
      A.hat(c, 0, 0, 54, it.hat);
    }
    c.restore();
    if (it.glow > 0) {
      c.save(); c.globalAlpha = it.glow * 0.7;
      c.strokeStyle = C.sun; c.lineWidth = 5;
      c.beginPath(); c.arc(x, y + bob, 34, 0, 7); c.stroke();
      c.restore();
    }
  }

  /* An egg shell with wooden wheels, seen from above. Only the shell rotates:
     A.dino is drawn in profile and anchored at the feet, so turning it through
     360 degrees would mean drawing the dino from eight angles — by a distance
     the most expensive art this project has ever been asked for. The dino stays
     upright inside a shell that turns, and reads perfectly. */
  function drawKart(c, k) {
    var p = at(k.s);
    var x = p.x + p.nx * k.lat, y = p.y + p.ny * k.lat;
    var ang = Math.atan2(p.dy, p.dx);
    var sc = k.me ? 1.22 : 1;
    var wob = Math.sin(S.t * 8 + k.wob) * 0.05;

    c.save();
    c.globalAlpha = 0.22; c.fillStyle = k.me ? k.color : '#20140a';
    c.beginPath(); c.ellipse(x, y + 10, 40 * sc, 18 * sc, 0, 0, 7); c.fill();
    c.restore();

    c.save();
    c.translate(x, y);
    c.rotate(ang + wob);
    c.scale(sc, sc);
    c.fillStyle = C.barkDark;                        // wheels
    [[-20, -22], [-20, 22], [20, -22], [20, 22]].forEach(function (o) {
      c.beginPath(); c.ellipse(o[0], o[1], 12, 7, 0, 0, 7); c.fill();
    });
    if (A.egg) A.egg(c, 0, 0, 62, { color: k.color });
    else {
      c.fillStyle = k.color;
      c.beginPath(); c.ellipse(0, 0, 30, 22, 0, 0, 7); c.fill();
    }
    c.restore();

    /* The dino sits upright in the shell, never rotated. */
    if (A.dino) {
      var o = { facing: p.dx >= 0 ? 1 : -1, pose: 'happy', t: G.t, color: k.color };
      if (!k.me) o.hat = null;                       // a friend, not the player
      A.dino(c, x, y + 6 * sc, 74 * sc, o);
    }

    if (k.me) {                                      // the marker that never turns off
      var fy = y - 74 * sc - 16 + Math.sin(S.t * 3) * 5;
      c.save();
      c.fillStyle = C.sun; c.strokeStyle = C.ink; c.lineWidth = 3;
      c.beginPath();
      c.moveTo(x, fy + 16); c.lineTo(x - 14, fy - 8); c.lineTo(x + 14, fy - 8);
      c.closePath(); c.fill(); c.stroke();
      c.restore();
    } else if (k.stop > 0) {
      G.text('mmm!', x, y - 62, {
        ctx: c, size: 22, color: C.cream, stroke: 'rgba(43,29,18,.7)', strokeWidth: 6
      });
    }
  }

  /* An affordance, not a target: the whole screen below the HUD is the pedal.
     Deliberately NOT a G.ui button with hold:true — that flag is wired to the
     parents' gate in the core, and a pedal registered that way would open the
     grown-up menu after 1.4 seconds of accelerating. */
  function drawPedal(c) {
    var down = S.thr > 0.35;
    var y = 443 + (down ? 8 : 0);
    c.save();
    c.globalAlpha = 0.9;
    c.fillStyle = down ? C.leafLight : C.leaf;
    c.beginPath(); c.ellipse(CX, y, 104, 62, 0, 0, 7); c.fill();
    c.strokeStyle = C.leafDark; c.lineWidth = 6; c.stroke();
    c.globalAlpha = 0.30 + S.thr * 0.55;
    c.fillStyle = C.sun;
    c.beginPath(); c.ellipse(CX, y, 88 * (0.4 + S.thr * 0.6), 50 * (0.4 + S.thr * 0.6), 0, 0, 7); c.fill();
    c.restore();
  }

  function drawLights(c) {
    var k = Math.min(3, Math.floor(S.t) + 1), i;
    for (i = 0; i < 3; i++) {
      c.save();
      c.fillStyle = i < k ? (i === 2 ? C.leafLight : C.sun) : 'rgba(255,246,224,.30)';
      c.beginPath(); c.arc(CX - 90 + i * 90, 250, 34, 0, 7); c.fill();
      c.strokeStyle = C.ink; c.lineWidth = 5; c.stroke();
      c.restore();
    }
    G.text(k >= 3 ? 'VIA!' : 'Pronti...', CX, 340, {
      ctx: c, size: 54, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 11
    });
  }

  /* No position, no placing, no order of arrival — here or anywhere else. */
  function drawFinish(c) {
    c.save();
    c.fillStyle = 'rgba(9,32,21,.45)'; c.fillRect(0, 0, W, H);
    c.restore();
    A.panel(c, 300, 190, 680, 340, { r: 32 });
    G.text('Che bel giro!', CX, 268, { ctx: c, size: 56, color: C.ink });
    if (A.fruit) A.fruit(c, 520, 350, 30, 'fragola');
    G.text('+' + S.banked, 570, 352, { ctx: c, size: 46, color: C.ink, align: 'left' });
    if (G.starIcon) G.starIcon(c, 720, 350, 28);
    G.text('+1', 762, 352, { ctx: c, size: 46, color: C.ink, align: 'left' });
    G.ui.button({
      id: 'kagain', x: 350, y: 400, w: 280, h: 104, r: 28, color: C.leaf,
      label: 'Ancora!', fontSize: 38, onTap: function () { reset(); }
    });
    G.ui.button({
      id: 'kleave', x: 660, y: 400, w: 280, h: 104, r: 28, color: C.tangerine,
      label: 'Giungla', fontSize: 34, onTap: function () { G.home(); }
    });
  }
})();


/* ==================== 90-account.js ==================== */
/* Accounts: who is playing. Each child gets their own dino, their own save and
   an optional 3-icon "secret" instead of a password — a 3-year-old cannot type
   but can absolutely remember "cuore, stella, luna".
   This is a family lock, not security: it keeps two siblings out of each
   other's progress, nothing more. */
(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;

  var COLORS = [C.dino, C.blueberry, C.pinkPop, C.tangerine, C.plum, C.water];

  var SECRET_KEYS = [
    { shape: 'cerchio', color: C.berry, name: 'cerchio rosso' },
    { shape: 'quadrato', color: C.blueberry, name: 'quadrato blu' },
    { shape: 'triangolo', color: C.mint, name: 'triangolo verde' },
    { shape: 'cuore', color: C.pinkPop, name: 'cuore rosa' },
    { shape: 'stella', color: C.sun, name: 'stella gialla' },
    { shape: 'fiore', color: C.plum, name: 'fiore viola' },
    { shape: 'luna', color: C.tangerine, name: 'luna arancione' },
    { shape: 'rombo', color: C.water, name: 'rombo azzurro' },
    { shape: 'quadrato', color: C.leafLight, name: 'quadrato verde' }
  ];

  function secretIcon(c, x, y, r, i) {
    var k = SECRET_KEYS[i % SECRET_KEYS.length];
    var f = window.A && A.SHAPES && A.SHAPES[k.shape];
    if (f) { f(c, x, y, r, k.color); return; }
    c.save(); c.fillStyle = k.color; c.strokeStyle = C.ink; c.lineWidth = 4;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.stroke(); c.restore();
  }

  /* `gear` is a look object from G.look (see 01c-art-gear.js). Pass one when
     drawing SOMEBODY ELSE'S dino; pass nothing for the current player and
     A.dino resolves the current save itself.
     Every account gets its OWN buffer — this screen draws up to five dinos in
     a single frame, and a shared one would put the last child's hat on all of
     them. To a three-year-old that is not a glitch, that is a theft. */
  function dinoPreview(c, x, y, s, color, gear, pose) {
    if (window.A && A.dino) {
      var o = { color: color, pose: pose || 'idle', t: G.t, facing: 1 };
      if (gear) o.gear = gear;
      A.dino(c, x, y, s, o);
      return;
    }
    c.save(); c.fillStyle = color || C.dino;
    c.beginPath(); c.ellipse(x, y - s * .3, s * .32, s * .3, 0, 0, 7); c.fill(); c.restore();
  }

  function backdrop(c, title) {
    if (window.A && A.jungle) A.jungle(c, G.t, { dim: .35 });
    else { c.fillStyle = C.leafDeep; c.fillRect(0, 0, W, H); }
    c.save();
    c.fillStyle = 'rgba(10,32,20,.34)';
    c.fillRect(0, 0, W, H);
    c.restore();
    if (title) G.text(title, W / 2, 78, { size: 60, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 12 });
    if (window.A && A.canopy) A.canopy(c, G.t);
  }

  /* ------------------------------------------------------- scene: accesso */
  var lookCache = {};     // account id -> its OWN look buffer, read once per entry

  G.scene('accesso', {
    hud: false, back: false,
    enter: function () {
      lookCache = {};
      G.accounts.list().forEach(function (a) {
        lookCache[a.id] = G.look(G.LS.get('dg.save.' + a.id, {}) || {}, {});
      });
      var n = G.accounts.list().length;
      setTimeout(function () {
        if (G.current !== 'accesso') return;
        G.say(n ? 'Chi gioca oggi?' : 'Benvenuto! Facciamo il tuo dinosauro.');
      }, 500);
    },
    draw: function (c) {
      backdrop(c, 'Chi gioca?');

      var list = G.accounts.list();
      var items = list.slice(0, 5);
      var n = items.length + 1;
      var cw = 214, gap = 24;
      var total = n * cw + (n - 1) * gap;
      var x0 = (W - total) / 2, y = 186, ch = 348;

      items.forEach(function (a, i) {
        var x = x0 + i * (cw + gap);
        var wob = Math.sin(G.t * 1.6 + i) * 4;
        c.save();
        if (window.A && A.panel) A.panel(c, x, y + wob, cw, ch, { r: 28 });
        else { c.fillStyle = C.cream; G.roundRect(c, x, y + wob, cw, ch, 28); c.fill(); }
        c.restore();
        dinoPreview(c, x + cw / 2, y + wob + 236, 176, a.color, lookCache[a.id] || null);
        G.text(a.name, x + cw / 2, y + wob + 282, { size: 34, color: C.ink, maxWidth: cw - 26 });
        // age badge
        c.save();
        c.fillStyle = a.level === 2 ? C.blueberry : C.tangerine;
        G.roundRect(c, x + cw / 2 - 62, y + wob + 300, 124, 34, 17); c.fill();
        G.text(a.level === 2 ? 'Grande' : 'Piccolo', x + cw / 2, y + wob + 318, { size: 22, color: '#fff' });
        c.restore();
        if (a.secret) {
          c.save(); c.globalAlpha = .85;
          secretIcon(c, x + cw - 30, y + wob + 30, 15, 4);
          c.restore();
        }
        G.ui.button({
          id: 'acct' + a.id, x: x, y: y + wob, w: cw, h: ch, r: 28, ghost: true,
          onTap: function () {
            if (a.secret) G.go('segreto', { id: a.id });
            else { G.accounts.login(a.id); G.go('giungla'); }
          }
        });
      });

      // new player card
      var xn = x0 + items.length * (cw + gap);
      var wn = Math.sin(G.t * 1.6 + items.length) * 4;
      G.ui.button({
        id: 'nuovo', x: xn, y: y + wn, w: cw, h: ch, r: 28, color: C.leaf,
        icon: function (cc, cx, cy, s) {
          cc.save();
          cc.strokeStyle = '#fff'; cc.lineWidth = 16; cc.lineCap = 'round';
          cc.beginPath();
          cc.moveTo(cx, cy - 96); cc.lineTo(cx, cy - 20);
          cc.moveTo(cx - 38, cy - 58); cc.lineTo(cx + 38, cy - 58);
          cc.stroke(); cc.restore();
        },
        onTap: function () { G.go('nuovo'); }
      });
      G.text('Nuovo', xn + cw / 2, y + wn + ch - 92, { size: 34, color: '#fff', stroke: 'rgba(0,0,0,.25)' });
      G.text('giocatore', xn + cw / 2, y + wn + ch - 54, { size: 30, color: '#fff', stroke: 'rgba(0,0,0,.25)' });

      // discreet parent door
      G.ui.round({
        id: 'gear-login', x: W - 56, y: H - 52, r: 30, color: 'rgba(255,246,224,.55)',
        icon: function (cc, x, yy, r) {
          cc.save(); cc.fillStyle = C.ink;
          for (var i = 0; i < 8; i++) {
            var a = i * Math.PI / 4 + G.t * .4;
            cc.save(); cc.translate(x + Math.cos(a) * r * .5, yy + Math.sin(a) * r * .5); cc.rotate(a);
            cc.fillRect(-3, -5, 10, 10); cc.restore();
          }
          cc.beginPath(); cc.arc(x, yy, r * .32, 0, 7); cc.fill();
          cc.fillStyle = 'rgba(255,246,224,.9)'; cc.beginPath(); cc.arc(x, yy, r * .13, 0, 7); cc.fill();
          cc.restore();
        },
        onTap: function () { G.go('gate', { then: 'genitori', back: 'accesso' }); }
      });
    }
  });

  /* ------------------------------------------------------- scene: segreto */
  var sg = { id: null, taps: [], shake: 0, fails: 0, look: null };

  G.scene('segreto', {
    hud: false, back: false,
    enter: function (p) {
      sg.id = p && p.id; sg.taps = []; sg.shake = 0; sg.fails = 0;
      sg.look = sg.id ? G.look(G.LS.get('dg.save.' + sg.id, {}) || {}, {}) : null;
      var a = G.accounts.byId(sg.id);
      setTimeout(function () {
        if (G.current !== 'segreto') return;
        G.say('Ciao ' + (a ? a.name : '') + '! Tocca il tuo segreto.');
      }, 420);
    },
    update: function (dt) { if (sg.shake > 0) sg.shake = Math.max(0, sg.shake - dt * 4); },
    draw: function (c) {
      var a = G.accounts.byId(sg.id);
      if (!a) { G.go('accesso'); return; }
      backdrop(c, null);

      dinoPreview(c, 250, 470, 250, a.color, sg.look, sg.shake > 0 ? 'think' : 'idle');
      G.text('Ciao ' + a.name + '!', 250, 200, { size: 52, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 10 });
      G.text('Tocca il tuo segreto', 250, 258, { size: 30, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8, weight: 700 });

      // progress slots
      var i;
      for (i = 0; i < 3; i++) {
        var sx = 250 + (i - 1) * 76, sy = 316;
        c.save();
        c.fillStyle = 'rgba(255,246,224,.35)';
        c.beginPath(); c.arc(sx, sy, 28, 0, 7); c.fill();
        c.restore();
        if (sg.taps[i] !== undefined) secretIcon(c, sx, sy, 22, sg.taps[i]);
      }

      // 3x3 pad
      var px = 690, py = 148, cell = 150, gap = 14;
      var jitter = sg.shake > 0 ? Math.sin(G.t * 50) * sg.shake * 10 : 0;
      for (i = 0; i < 9; i++) {
        var gx = px + (i % 3) * (cell + gap) + jitter;
        var gy = py + Math.floor(i / 3) * (cell + gap);
        (function (idx, bx, by) {
          G.ui.button({
            id: 'sk' + idx, x: bx, y: by, w: cell, h: cell, r: 26, color: C.cream,
            icon: function (cc, cx, cy) { secretIcon(cc, cx, cy, cell * .3, idx); },
            onTap: function () {
              sg.taps.push(idx);
              G.sfx('pop');
              if (sg.taps.length === 3) {
                var ok = a.secret && a.secret.length === 3 && a.secret.every(function (v, k) { return v === sg.taps[k]; });
                if (ok) {
                  G.sfx('good');
                  G.accounts.login(a.id);
                  G.go('giungla');
                } else {
                  sg.fails++; sg.shake = 1; sg.taps = [];
                  G.sfx('bad'); G.shake(6);
                  G.say(G.pick(['Ops! Riprova.', 'Non e questo, riprova!', 'Ancora una volta.']));
                }
              }
            }
          });
        })(i, gx, gy);
      }

      G.ui.button({
        x: 40, y: H - 108, w: 250, h: 84, r: 24, color: C.bark, label: 'Indietro',
        onTap: function () { G.go('accesso'); }
      });
      if (sg.fails >= 3) {
        G.ui.button({
          x: 320, y: H - 108, w: 320, h: 84, r: 24, color: C.tangerine, label: 'Chiedi a un grande',
          fontSize: 28,
          onTap: function () { G.go('gate', { then: '@login', arg: a.id, back: 'segreto', backArg: { id: a.id } }); }
        });
      }
    }
  });

  /* --------------------------------------------------------- scene: nuovo */
  var nu = { step: 0, name: '', color: COLORS[0], level: 1, secret: [] };

  G.scene('nuovo', {
    hud: false, back: false,
    enter: function () {
      nu = { step: 0, name: '', color: COLORS[0], level: 1, secret: [] };
      G.prompt('Come ti chiami?', '', function (v) {
        if (v === null || !v) { G.go('accesso'); return; }
        nu.name = v.slice(0, 14);
        nu.step = 1;
        G.say('Ciao ' + nu.name + '! Di che colore e il tuo dino?');
      });
    },
    draw: function (c) {
      backdrop(c, null);
      var titles = ['', 'Scegli il colore', 'Quanti anni hai?', 'Scegli il tuo segreto'];
      G.text(titles[nu.step] || '', W / 2, 74, { size: 52, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 11 });

      if (nu.step === 1) {
        dinoPreview(c, W / 2, 430, 240, nu.color);
        G.text(nu.name, W / 2, 470, { size: 40, color: C.cream, stroke: 'rgba(12,40,25,.7)', strokeWidth: 9 });
        var bw = 128, bg = 18, tot = COLORS.length * bw + (COLORS.length - 1) * bg, x0 = (W - tot) / 2;
        COLORS.forEach(function (col, i) {
          G.ui.button({
            id: 'col' + i, x: x0 + i * (bw + bg), y: 150, w: bw, h: 116, r: 24, color: col,
            icon: function (cc, cx, cy) {
              if (nu.color === col) {
                cc.save(); cc.strokeStyle = '#fff'; cc.lineWidth = 8; cc.lineCap = 'round'; cc.lineJoin = 'round';
                cc.beginPath(); cc.moveTo(cx - 22, cy); cc.lineTo(cx - 6, cy + 18); cc.lineTo(cx + 24, cy - 18); cc.stroke(); cc.restore();
              }
            },
            onTap: function () { nu.color = col; G.sfx('pop'); }
          });
        });
        G.ui.button({ x: W / 2 - 190, y: H - 116, w: 380, h: 92, r: 26, color: C.leaf, label: 'Avanti', onTap: function () { nu.step = 2; G.say('Quanti anni hai?'); } });
      }

      if (nu.step === 2) {
        [{ lv: 1, t: 'Piccolo', s: '3 - 4 anni', col: C.tangerine }, { lv: 2, t: 'Grande', s: '5 - 7 anni', col: C.blueberry }]
          .forEach(function (o, i) {
            var x = W / 2 - 340 + i * 360;
            G.ui.button({
              id: 'lv' + o.lv, x: x, y: 180, w: 320, h: 300, r: 30,
              color: nu.level === o.lv ? o.col : G.shade(o.col, 40),
              label: o.t, sub: o.s, fontSize: 52,
              onTap: function () { nu.level = o.lv; G.sfx('pop'); }
            });
          });
        G.text(nu.level === 1 ? 'Giochi piu semplici, tutto raccontato a voce'
          : 'Somme, sottrazioni e griglie piu grandi',
          W / 2, 528, { size: 28, color: C.cream, weight: 700, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
        G.ui.button({ x: W / 2 - 190, y: H - 116, w: 380, h: 92, r: 26, color: C.leaf, label: 'Avanti', onTap: function () { nu.step = 3; G.say('Scegli tre figure: sara il tuo segreto.'); } });
      }

      if (nu.step === 3) {
        G.text('Tocca 3 figure e ricordale bene', W / 2, 132, { size: 28, color: C.cream, weight: 700, stroke: 'rgba(12,40,25,.7)', strokeWidth: 8 });
        var i;
        for (i = 0; i < 3; i++) {
          var sx = W / 2 + (i - 1) * 90, sy = 196;
          c.save(); c.fillStyle = 'rgba(255,246,224,.32)';
          c.beginPath(); c.arc(sx, sy, 32, 0, 7); c.fill(); c.restore();
          if (nu.secret[i] !== undefined) secretIcon(c, sx, sy, 25, nu.secret[i]);
        }
        var px = W / 2 - 236, py = 254, cell = 140, gap = 16;
        for (i = 0; i < 9; i++) {
          (function (idx) {
            var bx = px + (idx % 3) * (cell + gap), by = py + Math.floor(idx / 3) * (cell + gap);
            G.ui.button({
              id: 'nk' + idx, x: bx, y: by, w: cell, h: cell, r: 24, color: C.cream,
              disabled: nu.secret.length >= 3,
              icon: function (cc, cx, cy) { secretIcon(cc, cx, cy, cell * .29, idx); },
              onTap: function () { nu.secret.push(idx); G.sfx('pop'); }
            });
          })(i);
        }
        G.ui.button({
          x: 40, y: H - 116, w: 260, h: 92, r: 26, color: C.bark, label: 'Rifai', fontSize: 34,
          onTap: function () { nu.secret = []; }
        });
        G.ui.button({
          x: W - 300, y: H - 116, w: 260, h: 92, r: 26, color: C.leafDark, label: 'Senza segreto', fontSize: 24,
          onTap: function () { nu.secret = []; finish(); }
        });
        if (nu.secret.length === 3) {
          G.ui.button({
            x: W / 2 - 170, y: H - 116, w: 340, h: 92, r: 26, color: C.leaf, label: 'Fatto!', onTap: finish
          });
        }
      }
    }
  });

  function finish() {
    var a = G.accounts.create({ name: nu.name, color: nu.color, level: nu.level, secret: nu.secret.length === 3 ? nu.secret : null });
    G.accounts.login(a.id);
    G.fx.confetti(); G.sfx('win');
    G.go('giungla');
    setTimeout(function () { G.say('Benvenuto nella giungla, ' + a.name + '!'); }, 900);
  }

  /* ---------------------------------------------------------- scene: gate */
  var gt = { a: 0, b: 0, typed: '', then: null, arg: null, back: 'giungla', backArg: null, shake: 0 };

  G.scene('gate', {
    hud: false, back: false,
    enter: function (p) {
      p = p || {};
      gt.a = G.rndi(6, 9); gt.b = G.rndi(6, 9);
      gt.typed = ''; gt.shake = 0;
      gt.then = p.then || 'genitori'; gt.arg = p.arg || null;
      gt.back = p.back || 'giungla'; gt.backArg = p.backArg || null;
    },
    update: function (dt) { if (gt.shake > 0) gt.shake = Math.max(0, gt.shake - dt * 4); },
    draw: function (c) {
      backdrop(c, null);
      c.save(); c.fillStyle = 'rgba(8,26,18,.5)'; c.fillRect(0, 0, W, H); c.restore();

      G.text('Solo per i grandi', W / 2, 96, { size: 50, color: C.cream, stroke: 'rgba(0,0,0,.5)', strokeWidth: 10 });

      var jitter = gt.shake > 0 ? Math.sin(G.t * 48) * gt.shake * 12 : 0;
      c.save();
      if (window.A && A.panel) A.panel(c, 150 + jitter, 176, 460, 300, { r: 28 });
      else { c.fillStyle = C.cream; G.roundRect(c, 150 + jitter, 176, 460, 300, 28); c.fill(); }
      c.restore();
      G.text(gt.a + ' × ' + gt.b + ' = ?', 380 + jitter, 268, { size: 72, color: C.ink });
      c.save();
      c.fillStyle = '#fffdf6'; c.strokeStyle = '#cdb389'; c.lineWidth = 5;
      G.roundRect(c, 220 + jitter, 336, 320, 96, 20); c.fill(); c.stroke();
      c.restore();
      G.text(gt.typed || '–', 380 + jitter, 386, { size: 58, color: C.ink });

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'];
      var kx = 700, ky = 168, kw = 150, kh = 116, kg = 14;
      keys.forEach(function (k, i) {
        var x = kx + (i % 3) * (kw + kg), y = ky + Math.floor(i / 3) * (kh + kg);
        G.ui.button({
          id: 'g' + k, x: x, y: y, w: kw, h: kh, r: 22,
          color: k === 'OK' ? C.leaf : k === 'C' ? C.berry : C.cream,
          textColor: (k === 'OK' || k === 'C') ? '#fff' : C.ink,
          outline: (k === 'OK' || k === 'C') ? 'rgba(0,0,0,.2)' : 'rgba(0,0,0,0)',
          label: k, fontSize: 44,
          onTap: function () {
            if (k === 'C') { gt.typed = ''; return; }
            if (k === 'OK') {
              if (parseInt(gt.typed, 10) === gt.a * gt.b) {
                G.sfx('good');
                if (gt.then === '@login') { G.accounts.login(gt.arg); G.go('giungla'); }
                else G.go(gt.then, gt.arg);
              } else { gt.shake = 1; gt.typed = ''; G.sfx('bad'); }
              return;
            }
            if (gt.typed.length < 3) gt.typed += k;
          }
        });
      });

      G.ui.button({
        x: 150, y: H - 108, w: 300, h: 84, r: 24, color: C.bark, label: 'Annulla',
        onTap: function () { G.go(gt.back, gt.backArg); }
      });
    }
  });

  /* ------------------------------------------------------ scene: genitori */
  var pm = { confirmReset: 0, confirmDel: 0 };

  function fmtTime(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return h > 0 ? h + 'h ' + m + 'm' : m + ' min';
  }

  G.scene('genitori', {
    hud: false, back: false,
    enter: function () { pm.confirmReset = 0; pm.confirmDel = 0; G.hush(); },
    update: function (dt) {
      if (pm.confirmReset > 0) pm.confirmReset = Math.max(0, pm.confirmReset - dt);
      if (pm.confirmDel > 0) pm.confirmDel = Math.max(0, pm.confirmDel - dt);
    },
    draw: function (c) {
      backdrop(c, null);
      c.save(); c.fillStyle = 'rgba(8,26,18,.55)'; c.fillRect(0, 0, W, H); c.restore();
      G.text('Impostazioni', W / 2, 66, { size: 46, color: C.cream, stroke: 'rgba(0,0,0,.5)', strokeWidth: 9 });

      var a = G.account;

      // left: current player card
      c.save();
      if (window.A && A.panel) A.panel(c, 60, 110, 400, 520, { r: 28 });
      else { c.fillStyle = C.cream; G.roundRect(c, 60, 110, 400, 520, 28); c.fill(); }
      c.restore();

      if (a) {
        dinoPreview(c, 260, 366, 210, a.color);   // current player: A.dino reads the live save
        G.text(a.name, 260, 410, { size: 40, color: C.ink });
        G.text(a.level === 2 ? 'Grande (5-7 anni)' : 'Piccolo (3-4 anni)', 260, 452, { size: 24, color: '#7a6a58', weight: 700 });
        G.text('Frutti ' + Math.floor(G.save.fruits) + '   Stelline ' + Math.floor(G.save.stars), 260, 496, { size: 24, color: C.ink, weight: 800 });
        G.text('Ha giocato ' + fmtTime(G.save.playSec || 0), 260, 530, { size: 22, color: '#7a6a58', weight: 700 });
        G.text('Cappelli ' + (G.save.hats ? G.save.hats.length : 0) + '/8', 260, 562, { size: 22, color: '#7a6a58', weight: 700 });
      } else {
        G.text('Nessun giocatore', 260, 360, { size: 32, color: C.ink });
        G.text('collegato', 260, 400, { size: 32, color: C.ink });
      }

      // right: actions
      var bx = 500, bw = 360, bh = 76, gap = 14, y = 118;
      function row(label, color, onTap, sub, disabled) {
        G.ui.button({ x: bx, y: y, w: bw, h: bh, r: 22, color: color, label: label, sub: sub, fontSize: 30, onTap: onTap, disabled: disabled });
        y += bh + gap;
      }

      row('Torna al gioco', C.leaf, function () { G.go(a ? 'giungla' : 'accesso'); });
      row('Cambia giocatore', C.blueberry, function () { G.accounts.logout(); G.go('accesso'); });

      if (a) {
        row('Cambia nome', C.bark, function () {
          G.prompt('Nome del giocatore', a.name, function (v) {
            if (v) { G.accounts.update(a.id, { name: v.slice(0, 14) }); }
          });
        });
        row(a.level === 2 ? 'Eta: Grande' : 'Eta: Piccolo', C.tangerine, function () {
          var nl = a.level === 2 ? 1 : 2;
          G.accounts.update(a.id, { level: nl }); G.level = nl;
        }, 'tocca per cambiare');
        row('Cambia colore', C.plum, function () {
          var i = COLORS.indexOf(a.color);
          var nc = COLORS[(i + 1) % COLORS.length];
          G.accounts.update(a.id, { color: nc });
        });
        row(pm.confirmReset > 0 ? 'Sicuro? Tocca ancora' : 'Azzera i progressi', pm.confirmReset > 0 ? C.berry : '#a8998a', function () {
          if (pm.confirmReset > 0) {
            var keep = { fruits: 0, stars: 0, mute: G.save.mute, hat: null, hats: [], conta: {}, fili: {}, nido: {}, seen: {}, playSec: 0, updated: 0 };
            G.save = keep; G.saveFlush(); pm.confirmReset = 0; G.sfx('pop');
          } else { pm.confirmReset = 4; }
        }, pm.confirmReset > 0 ? 'annulla fra ' + Math.ceil(pm.confirmReset) + 's' : null);
        row(pm.confirmDel > 0 ? 'Sicuro? Tocca ancora' : 'Elimina giocatore', pm.confirmDel > 0 ? C.berry : '#a8998a', function () {
          if (pm.confirmDel > 0) {
            var id = a.id; G.accounts.logout(); G.accounts.remove(id); G.go('accesso');
          } else { pm.confirmDel = 4; }
        }, pm.confirmDel > 0 ? 'annulla fra ' + Math.ceil(pm.confirmDel) + 's' : null);
      }

      // footer
      var syncTxt = G.cloud && G.cloud.on ? ('sincronizzazione: ' + G.cloud.state) : 'salvataggio locale su questo dispositivo';
      G.text('Dino Giungla · ' + syncTxt, W / 2, H - 30, { size: 20, color: 'rgba(255,246,224,.72)', weight: 700 });

      G.ui.round({
        id: 'fs', x: W - 60, y: 58, r: 34, color: C.cream,
        icon: function (cc, x, yy, r) {
          cc.save(); cc.strokeStyle = C.ink; cc.lineWidth = 5; cc.lineJoin = 'round';
          var q = r * .40;
          [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (d) {
            cc.beginPath();
            cc.moveTo(x + d[0] * q, yy + d[1] * q * .3);
            cc.lineTo(x + d[0] * q, yy + d[1] * q);
            cc.lineTo(x + d[0] * q * .3, yy + d[1] * q);
            cc.stroke();
          });
          cc.restore();
        },
        onTap: function () { G.toggleFullscreen && G.toggleFullscreen(); }
      });
      G.text('schermo', W - 60, 104, { size: 18, color: 'rgba(255,246,224,.8)', weight: 700 });
    }
  });
})();


/* ==================== 99-boot.js ==================== */
/* Boot: pick up the last player if there is one, otherwise ask who is playing.
   Also the tablet niceties — fullscreen on first touch, keep the screen awake. */
(function () {
  'use strict';

  /* -------------------------------------------------------- fullscreen */
  G.toggleFullscreen = function () {
    var el = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
      }
    } catch (e) { /* desktop browsers may refuse; harmless */ }
  };

  var askedFullscreen = false;
  function firstTouch() {
    G.resumeAudio();
    if (!askedFullscreen) {
      askedFullscreen = true;
      // Only on touch devices: on a laptop, forcing fullscreen is rude.
      if (matchMedia('(pointer: coarse)').matches && !document.fullscreenElement) G.toggleFullscreen();
    }
    keepAwake();
  }
  window.addEventListener('pointerdown', firstTouch, { once: false, passive: true });

  /* --------------------------------------------------------- wake lock */
  var lock = null;
  function keepAwake() {
    if (lock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      l.addEventListener('release', function () { lock = null; });
    }).catch(function () { lock = null; });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) keepAwake();
  });

  /* ------------------------------------------------------- speech warmup */
  // Android needs the voice list to be requested once before it is populated.
  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) {} }

  /* ---------------------------------------------------------------- go */
  var last = G.accounts.last();
  if (last && G.accounts.byId(last)) {
    var a = G.accounts.byId(last);
    if (a.secret) {
      // Someone was playing here: still ask for the secret, siblings share tablets.
      G.start('segreto', { id: a.id });
    } else {
      G.accounts.login(a.id);
      G.start('giungla');
    }
  } else {
    G.start('accesso');
  }
})();
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
